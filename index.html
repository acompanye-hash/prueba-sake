<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>ARUME V60 · Definitive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        :root { --bg: #f8fafc; --paper: #ffffff; --text: #0f172a; --sub: #64748b; --primary: #0f172a; --accent: #2563eb; --success: #16a34a; --danger: #dc2626; --warn: #d97706; --border: #e2e8f0; --radius: 12px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 110px; min-height: 100vh; }
        header { background: var(--paper); padding: 15px 20px; position: sticky; top: 0; z-index: 50; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        h1 { margin: 0; font-size: 1.3rem; font-weight: 900; letter-spacing: -0.5px; color: var(--primary); display:flex; align-items:center; gap:8px; }
        .badge { padding: 6px 12px; border-radius: 99px; font-size: 0.75rem; background: #f1f5f9; color: var(--text); font-weight: 700; border: 1px solid var(--border); cursor: pointer; display: flex; align-items:center; gap:8px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; } .dot.ok { background: var(--success); box-shadow: 0 0 6px var(--success); }
        main { max-width: 900px; margin: 0 auto; padding: 20px; animation: fade 0.3s ease-out; }
        @keyframes fade { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .card { background: var(--paper); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; border: 1px solid var(--border); box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .section-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f8fafc; padding-bottom: 12px; margin-bottom: 15px; }
        .title { font-size: 0.85rem; font-weight: 900; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; }
        .row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; } .col { flex: 1; min-width: 140px; }
        label { display: block; font-size: 0.7rem; font-weight: 700; color: var(--sub); margin-bottom: 5px; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; background: #fff; font-family: inherit; margin-bottom: 10px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #bfdbfe; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; font-size: 1rem; text-align: center; margin-top: 5px; transition: 0.1s; display: inline-flex; justify-content:center; align-items:center; gap:8px; }
        .btn:active { transform: scale(0.97); opacity: 0.9; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-accent { background: var(--accent); color: white; }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-danger { background: #fee2e2; color: var(--danger); }
        .btn-sm { width: auto; padding: 8px 16px; font-size: 0.8rem; margin: 0; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 10px; border-bottom: 1px solid #f1f5f9; transition: 0.1s; cursor: pointer; }
        nav { position: fixed; bottom: 0; width: 100%; background: rgba(255,255,255,0.96); backdrop-filter: blur(8px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; gap:4px; padding:6px; z-index:60; }
        nav button { background: none; border: none; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--sub); font-size: 0.65rem; font-weight: 700; padding: 5px 8px; border-radius:8px; }
        nav button.active { opacity: 1; color: var(--accent); transform: translateY(-3px); }
        nav button svg { width: 26px; height: 26px; fill: currentColor; }
        .hidden { display: none !important; }
        .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); z-index: 100; backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; }
        .modal { background: white; width: 95%; max-width: 700px; max-height: 90vh; overflow-y: auto; padding: 25px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        #pin-screen { background: #0f172a; color: white; }
        .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 30px; max-width: 320px; margin-left: auto; margin-right: auto; }
        .pin-btn { height: 75px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); font-size: 1.8rem; color: white; cursor: pointer; font-weight: 600; }
        #toast-container { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); z-index: 200; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { background: #1e293b; color: white; padding: 14px 20px; border-radius: 12px; font-size: 0.95rem; font-weight: 600; animation: slideUp 0.3s ease forwards; }
        @keyframes slideUp { from{opacity:0; transform:translateY(20px) translateX(-50%)} to{opacity:1; transform:translateY(0) translateX(-50%)} }
        
        /* ESTILOS NUEVOS V60 */
        .aller-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 8px; margin-top: 10px; }
        .aller-item { border: 1px solid var(--border); border-radius: 8px; padding: 5px; text-align: center; cursor: pointer; opacity: 0.4; font-size: 1.2rem; }
        .aller-item.active { opacity: 1; background: #dbeafe; border-color: var(--accent); transform: scale(1.1); }
        .tag { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; background: #f1f5f9; font-weight: 700; margin-right: 4px; }
    </style>
</head>
<body>

    <div id="toast-container"></div>
    <input type="file" id="backup-input" style="display:none" accept=".json" onchange="restoreBackup(this)">
    <input type="file" id="alb-photo" style="display:none" accept="image/*" capture="environment">

    <header>
        <h1>ARUME <span style="font-size:0.6em; opacity:0.6; font-weight:400">V60</span></h1>
        <button id="user-display" class="badge" onclick="logout()">
            <div id="sync-dot" class="dot"></div> <span id="user-name">...</span>
        </button>
    </header>

    <main id="app"></main>
    <nav id="navbar"></nav>

    <div id="modal-overlay" class="overlay hidden">
        <div class="modal">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px; align-items:center;">
                <h3 id="m-title" style="margin:0; font-size:1.2rem; font-weight:900; color:var(--primary)"></h3>
                <button onclick="closeModal()" style="background:none;border:none;font-size:2rem;cursor:pointer;color:var(--sub);line-height:1">&times;</button>
            </div>
            <div id="m-body"></div>
        </div>
    </div>

    <div id="pin-screen" class="overlay" style="opacity:1">
        <div class="modal" style="text-align:center; background:transparent; box-shadow:none; color:white">
            <h2 style="font-size:3rem; margin:0; letter-spacing:2px; font-weight:900">ARUME</h2>
            <div id="pin-display" style="font-size:3rem; font-weight:800; letter-spacing:15px; min-height:60px">****</div>
            <div class="pin-grid">
                <button class="pin-btn" onclick="pinInput('1')">1</button><button class="pin-btn" onclick="pinInput('2')">2</button><button class="pin-btn" onclick="pinInput('3')">3</button>
                <button class="pin-btn" onclick="pinInput('4')">4</button><button class="pin-btn" onclick="pinInput('5')">5</button><button class="pin-btn" onclick="pinInput('6')">6</button>
                <button class="pin-btn" onclick="pinInput('7')">7</button><button class="pin-btn" onclick="pinInput('8')">8</button><button class="pin-btn" onclick="pinInput('9')">9</button>
                <button class="pin-btn" style="color:var(--danger); border-color:rgba(239,68,68,0.3)" onclick="pinClear()">C</button>
                <button class="pin-btn" onclick="pinInput('0')">0</button>
                <button class="pin-btn" style="background:var(--success); border:none; color:#022c22" onclick="pinCheck()">OK</button>
            </div>
        </div>
    </div>

<script>
/* ================= 1. CONFIGURACIÓN COMPLETA ================= */
const generateID = () => crypto.randomUUID ? crypto.randomUUID() : Date.now().toString() + Math.random().toString(36).substring(2);
const getISO = () => new Date().toISOString().split('T')[0];

// AQUI ESTA TU URL YA PEGADA
const CONFIG = { 
    GOOGLE_URL: "https://script.google.com/macros/s/AKfycbxL0hWPiYmQ_590bkFjd1B9xwsfrYQXQtEuUpP2Nraq973bDr2rpEgVnaJCpI3-DH8z/exec", 
    COST_HOUR: 15,
    TARGET_MARGIN: 70
};

const ALLERGENS = [
    {k:'glu', i:'🌾', n:'Gluten'}, {k:'cru', i:'🦐', n:'Crustáceos'}, {k:'hue', i:'🥚', n:'Huevos'}, 
    {k:'pes', i:'🐟', n:'Pescado'}, {k:'cac', i:'🥜', n:'Cacahuetes'}, {k:'soj', i:'🫘', n:'Soja'},
    {k:'lac', i:'🥛', n:'Lácteos'}, {k:'fru', i:'🌰', n:'Frutos C.'}, {k:'api', i:'🥬', n:'Apio'},
    {k:'mos', i:'🌭', n:'Mostaza'}, {k:'ses', i:'🌱', n:'Sésamo'}, {k:'sul', i:'🍷', n:'Sulfitos'},
    {k:'alt', i:'🫘', n:'Altramuces'}, {k:'mol', i:'🐙', n:'Moluscos'}
];

const DB_INIT = {
    users: [{id:'u1', n:'Gerencia', pin:'0150', role:'admin'}, {id:'u2', n:'Cocina', pin:'1111', role:'staff'}],
    ingredientes: [], recetas: [], proveedores: [{n:'Makro'}, {n:'Tokyo-ya'}],
    albaranes: [], facturas: [], diario: [], mermas: [], lastSync: 0
};

let db = JSON.parse(localStorage.getItem('arume_v60')) || DB_INIT;
let currentUser = null, currentPin = "", tempItems = [], tempImg = null;

/* ================= 2. CORE & IDB (FOTOS) ================= */
const idb={db:null,init(){return new Promise(r=>{const q=indexedDB.open('ArumeImg',1);q.onupgradeneeded=e=>e.target.result.createObjectStore('imgs');q.onsuccess=e=>{this.db=e.target.result;r()}})},put(k,v){const tx=this.db.transaction('imgs','readwrite');tx.objectStore('imgs').put(v,k)},get(k){return new Promise(r=>{const tx=this.db.transaction('imgs','readonly');const q=tx.objectStore('imgs').get(k);q.onsuccess=e=>r(e.target.result)})}};idb.init();

function showToast(msg) {
    const box = document.getElementById('toast-container');
    const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `✅ ${msg}`;
    box.appendChild(t); setTimeout(() => t.remove(), 3000);
}

function init() {
    const u = localStorage.getItem('arume_user');
    if(u) { currentUser=JSON.parse(u); document.getElementById('pin-screen').classList.add('hidden'); loadApp(); }
    if(CONFIG.GOOGLE_URL) sync();
}

function save(msg){
    db.lastSync = Date.now();
    localStorage.setItem('arume_v60', JSON.stringify(db));
    if(CONFIG.GOOGLE_URL) fetch(CONFIG.GOOGLE_URL, {method:'POST', mode:'no-cors', body:JSON.stringify(db)});
    if(msg) showToast(msg);
}

async function sync(){
    if(!CONFIG.GOOGLE_URL) return;
    try {
        const r = await fetch(CONFIG.GOOGLE_URL); const c = await r.json();
        if (c && c.lastSync > (db.lastSync || 0)) { db = c; localStorage.setItem('arume_v60', JSON.stringify(db)); location.reload(); }
        document.getElementById('sync-dot').classList.add('ok');
    } catch(e){}
}

/* ================= 3. AUTH ================= */
function pinInput(n){ if(currentPin.length<4)currentPin+=n; document.getElementById('pin-display').innerText="•".repeat(currentPin.length); }
function pinClear(){ currentPin=""; document.getElementById('pin-display').innerText="PIN"; }
function pinCheck(){
    const u = db.users.find(x=>x.pin===currentPin);
    if(u){ currentUser=u; localStorage.setItem('arume_user',JSON.stringify(u)); document.getElementById('pin-screen').classList.add('hidden'); loadApp(); }
    else { alert("PIN Incorrecto"); pinClear(); }
}
function logout(){ localStorage.removeItem('arume_user'); location.reload(); }

/* ================= 4. UI RENDER ================= */
function loadApp() { document.getElementById('user-name').innerText = currentUser.n; renderNav(); render('Diario'); }

function renderNav() {
    const nav = document.getElementById('navbar'); nav.innerHTML='';
    const views = [
        {id:'Diario', l:'DASHBOARD', i:'<path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>'},
        {id:'Admin', l:'GESTIÓN', i:'<path d="M12 2L3 5v6c0 5 3.8 9.7 9 11 5.2-1.3 9-6 9-11V5l-9-3z"/>'},
        {id:'Cocina', l:'COCINA', i:'<path d="M12 2C8.1 6 7 8 7 11c0 3.9 3.1 7 7 7s7-3.1 7-7c0-3-1.1-5-5-9z"/>'},
        {id:'Stock', l:'ALMACÉN', i:'<path d="M20 6h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 1-1-.45-1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 1-1-.45-1-1z"/>'}
    ];
    nav.innerHTML = views.map(v=>`<button id="btn-${v.id}" onclick="render('${v.id}')"><svg viewBox="0 0 24 24">${v.i}</svg>${v.l}</button>`).join('');
}

function render(view) {
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    document.getElementById(`btn-${view}`)?.classList.add('active');
    const app = document.getElementById('app'); app.innerHTML='';

    if(view === 'Diario') {
        app.innerHTML = `
        <div class="card"><div class="section-header"><div class="title">CIERRE DIARIO</div></div>
            <div class="row"><div class="col"><label>Total Z</label><input type="number" id="z-tot"></div><button class="btn btn-primary col" onclick="saveZ()">GUARDAR</button></div>
        </div>
        <div class="card"><canvas id="chartZ"></canvas></div>`;
        new Chart(document.getElementById('chartZ'), {type:'bar', data:{labels:db.diario.slice(-7).map(x=>x.date.slice(5)), datasets:[{label:'Ventas', data:db.diario.slice(-7).map(x=>x.total), backgroundColor:'#2563eb'}]}});
    }

    if(view === 'Admin') {
        app.innerHTML = `<div class="row"><button class="btn btn-accent col" onclick="renderAlb()">📥 Nuevo Albarán</button><button class="btn btn-ghost col" onclick="renderTools()">🛠️ Herramientas</button></div><div id="adm-content" style="margin-top:20px"></div>`;
        renderTools();
    }

    if(view === 'Cocina') {
        app.innerHTML = `<div class="card"><div class="section-header"><div class="title">RECETAS</div><div><button class="btn btn-sm btn-ghost" onclick="verCartaAller()">📜 Alérgenos</button> <button class="btn btn-sm btn-accent" onclick="editRec()">+ Nueva</button></div></div>${db.recetas.map(r=>{
            const c = calcRec(r);
            return `<div class="list-item" onclick="viewRec('${r.id}')"><div><b>${r.n}</b><br>${c.all.map(k=>`<span class="tag">${ALLERGENS.find(x=>x.k==k)?.i}</span>`).join('')}</div><span>${c.t.toFixed(2)}€</span></div>`;
        }).join('')}</div>`;
    }

    if(view === 'Stock') {
        app.innerHTML = `<div class="card"><div class="section-header"><div class="title">STOCK</div><button class="btn btn-sm btn-accent" onclick="whatsapp()">📲 Pedido WhatsApp</button></div><input placeholder="🔍 Buscar..." onkeyup="filterStock(this.value)"><div id="stock-list">${renderStockList()}</div><button class="btn btn-ghost" style="width:100%;margin-top:10px" onclick="editIng()">+ Ingrediente</button></div>`;
    }
}

/* ================= COCINA & ALÉRGENOS ================= */
function calcRec(r){
    let t=0, all=new Set();
    r.items.forEach(it=>{
        if(it.type==='ing'){ const i=db.ingredientes.find(x=>x.id===it.id); if(i){ t+=it.q*i.cost; (i.aller||[]).forEach(x=>all.add(x)); }}
        else { const s=db.recetas.find(x=>x.id===it.id); if(s){ const c=calcRec(s); t+=it.q*c.t; c.all.forEach(x=>all.add(x)); }}
    });
    return {t, all:Array.from(all)};
}
function viewRec(id){
    const r=db.recetas.find(x=>x.id===id); const c=calcRec(r);
    showModal(r.n, `<div class="card" style="text-align:center"><h1>${c.t.toFixed(2)}€</h1><small>Coste Total</small></div>
    <div style="margin-bottom:10px">${c.all.map(k=>`<span class="tag">${ALLERGENS.find(x=>x.k==k)?.n}</span>`).join('')}</div>
    <div class="row"><div class="col"><label>PVP Objetivo</label><input type="number" id="tg-pvp" value="${r.pvp||0}" onchange="calcTarget(this.value, ${c.t})"></div><div class="col"><div id="tg-res" style="padding-top:30px;font-weight:bold"></div></div></div>
    <button class="btn btn-ghost" style="width:100%" onclick="editRec('${id}')">Editar Receta</button>`);
}
function calcTarget(pvp, cost){ document.getElementById('tg-res').innerText = `Margen: ${((1-cost/pvp)*100).toFixed(1)}%`; }
function editRec(id){
    const r = db.recetas.find(x=>x.id===id) || {id:generateID(), n:'', items:[]};
    tempItems = [...r.items];
    showModal('Editar Receta', `<label>Nombre</label><input id="er-n" value="${r.n}"><div id="er-list"></div>
    <div class="row"><select id="er-type" style="flex:1"><option value="ing">Ingrediente</option><option value="sub">Sub-Receta</option></select>
    <select id="er-sel" style="flex:2">${db.ingredientes.map(i=>`<option value="${i.id}">${i.n}</option>`).join('')}</select>
    <input type="number" id="er-q" placeholder="Cant" style="flex:1"><button class="btn btn-accent" onclick="addIt()">+</button></div>
    <button class="btn btn-primary" style="width:100%;margin-top:15px" onclick="saveRec('${r.id}')">GUARDAR</button>`);
    renderIt();
    document.getElementById('er-type').onchange = (e) => {
        const isIng = e.target.value === 'ing';
        document.getElementById('er-sel').innerHTML = isIng ? db.ingredientes.map(i=>`<option value="${i.id}">${i.n}</option>`).join('') : db.recetas.map(i=>`<option value="${i.id}">${i.n}</option>`).join('');
    }
}
function addIt(){ tempItems.push({type:document.getElementById('er-type').value, id:document.getElementById('er-sel').value, q:parseFloat(document.getElementById('er-q').value)}); renderIt(); }
function renderIt(){ document.getElementById('er-list').innerHTML=tempItems.map((x,i)=>`<div class="list-item"><small>${x.type}</small> <b>${db[x.type==='ing'?'ingredientes':'recetas'].find(y=>y.id===x.id)?.n}</b> <span>${x.q}</span> <span style="color:red" onclick="tempItems.splice(${i},1);renderIt()">✕</span></div>`).join(''); }
function saveRec(id){
    const idx = db.recetas.findIndex(x=>x.id===id);
    const r = {id, n:document.getElementById('er-n').value, items:tempItems, pvp:parseFloat(document.getElementById('tg-pvp')?.value)||0};
    if(idx>=0) db.recetas[idx]=r; else db.recetas.push(r);
    save(); closeModal(); render('Cocina');
}
function verCartaAller(){
    let html = db.recetas.map(r=>`<div><b>${r.n}</b>: ${calcRec(r).all.map(k=>ALLERGENS.find(x=>x.k==k)?.i).join(' ')}</div>`).join('<hr>');
    showModal('Carta de Alérgenos', html);
}

/* ================= STOCK & WHATSAPP ================= */
function renderStockList(f=''){
    return db.ingredientes.filter(i=>i.n.toLowerCase().includes(f.toLowerCase())).map(i=>`<div class="list-item" onclick="editIng('${i.id}')"><div><b>${i.n}</b> ${i.aller?.length?'⚠️':''}<br><small>${i.cost}€</small></div><div style="text-align:right"><b>${i.stock}</b> ${i.unit}<br><small>Min: ${i.min||0}</small></div></div>`).join('');
}
function filterStock(v){ document.getElementById('stock-list').innerHTML=renderStockList(v); }
function editIng(id){
    const i = db.ingredientes.find(x=>x.id===id) || {id:generateID(), n:'', cost:0, stock:0, unit:'ud', aller:[]};
    showModal('Editar Ingrediente', `
    <label>Nombre</label><input id="ei-n" value="${i.n}">
    <div class="row"><div class="col"><label>Coste</label><input type="number" id="ei-c" value="${i.cost}"></div><div class="col"><label>Stock</label><input type="number" id="ei-s" value="${i.stock}"></div></div>
    <div class="row"><div class="col"><label>Mínimo</label><input type="number" id="ei-m" value="${i.min||0}"></div><div class="col"><label>Unidad</label><input id="ei-u" value="${i.unit}"></div></div>
    <label>Alérgenos</label><div class="aller-grid">${ALLERGENS.map(a=>`<div class="aller-item ${i.aller.includes(a.k)?'active':''}" onclick="this.classList.toggle('active')">${a.i}<br><small style="font-size:0.6rem">${a.n}</small></div>`).join('')}</div>
    <button class="btn btn-primary" style="width:100%;margin-top:15px" onclick="saveIng('${i.id}')">GUARDAR</button>`);
}
function saveIng(id){
    const items = [...document.querySelectorAll('.aller-item')];
    const aller = ALLERGENS.filter((_,k)=>items[k].classList.contains('active')).map(x=>x.k);
    const ing = {id, n:document.getElementById('ei-n').value, cost:parseFloat(document.getElementById('ei-c').value), stock:parseFloat(document.getElementById('ei-s').value), min:parseFloat(document.getElementById('ei-m').value), unit:document.getElementById('ei-u').value, aller};
    const idx = db.ingredientes.findIndex(x=>x.id===id);
    if(idx>=0) db.ingredientes[idx]=ing; else db.ingredientes.push(ing);
    save(); closeModal(); render('Stock');
}
function whatsapp(){
    const list = db.ingredientes.filter(i=>i.stock <= (i.min||0));
    if(list.length===0) return alert("Todo el stock está correcto.");
    const text = "Hola, pedido Arume:\n" + list.map(i=>`- ${i.n} (${(i.min-i.stock)+1} ud)`).join('\n');
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
}

/* ================= ALBARANES ================= */
function renderAlb(){
    document.getElementById('adm-content').innerHTML = `
    <div class="card"><div class="section-header"><div class="title">Entrada Mercancía</div><button class="btn btn-sm btn-ghost" onclick="document.getElementById('alb-photo').click()">📷 Foto</button></div>
    <textarea id="alb-txt" rows="5" placeholder="Pegar texto del albarán aquí..."></textarea>
    <div id="alb-img-preview"></div>
    <button class="btn btn-primary" style="width:100%" onclick="processAlb()">Procesar Entrada</button></div>`;
    document.getElementById('alb-photo').onchange = async (e) => {
        const f = e.target.files[0]; if(!f) return;
        const reader = new FileReader();
        reader.onload = (ev) => { tempImg = ev.target.result; document.getElementById('alb-img-preview').innerHTML = `<img src="${tempImg}" style="max-width:100%;border-radius:10px;margin-top:10px">`; };
        reader.readAsDataURL(f);
    }
}
async function processAlb(){
    const txt = document.getElementById('alb-txt').value;
    const lines = txt.split('\n');
    let total = 0;
    lines.forEach(l => {
        // Lógica simple para extraer precio (busca el número con decimales)
        const parts = l.split(' ');
        const price = parseFloat(parts.find(p=>p.includes('.')||p.includes(','))?.replace(',','.')) || 0;
        total += price;
    });
    const albId = generateID();
    if(tempImg) await idb.put(albId, tempImg);
    db.albaranes.push({id:albId, date:getISO(), total, prov:'Varios', items:lines});
    save('Albarán guardado'); render('Admin');
}

/* ================= HERRAMIENTAS ================= */
function renderTools(){
    document.getElementById('adm-content').innerHTML = `<div class="card">
    <div class="list-item" onclick="downloadBackup()">💾 Copia de Seguridad (JSON)</div>
    <div class="list-item" onclick="document.getElementById('backup-input').click()">📂 Restaurar Copia</div>
    <div class="list-item" onclick="exportExcel()">📊 Exportar a Excel</div>
    </div>`;
    document.getElementById('backup-input').onchange = (e) => {
        const r = new FileReader(); r.onload = (ev) => { db = JSON.parse(ev.target.result); save('Restaurado'); location.reload(); };
        r.readAsText(e.target.files[0]);
    }
}
function downloadBackup(){
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(db)], {type:'application/json'}));
    a.download = `Arume_Backup_${getISO()}.json`; a.click();
}
function exportExcel(){
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(db.diario), "Ventas");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(db.ingredientes), "Stock");
    XLSX.writeFile(wb, "Arume_Data.xlsx");
}

/* ================= MODAL & EXTRAS ================= */
function showModal(t,c){ document.getElementById('m-title').innerText=t; document.getElementById('m-body').innerHTML=c; document.getElementById('modal-overlay').classList.remove('hidden'); }
function closeModal(){ document.getElementById('modal-overlay').classList.add('hidden'); }
function saveZ(){ db.diario.push({date:getISO(), total:parseFloat(document.getElementById('z-tot').value)}); save(); render('Diario'); }
