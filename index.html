<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>ARUME V141 · FINAL FIX</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* ESTÉTICA LIMPIA */
        body { font-family: 'Poppins', sans-serif; background: #f8fafc; padding-bottom: 110px; -webkit-tap-highlight-color: transparent; user-select: none; }
        .glass-card { background: white; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .btn-premium { background: #0f172a; color: white; padding: 14px; border-radius: 12px; font-weight: 700; width: 100%; cursor: pointer; border: none; }
        .btn-premium:active { transform: scale(0.98); }
        .btn-ghost { background: #f1f5f9; color: #475569; font-weight: 600; padding: 8px; border-radius: 8px; cursor: pointer; border: 1px solid #cbd5e1; }
        .input-premium { width: 100%; padding: 10px; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 10px; outline: none; font-weight: 500; }
        .input-premium:focus { border-color: #4f46e5; background: white; }
        
        /* NAV BAR */
        nav { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 10px 0; display: flex; justify-content: space-around; border-top: 1px solid #e2e8f0; z-index: 50; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
        nav button { flex: 1; background: none; border: none; color: #94a3b8; display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; font-weight: 600; }
        nav button.active { color: #0f172a; transform: translateY(-2px); }
        nav button svg { width: 24px; height: 24px; fill: currentColor; margin-bottom: 4px; }

        /* UTILS */
        .hidden { display: none !important; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        .modal { background: white; width: 95%; max-width: 600px; max-height: 85vh; overflow-y: auto; border-radius: 20px; padding: 20px; }
    </style>
</head>
<body>

    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[200]"></div>
    <div id="loading" class="hidden fixed inset-0 bg-white/90 z-[300] flex justify-center items-center font-bold text-slate-500">PROCESANDO...</div>

    <header class="sticky top-0 z-40 px-6 py-4 flex justify-between items-center bg-white/90 backdrop-blur border-b border-gray-100">
        <div>
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">ARUME <span class="text-indigo-600">V141</span></h1>
        </div>
        <div class="bg-slate-100 px-3 py-1 rounded-full text-xs font-bold text-slate-600 cursor-pointer" onclick="logout()">
            <span id="user-name">Login</span>
        </div>
    </header>

    <main id="app" class="px-4 py-6 max-w-4xl mx-auto"></main>
    <nav id="navbar"></nav>

    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 id="m-title" class="text-lg font-black"></h3>
                <button onclick="closeModal()" class="text-xl font-bold px-2">✕</button>
            </div>
            <div id="m-body"></div>
        </div>
    </div>

    <div id="pin-screen" class="hidden bg-slate-900 fixed inset-0 z-[200] flex flex-col items-center justify-center text-white">
        <h2 class="text-4xl font-black mb-8">ARUME</h2>
        <div id="pin-display" class="text-4xl font-mono mb-8 tracking-widest h-10">****</div>
        <div class="grid grid-cols-3 gap-4 w-64">
            <button class="h-16 rounded-full border border-white/20 text-xl font-bold" onclick="pin(1)">1</button>
            <button class="h-16 rounded-full border border-white/20 text-xl font-bold" onclick="pin(2)">2</button>
            <button class="h-16 rounded-full border border-white/20 text-xl font-bold" onclick="pin(3)">3</button>
            <button class="h-16 rounded-full border border-white/20 text-xl font-bold" onclick="pin(4)">4</button>
            <button class="h-16 rounded-full border border-white/20 text-xl font-bold" onclick="pin(5)">5</button>
            <button class="h-16 rounded-full border border-white/20 text-xl font-bold" onclick="pin(6)">6</button>
            <button class="h-16 rounded-full border border-white/20 text-xl font-bold" onclick="pin(7)">7</button>
            <button class="h-16 rounded-full border border-white/20 text-xl font-bold" onclick="pin(8)">8</button>
            <button class="h-16 rounded-full border border-white/20 text-xl font-bold" onclick="pin(9)">9</button>
            <button class="h-16 rounded-full bg-red-500/30 text-red-300 font-bold" onclick="pin('C')">C</button>
            <button class="h-16 rounded-full border border-white/20 text-xl font-bold" onclick="pin(0)">0</button>
            <button class="h-16 rounded-full bg-emerald-500/30 text-emerald-300 font-bold" onclick="pin('OK')">OK</button>
        </div>
    </div>

<script>
/* ================= 1. CORE ================= */
const Num = {
    parse: (str) => {
        if (!str) return 0;
        if (typeof str === 'number') return str;
        // Elimina todo lo que no sea número, coma, punto o guion
        let clean = String(str).replace(/[^\d.,-]/g, '');
        // Formato europeo: quita puntos de miles, cambia coma a punto decimal
        clean = clean.replace(/\./g, '').replace(',', '.');
        const val = parseFloat(clean);
        return isNaN(val) ? 0 : val;
    },
    fmt: (n) => (n||0).toLocaleString('es-ES', {minimumFractionDigits: 2, maximumFractionDigits: 2})
};

const generateID = () => Math.random().toString(36).substr(2, 9);
const getISO = () => new Date().toLocaleDateString('en-CA');
const DB_INIT = { users: [{n:'Admin', pin:'0150', role:'admin'}], ingredientes: [], recetas: [], albaranes: [], facturas: [], diario: [], kardex: [] };

let db = JSON.parse(JSON.stringify(DB_INIT));
let currentUser = null, currentPin = "", tempItems = [], activeAdminTab = 'dash';

/* ================= 2. INIT & SAVE ================= */
function init() {
    try {
        const stored = localStorage.getItem('arume_v141') || localStorage.getItem('arume_v125');
        if (stored) {
            const data = JSON.parse(decodeURIComponent(atob(stored)));
            if (data) db = data;
        }
    } catch (e) { console.error("Error cargando DB", e); }
    
    // Asegurar estructura
    if(!db.ingredientes) db.ingredientes = [];
    if(!db.albaranes) db.albaranes = [];
    if(!db.users || !db.users.length) db.users = DB_INIT.users;

    const u = localStorage.getItem('arume_user');
    if (u) { currentUser = JSON.parse(u); document.getElementById('pin-screen').classList.add('hidden'); loadApp(); }
    else document.getElementById('pin-screen').classList.remove('hidden');
}

function save(msg) {
    document.getElementById('loading').classList.remove('hidden');
    setTimeout(() => {
        localStorage.setItem('arume_v141', btoa(encodeURIComponent(JSON.stringify(db))));
        document.getElementById('loading').classList.add('hidden');
        if (msg) toast(msg);
    }, 200);
}

function toast(msg) {
    const c = document.getElementById('toast-container');
    const d = document.createElement('div');
    d.className = "bg-slate-800 text-white px-6 py-3 rounded-full shadow-lg font-bold text-sm mb-2";
    d.innerText = msg;
    c.appendChild(d);
    setTimeout(() => d.remove(), 3000);
}

function pin(n) {
    if (n === 'C') currentPin = "";
    else if (n === 'OK') {
        const u = db.users.find(x => x.pin === currentPin);
        if (u) {
            currentUser = u;
            localStorage.setItem('arume_user', JSON.stringify(u));
            document.getElementById('pin-screen').classList.add('hidden');
            loadApp();
        } else { toast("PIN Incorrecto"); currentPin = ""; }
    } else if (currentPin.length < 4) currentPin += n;
    document.getElementById('pin-display').innerText = currentPin ? '*'.repeat(currentPin.length) : '****';
}
function logout() { localStorage.removeItem('arume_user'); location.reload(); }

/* ================= 3. RENDER UI ================= */
function loadApp() {
    document.getElementById('user-name').innerText = currentUser.n;
    const isAdmin = currentUser.role === 'admin';
    
    // Generar Navbar
    const nav = document.getElementById('navbar');
    nav.innerHTML = `
        <button onclick="render('Cocina')" class="${!isAdmin?'active':''}"><svg viewBox="0 0 24 24"><path d="M12 2C8.1 6 7 8 7 11c0 3.9 3.1 7 7 7s7-3.1 7-7c0-3-1.1-5-5-9z"/></svg>Cocina</button>
        <button onclick="render('Stock')"><svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2z"/></svg>Stock</button>
        ${isAdmin ? `<button onclick="render('Admin')" class="active"><svg viewBox="0 0 24 24"><path d="M12 2L3 5v6c0 5 3.8 9.7 9 11 5.2-1.3 9-6 9-11V5l-9-3z"/></svg>Gestión</button>` : ''}
    `;
    
    render(isAdmin ? 'Admin' : 'Cocina');
}

function render(view) {
    const app = document.getElementById('app');
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active', 'text-indigo-600'));
    // Simple highlight logic would go here
    
    if (view === 'Admin') renderAdmin(app);
    if (view === 'Stock') renderStock(app);
    if (view === 'Cocina') renderCocina(app);
}

/* ================= 4. GESTIÓN & ALBARANES PRO ================= */
function renderAdmin(app) {
    app.innerHTML = `
        <div class="flex gap-2 mb-4 bg-white p-1 rounded-xl shadow-sm">
            <button class="flex-1 py-2 rounded-lg text-xs font-bold ${activeAdminTab==='dash'?'bg-slate-800 text-white':'text-slate-500'}" onclick="activeAdminTab='dash';render('Admin')">RESUMEN</button>
            <button class="flex-1 py-2 rounded-lg text-xs font-bold ${activeAdminTab==='albaranes'?'bg-slate-800 text-white':'text-slate-500'}" onclick="activeAdminTab='albaranes';render('Admin')">COMPRAS</button>
        </div>
        <div id="adm-content"></div>
    `;
    const c = document.getElementById('adm-content');
    if (activeAdminTab === 'dash') c.innerHTML = `<div class="glass-card text-center text-slate-500 py-10">Resumen Económico (En desarrollo)</div>`;
    if (activeAdminTab === 'albaranes') renderAlbaranes(c);
}

/* --- LOGICA CORREGIDA ALBARANES --- */
function renderAlbaranes(c) {
    // Generar las opciones del Select UNA SOLA VEZ para usarlas en el mapeo
    // Esto evita usar scripts dentro del HTML
    const ingredients = db.ingredientes.sort((a,b) => a.n.localeCompare(b.n));
    window.stockOptionsData = ingredients; // Guardamos en global temporalmente

    c.innerHTML = `
        <div class="glass-card">
            <h3 class="font-bold text-slate-700 mb-4">NUEVO ALBARÁN PRO</h3>
            
            <div class="grid grid-cols-2 gap-2 mb-4">
                <input id="alb-prov" class="input-premium" placeholder="Proveedor">
                <input type="date" id="alb-date" value="${getISO()}" class="input-premium">
            </div>

            <div class="bg-blue-50 p-3 rounded-xl border border-blue-100 mb-4">
                <label class="text-xs font-bold text-blue-800 block mb-1">Pegar Excel (Nombre | Cant | Precio | %Dto)</label>
                <textarea id="alb-input" rows="3" class="input-premium text-xs font-mono" placeholder="Ej: Tomate  10  1.50  10%"></textarea>
                <button class="btn-premium mt-2 py-2 text-xs" onclick="parseAlb()">PROCESAR DATOS</button>
            </div>

            <div id="alb-grid" class="space-y-2 mb-4"></div>

            <div class="text-right text-2xl font-black text-slate-800 mb-4" id="alb-total">0,00€</div>
            <button class="btn-premium bg-emerald-600" onclick="commitAlb()">CONFIRMAR ENTRADA</button>
        </div>
    `;
    renderAlbGrid();
}

function parseAlb() {
    const txt = document.getElementById('alb-input').value.trim();
    if (!txt) return toast("Texto vacío");
    
    // Detectar separador
    const separator = txt.includes('\t') ? '\t' : (txt.includes(';') ? ';' : ' ');
    
    txt.split(/\r?\n/).forEach(line => {
        if(!line.trim()) return;
        // Separar usando Tab o Punto y Coma
        let parts = line.split(separator);
        // Si falló el separador (ej: copiado con espacios), intenta regex simple
        if(parts.length < 2) parts = line.match(/\S+/g) || [];

        if (parts.length >= 2) {
            const n = parts[0].trim(); // Nombre
            // Limpieza de números
            const getNum = (v) => Num.parse(String(v).replace('€','').replace('%','').replace('kg',''));
            
            const q = getNum(parts[1]);
            const p = getNum(parts[2]);
            const d = parts[3] ? getNum(parts[3]) : 0;

            if (n && (q > 0 || p > 0)) {
                // Intentar encontrar coincidencia en stock
                const match = window.stockOptionsData.find(i => i.n.toLowerCase() === n.toLowerCase());
                
                tempItems.push({
                    n_prov: n,
                    link_id: match ? match.id : 'new',
                    q: q, p: p, d: d, tax: 10
                });
            }
        }
    });
    renderAlbGrid();
    document.getElementById('alb-input').value = '';
}

function renderAlbGrid() {
    const el = document.getElementById('alb-grid');
    if (!el) return;
    
    let total = 0;
    
    // RECONSTRUIMOS EL HTML COMPLETO DE CADA FILA
    // SIN SCRIPTS INLINE
    el.innerHTML = tempItems.map((it, i) => {
        const netPrice = it.p * (1 - (it.d / 100));
        const subtotal = netPrice * it.q;
        total += subtotal * (1 + (it.tax/100));

        // Construir opciones del select manualmente para marcar 'selected'
        const optionsHTML = [
            `<option value="new" ${it.link_id === 'new' ? 'selected' : ''}>➕ NUEVO</option>`,
            ...window.stockOptionsData.map(ing => 
                `<option value="${ing.id}" ${it.link_id === ing.id ? 'selected' : ''}>${ing.n} (${ing.stock})</option>`
            )
        ].join('');

        return `
            <div class="bg-white p-2 rounded-lg border border-slate-200 shadow-sm flex flex-wrap items-center gap-2 ${it.link_id==='new'?'border-l-4 border-l-yellow-400':'border-l-4 border-l-emerald-500'}">
                <div class="w-full md:w-1/3">
                    <input class="text-xs font-bold w-full border-none p-0 bg-transparent mb-1" value="${it.n_prov}" onchange="updateItem(${i}, 'n_prov', this.value)">
                    <select class="text-xs w-full bg-slate-50 p-1 rounded border" onchange="updateItem(${i}, 'link_id', this.value)">
                        ${optionsHTML}
                    </select>
                </div>
                <div class="flex-1 flex gap-1 justify-end">
                    <input type="number" class="w-12 text-center text-xs bg-slate-50 border rounded" value="${it.q}" onchange="updateItem(${i}, 'q', this.value)">
                    <input type="number" class="w-14 text-center text-xs bg-slate-50 border rounded" value="${it.p}" onchange="updateItem(${i}, 'p', this.value)">
                    <input type="number" class="w-10 text-center text-xs bg-red-50 text-red-600 border rounded" value="${it.d}" onchange="updateItem(${i}, 'd', this.value)">
                </div>
                <div class="font-bold text-xs w-14 text-right">${Num.fmt(subtotal)}€</div>
                <button class="text-red-500 font-bold px-2" onclick="delItem(${i})">✕</button>
            </div>
        `;
    }).join('');
    
    document.getElementById('alb-total').innerText = Num.fmt(total) + '€';
}

// Helpers globales para eventos (necesario porque el HTML es string)
window.updateItem = (i, field, val) => {
    if (field === 'link_id' || field === 'n_prov') tempItems[i][field] = val;
    else tempItems[i][field] = parseFloat(val) || 0;
    renderAlbGrid(); // Re-render para actualizar colores y totales
};
window.delItem = (i) => {
    tempItems.splice(i, 1);
    renderAlbGrid();
};

function commitAlb() {
    if (tempItems.length === 0) return toast("Albarán vacío");
    const prov = document.getElementById('alb-prov').value || 'Varios';
    const date = document.getElementById('alb-date').value;

    tempItems.forEach(it => {
        let ingId = it.link_id;
        // Crear nuevo ingrediente si es necesario
        if (ingId === 'new') {
            ingId = generateID();
            db.ingredientes.push({ id: ingId, n: it.n_prov, stock: 0, cost: 0, unit: 'ud' });
        }
        
        // Actualizar Stock y PMP
        const ing = db.ingredientes.find(x => x.id === ingId);
        if (ing) {
            const netPrice = it.p * (1 - (it.d / 100));
            const totalVal = (ing.stock * ing.cost) + (it.q * netPrice);
            const totalQty = ing.stock + it.q;
            
            if (totalQty > 0) ing.cost = totalVal / totalQty;
            ing.stock = totalQty;
            
            // Kardex
            db.kardex.push({ date: getISO(), n: ing.n, type: 'IN', q: it.q, price: netPrice, reason: `Alb: ${prov}` });
        }
    });

    db.albaranes.push({ id: generateID(), date, prov, items: tempItems, total: parseFloat(document.getElementById('alb-total').innerText.replace('.','').replace(',','.')) });
    save("Stock actualizado correctamente");
    tempItems = [];
    render('Admin');
}

/* ================= 5. STOCK & COCINA (SIMPLIFICADO) ================= */
function renderStock(app) {
    app.innerHTML = `
        <div class="glass-card">
            <div class="flex justify-between mb-4"><h3 class="font-bold">STOCK ACTUAL</h3><button class="text-xs bg-slate-100 p-2 rounded" onclick="render('Admin')">+ Añadir</button></div>
            <div class="space-y-2">
                ${db.ingredientes.map(i => `
                    <div class="flex justify-between p-2 border-b text-sm">
                        <span>${i.n}</span>
                        <span class="font-bold ${i.stock<0?'text-red-500':'text-slate-700'}">${Num.fmt(i.stock)} ${i.unit}</span>
                    </div>
                `).join('')}
            </div>
        </div>
    `;
}

function renderCocina(app) {
    app.innerHTML = `<div class="glass-card text-center py-10 text-slate-400">Módulo Cocina Activo</div>`;
}

/* ================= 6. UTILS ================= */
function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }
function showModal(title, content) {
    document.getElementById('m-title').innerText = title;
    document.getElementById('m-body').innerHTML = content;
    document.getElementById('modal-overlay').classList.remove('hidden');
}

/* START */
init();
</script>
</body>
</html>
