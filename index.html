<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ARUME · Simple</title>
  <style>
    :root{ --bg:#f6f8fb; --card:#fff; --text:#0b1720; --muted:#6b7280; --accent:#2563eb; --border:#e6eef8; --radius:10px }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:var(--bg);color:var(--text);padding-bottom:90px}
    header{background:var(--card);padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
    h1{margin:0;font-size:1rem}
    .badge{padding:6px 10px;border-radius:999px;background:#f1f5f9;border:1px solid var(--border);cursor:pointer;font-weight:700}
    main{max-width:900px;margin:18px auto;padding:0 12px}
    .card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:14px;border:1px solid var(--border)}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    .col{flex:1;min-width:140px}
    input,select,textarea,button{font:inherit}
    input,select,textarea{width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;background:white}
    button{padding:8px 10px;border-radius:8px;border:0;cursor:pointer}
    .btn-primary{background:var(--accent);color:white}
    .btn-ghost{background:transparent;border:1px solid var(--border)}
    nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:rgba(255,255,255,0.98);padding:8px;border-radius:12px;border:1px solid var(--border);z-index:30}
    .muted{color:var(--muted);font-size:0.9rem}
    .small{font-size:0.9rem}
    img.preview{max-width:160px;border-radius:8px;border:1px solid #eee}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px;border-bottom:1px solid #f1f5f9;text-align:left}
    .center{display:flex;align-items:center;gap:8px}
    .hidden{display:none}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:#111;color:#fff;padding:8px 12px;border-radius:8px;z-index:50}
    footer.note{max-width:900px;margin:0 auto 26px;padding:6px 12px;color:var(--muted);font-size:0.9rem}
    /* modal */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:60}
    .overlay.hidden{display:none}
    .modal{background:white;border-radius:12px;padding:14px;max-width:520px;width:92%;box-shadow:0 10px 30px rgba(2,6,23,0.15)}
    pre {background:#0b1220;color:#fff;padding:8px;border-radius:8px;overflow:auto}
  </style>
</head>
<body>
  <header>
    <h1>ARUME · Simple</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <div id="user-display" class="badge">Iniciar</div>
    </div>
  </header>

  <main id="app"></main>

  <nav aria-hidden="false">
    <button class="btn-ghost" id="nav-inv">Inventario</button>
    <button class="btn-ghost" id="nav-alb">Albaranes</button>
    <button class="btn-ghost" id="nav-tools">Herramientas</button>
  </nav>

  <div id="modal" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="modal" id="modal-content">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <strong id="m-title"></strong>
        <button id="m-close" class="btn-ghost">✕</button>
      </div>
      <div id="m-body"></div>
    </div>
  </div>

  <footer class="note">Versión simple — fotos comprimidas y guardadas en localStorage. No requiere servidor.</footer>

<script>
(() => {
  'use strict';

  // Simple DB in localStorage
  const STORAGE_KEY = 'arume_simple_v1';
  const USER_KEY = 'arume_simple_user';
  const MAX_IMG_WIDTH = 800; // px
  const IMG_QUALITY = 0.7; // jpeg quality

  const DB_INIT = {
    users: [{id:'u1', n:'Gerencia', pin:'0150', role:'admin'}, {id:'u2', n:'Cocina', pin:'1111', role:'staff'}],
    ingredientes: [],
    albaranes: []
  };

  // State
  let db = loadDB();
  let currentUser = loadUser();
  const app = $('app');

  // Helpers
  function $(id){ return document.getElementById(id); }
  function saveDB(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); showToast('Guardado'); } catch(e){ showToast('No se pudo guardar: espacio lleno'); console.error(e); } }
  function loadDB(){ try { const s = localStorage.getItem(STORAGE_KEY); return s ? JSON.parse(s) : clone(DB_INIT); } catch(e){ console.warn(e); return clone(DB_INIT); } }
  function saveUser(){ localStorage.setItem(USER_KEY, JSON.stringify(currentUser)); }
  function loadUser(){ try { const s = localStorage.getItem(USER_KEY); return s ? JSON.parse(s) : null } catch(e){ return null } }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function showToast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

  // Modal
  function showModal(title, contentNodeOrHtml){
    $('m-title').textContent = title || '';
    const body = $('m-body');
    body.innerHTML = '';
    if(contentNodeOrHtml instanceof Node) body.appendChild(contentNodeOrHtml);
    else body.innerHTML = contentNodeOrHtml || '';
    $('modal').classList.remove('hidden');
    setTimeout(()=> {
      const btn = body.querySelector('button, input, textarea, select');
      if(btn) btn.focus();
    },50);
  }
  function closeModal(){ $('modal').classList.add('hidden'); $('m-title').textContent=''; $('m-body').innerHTML=''; }
  document.getElementById('m-close').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', (e)=> { if(e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', (e)=> { if(e.key === 'Escape') closeModal(); });

  // Image resize/compress
  function compressImageFile(file){
    return new Promise((resolve, reject) => {
      if(!file.type.startsWith('image/')) return reject(new Error('No es imagen'));
      const fr = new FileReader();
      fr.onload = () => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, MAX_IMG_WIDTH / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img,0,0,canvas.width,canvas.height);
          resolve(canvas.toDataURL('image/jpeg', IMG_QUALITY));
        };
        img.onerror = reject;
        img.src = fr.result;
      };
      fr.onerror = reject;
      fr.readAsDataURL(file);
    });
  }

  // UI: NAV
  $('nav-inv').addEventListener('click', ()=> renderInventory());
  $('nav-alb').addEventListener('click', ()=> renderAlbaranes());
  $('nav-tools').addEventListener('click', ()=> renderTools());

  // User display: login/logout
  const userDisplay = $('user-display');
  userDisplay.addEventListener('click', ()=> {
    if(currentUser) {
      // show small menu: logout or switch
      const node = document.createElement('div');
      node.innerHTML = `
        <div style="margin-bottom:8px"><strong>${escapeHTML(currentUser.n)}</strong></div>
        <div class="muted">Rol: ${escapeHTML(currentUser.role||'staff')}</div>
        <div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end">
          <button id="btn-switch" class="btn btn-ghost">Cambiar</button>
          <button id="btn-logout" class="btn btn-primary">Cerrar sesión</button>
        </div>
      `;
      showModal('Usuario', node);
      setTimeout(()=> {
        $('btn-switch').addEventListener('click', ()=> { closeModal(); openLogin(); });
        $('btn-logout').addEventListener('click', ()=> { currentUser = null; localStorage.removeItem(USER_KEY); userDisplay.textContent='Iniciar'; closeModal(); renderInventory(); showToast('Sesión cerrada'); });
      }, 20);
    } else {
      openLogin();
    }
  });

  // Login modal
  function openLogin(){
    const users = db.users || [];
    const options = users.map(u => `<option value="${escapeHTML(u.id)}">${escapeHTML(u.n)}</option>`).join('');
    const node = document.createElement('div');
    node.innerHTML = `
      <label>Usuario (selecciona)</label>
      <select id="login-user">${options}</select>
      <label style="margin-top:8px">PIN</label>
      <input id="login-pin" type="password" placeholder="PIN (p.ej. 0150)">
      <div style="text-align:right;margin-top:8px">
        <button id="login-cancel" class="btn btn-ghost">Cancelar</button>
        <button id="login-enter" class="btn btn-primary">Entrar</button>
      </div>
    `;
    showModal('Iniciar sesión', node);
    setTimeout(()=> {
      const sel = $('login-user'), pin = $('login-pin'), enter = $('login-enter'), cancel = $('login-cancel');
      enter.addEventListener('click', ()=> {
        const uid = sel.value; const p = (pin.value||'').trim();
        const user = db.users.find(u => u.id === uid);
        if(!user) { showToast('Selecciona un usuario'); return; }
        if((user.pin||'') !== p) { showToast('PIN incorrecto'); return; }
        currentUser = { id: user.id, n: user.n, role: user.role || 'staff' };
        saveUser();
        userDisplay.textContent = currentUser.n;
        closeModal();
        renderInventory();
        showToast('Sesión iniciada: ' + user.n);
      });
      cancel.addEventListener('click', closeModal);
      pin.focus();
    }, 20);
  }
  function saveUser(){ localStorage.setItem(USER_KEY, JSON.stringify(currentUser)); }

  // Render Inventory (ingredients)
  function renderInventory(){
    app.innerHTML = '';
    const card = el('div.card');
    card.innerHTML = `<div class="section-header"><div class="title">Inventario</div><div><button id="new-ing" class="btn btn-primary">+ Nuevo</button></div></div><div id="ing-list"></div>`;
    app.appendChild(card);
    $('#new-ing').addEventListener('click', ()=> {
      const ing = { id: uid(), n: '', stock:0, cost:0, min:0, unit:'ud', prov:'' };
      db.ingredientes.push(ing); saveDB(); renderInventory();
      editIngredient(ing.id);
    });
    const list = $('#ing-list');
    db.ingredientes.forEach(i=>{
      const row = document.createElement('div');
      row.className = 'card';
      row.style.display = 'flex';
      row.style.justifyContent = 'space-between';
      row.style.alignItems = 'center';
      row.innerHTML = `<div><strong>${escapeHTML(i.n||'Sin nombre')}</strong><div class="muted">Stock: ${i.stock||0} ${escapeHTML(i.unit||'ud')} — Coste: ${formatMoney(i.cost||0)}</div></div>
        <div style="display:flex;gap:8px"><button class="btn btn-ghost" data-edit="${i.id}">Editar</button><button class="btn btn-ghost" data-del="${i.id}">Eliminar</button></div>`;
      list.appendChild(row);
    });
    list.querySelectorAll('[data-edit]').forEach(btn=> btn.addEventListener('click', (e)=> editIngredient(e.currentTarget.dataset.edit)));
    list.querySelectorAll('[data-del]').forEach(btn=> btn.addEventListener('click', (e)=> {
      const id = e.currentTarget.dataset.del;
      if(!confirm('Eliminar ingrediente?')) return;
      db.ingredientes = db.ingredientes.filter(x=>x.id!==id);
      saveDB(); renderInventory();
    }));
  }

  function editIngredient(id){
    const ing = db.ingredientes.find(x=>x.id===id);
    if(!ing) return showToast('Ingrediente no encontrado');
    const node = document.createElement('div');
    node.innerHTML = `
      <label>Nombre</label><input id="ei-n" value="${escapeHTML(ing.n)}">
      <div class="row" style="margin-top:8px">
        <div class="col"><label>Stock</label><input id="ei-stock" type="number" value="${ing.stock||0}"></div>
        <div class="col"><label>Min</label><input id="ei-min" type="number" value="${ing.min||0}"></div>
      </div>
      <div class="row" style="margin-top:8px">
        <div class="col"><label>Coste</label><input id="ei-cost" type="number" value="${ing.cost||0}"></div>
        <div class="col"><label>Unidad</label><input id="ei-unit" value="${escapeHTML(ing.unit||'ud')}"></div>
      </div>
      <label style="margin-top:8px">Proveedor</label><input id="ei-prov" value="${escapeHTML(ing.prov||'')}">
      <div style="text-align:right;margin-top:10px">
        <button id="ei-cancel" class="btn btn-ghost">Cancelar</button>
        <button id="ei-save" class="btn btn-primary">Guardar</button>
      </div>
    `;
    showModal('Editar Ingrediente', node);
    setTimeout(()=> {
      $('#ei-save').addEventListener('click', ()=> {
        ing.n = $('#ei-n').value.trim() || ing.n;
        ing.stock = parseFloat($('#ei-stock').value) || 0;
        ing.min = parseFloat($('#ei-min').value) || 0;
        ing.cost = parseFloat($('#ei-cost').value) || 0;
        ing.unit = $('#ei-unit').value || ing.unit;
        ing.prov = $('#ei-prov').value || ing.prov;
        saveDB(); closeModal(); renderInventory();
      });
      $('#ei-cancel').addEventListener('click', closeModal);
    }, 20);
  }

  // Render Albaranes
  function renderAlbaranes(){
    app.innerHTML = '';
    const node = el('div.card');
    node.innerHTML = `<div class="section-header"><div class="title">Albaranes</div><div><button id="new-alb" class="btn btn-primary">+ Nuevo</button> <button id="export-alb" class="btn btn-ghost">Export CSV</button></div></div>
      <div id="alb-list"></div>`;
    app.appendChild(node);
    $('#new-alb').addEventListener('click', newAlbaran);
    $('#export-alb').addEventListener('click', exportAlbaranesCSV);
    renderAlbList();
  }

  function renderAlbList(){
    const list = $('#alb-list');
    list.innerHTML = '';
    if(!db.albaranes.length) { list.innerHTML = '<div class="muted">No hay albaranes</div>'; return; }
    db.albaranes.slice().reverse().forEach(alb=>{
      const row = document.createElement('div'); row.className='card'; row.style.display='flex'; row.style.justifyContent='space-between'; row.style.alignItems='center';
      row.innerHTML = `<div><strong>${escapeHTML(alb.prov || 'Sin proveedor')}</strong><div class="muted">${escapeHTML(alb.date || '')} — Total: ${formatMoney(alb.total||0)}</div></div>
        <div style="display:flex;gap:8px"><button class="btn btn-ghost" data-view="${alb.id}">Ver</button><button class="btn btn-ghost" data-del="${alb.id}">Eliminar</button></div>`;
      list.appendChild(row);
    });
    list.querySelectorAll('[data-view]').forEach(b=> b.addEventListener('click', (e)=> viewAlbaran(e.currentTarget.dataset.view)));
    list.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', (e)=> {
      const id = e.currentTarget.dataset.del;
      if(!confirm('Eliminar albarán?')) return;
      db.albaranes = db.albaranes.filter(x=>x.id!==id); saveDB(); renderAlbList();
    }));
  }

  // New albaran modal
  function newAlbaran(){
    const node = document.createElement('div');
    node.innerHTML = `
      <label>Proveedor</label><input id="alb-prov">
      <label style="margin-top:8px">Fecha</label><input id="alb-date" type="date" value="${new Date().toISOString().slice(0,10)}">
      <label style="margin-top:8px">Items (una línea por producto: nombre | cantidad | precio)</label>
      <textarea id="alb-input" rows="4" placeholder="Arroz | 5 | 10"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button id="alb-parse" class="btn btn-ghost">Parsear</button>
        <button id="alb-attach" class="btn btn-ghost">Adjuntar foto</button>
      </div>
      <div id="alb-photo-preview" style="margin-top:8px"></div>
      <div id="alb-items" style="margin-top:8px"></div>
      <label style="margin-top:8px">Observaciones</label><textarea id="alb-note" rows="2"></textarea>
      <div style="text-align:right;margin-top:8px"><button id="alb-cancel" class="btn btn-ghost">Cancelar</button><button id="alb-save" class="btn btn-primary">Guardar albarán</button></div>
    `;
    showModal('Nuevo Albarán', node);
    let tempItems = [];
    setTimeout(()=> {
      $('#alb-attach').addEventListener('click', ()=> {
        const input = document.createElement('input'); input.type='file'; input.accept='image/*'; input.onchange = async (e) => {
          const f = e.target.files[0]; if(!f) return;
          try {
            const dataUrl = await compressImageFile(f);
            // show preview
            $('#alb-photo-preview').innerHTML = `<img src="${dataUrl}" class="preview">`;
            // store temporarily on modal DOM
            $('#alb-photo-preview').dataset.photo = dataUrl;
          } catch(err){ showToast('Error al procesar imagen'); console.error(err); }
        }; input.click();
      });

      $('#alb-parse').addEventListener('click', ()=> {
        const raw = $('#alb-input').value || '';
        tempItems = [];
        const lines = raw.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
        lines.forEach(line=>{
          const parts = line.split(/\s*\|\s*|\t| {2,}/).filter(Boolean);
          let name = parts[0] || '';
          let q = 1, p = 0;
          if(parts.length >= 2){ q = parseFloat(parts[1]) || 1; p = parseFloat(parts[2]||parts[1]) || 0; }
          else {
            const nums = Array.from(line.matchAll(/-?[\d\.,]+/g)).map(m=>parseFloat(m[0].replace(',','.')));
            if(nums.length>=2){ q = nums[0]; p = nums[1]; }
            else if(nums.length===1) p = nums[0];
            const text = line.replace(/[\d\.,€$]/g,'').trim(); if(text) name = text;
          }
          tempItems.push({ n: name, q: q||1, p: p||0 });
        });
        renderAlbItems();
      });

      function renderAlbItems(){
        const cont = $('#alb-items'); cont.innerHTML = '';
        if(!tempItems.length) { cont.innerHTML = '<div class="muted">Sin items</div>'; return; }
        const table = document.createElement('table');
        table.innerHTML = `<thead><tr><th>Producto</th><th>Cant</th><th>Precio</th><th></th></tr></thead>`;
        const tbody = document.createElement('tbody');
        tempItems.forEach((it, idx)=> {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${escapeHTML(it.n)}</td><td>${it.q}</td><td>${formatMoney(it.p)}</td><td><button data-rem="${idx}" class="btn btn-ghost">Quitar</button></td>`;
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        cont.appendChild(table);
        cont.querySelectorAll('[data-rem]').forEach(b=> b.addEventListener('click', e=> { const i = Number(e.currentTarget.dataset.rem); tempItems.splice(i,1); renderAlbItems(); }));
      }

      $('#alb-cancel').addEventListener('click', closeModal);
      $('#alb-save').addEventListener('click', ()=> {
        const prov = $('#alb-prov').value.trim();
        if(!prov) return showToast('Proveedor requerido');
        const date = $('#alb-date').value;
        const items = tempItems.slice();
        if(!items.length) return showToast('Añade al menos un item');
        // compute total simple
        const total = items.reduce((s,it)=> s + ((it.p||0)*(it.q||1)), 0);
        const photo = $('#alb-photo-preview').dataset.photo || null;
        const note = $('#alb-note').value || null;
        const alb = { id: uid(), prov, date, items, total, note, photo };
        db.albaranes.push(alb);
        saveDB(); closeModal(); renderAlbaranes();
      });
    }, 50);
  }

  // View albaran
  function viewAlbaran(id){
    const a = db.albaranes.find(x=>x.id===id); if(!a) return showToast('No encontrado');
    const node = document.createElement('div');
    const itemsHtml = a.items.map(it => `<tr><td>${escapeHTML(it.n)}</td><td>${it.q}</td><td>${formatMoney(it.p)}</td></tr>`).join('');
    node.innerHTML = `
      <div class="muted">Proveedor: <strong>${escapeHTML(a.prov)}</strong></div>
      <div class="muted" style="margin-top:6px">Fecha: ${escapeHTML(a.date)}</div>
      ${a.photo ? `<div style="margin-top:8px"><img src="${a.photo}" class="preview"></div>` : ''}
      <table style="margin-top:8px"><thead><tr><th>Producto</th><th>Cant</th><th>Precio</th></tr></thead><tbody>${itemsHtml}</tbody></table>
      ${a.note ? `<div style="margin-top:8px;background:#fffbeb;padding:8px;border-radius:8px">📝 ${escapeHTML(a.note)}</div>` : ''}
      <div style="text-align:right;margin-top:10px">
        <button id="alb-close" class="btn btn-ghost">Cerrar</button>
      </div>`;
    showModal('Albarán', node);
    setTimeout(()=> { $('#alb-close').addEventListener('click', closeModal); }, 20);
  }

  // Export CSV
  function exportAlbaranesCSV(){
    let csv = 'Proveedor,Fecha,Total,Nota\\n';
    db.albaranes.forEach(a => {
      const prov = (a.prov||'').replace(/"/g,'""');
      const date = a.date || '';
      const total = (a.total||0).toFixed(2);
      const note = (a.note||'').replace(/"/g,'""');
      csv += `"${prov}","${date}",${total},"${note}"\\n`;
    });
    const blob = new Blob([csv], {type:'text/csv'}); const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'albaranes.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }

  // Tools: smart order (simple)
  function renderTools(){
    app.innerHTML = '';
    const node = el('div.card');
    node.innerHTML = `<div class="section-header"><div class="title">Herramientas</div><div></div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="tools-order" class="btn btn-primary">Pedido inteligente</button>
        <button id="tools-backup" class="btn btn-ghost">Backup JSON</button>
        <button id="tools-restore" class="btn btn-ghost">Restaurar</button>
      </div>
      <div id="tools-body" style="margin-top:12px"></div>`;
    app.appendChild(node);
    $('#tools-order').addEventListener('click', generateSmartOrder);
    $('#tools-backup').addEventListener('click', ()=> {
      const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'arume_backup.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    });
    $('#tools-restore').addEventListener('click', ()=> {
      const input = document.createElement('input'); input.type='file'; input.accept='.json'; input.onchange = (e)=> {
        const f = e.target.files[0]; if(!f) return;
        const fr = new FileReader();
        fr.onload = ()=> {
          try {
            const json = JSON.parse(fr.result);
            if(!confirm('Restaurar sobrescribirá la BD local. Continuar?')) return;
            db = json; saveDB(); renderInventory(); renderAlbaranes(); showToast('Backup restaurado');
          } catch(err){ showToast('Backup inválido'); }
        };
        fr.readAsText(f);
      }; input.click();
    });
  }

  function generateSmartOrder(){
    const below = (db.ingredientes||[]).filter(i => (i.stock||0) < (i.min||0));
    if(!below.length) return showToast('Nada por debajo del mínimo');
    const groups = {};
    below.forEach(i => { const prov = i.prov || 'Proveedor general'; (groups[prov] = groups[prov]||[]).push(i); });
    const div = document.createElement('div');
    Object.entries(groups).forEach(([prov, items], idx) => {
      let text = `Hola ${prov},\\nNecesito:\\n`;
      items.forEach(it => text += `- ${it.n}: ${(it.min||0)-(it.stock||0)} ${it.unit||''}\\n`);
      const block = document.createElement('div'); block.style.border='1px solid #eee'; block.style.padding='8px'; block.style.marginBottom='8px'; block.innerHTML = `<strong>${escapeHTML(prov)}</strong><pre style="white-space:pre-wrap">${escapeHTML(text)}</pre>
        <div style="text-align:right"><button data-text="${escapeHTML(text)}" class="btn btn-ghost copy">Copiar</button> <button data-text="${escapeHTML(text)}" class="btn btn-primary wa">WhatsApp</button></div>`;
      div.appendChild(block);
    });
    showModal('Pedido inteligente', div);
    setTimeout(()=> {
      Array.from(div.querySelectorAll('.copy')).forEach(b => b.addEventListener('click', e => { const txt = e.currentTarget.dataset.text; navigator.clipboard.writeText(txt).then(()=> showToast('Copiado')); }));
      Array.from(div.querySelectorAll('.wa')).forEach(b => b.addEventListener('click', e => { const txt = e.currentTarget.dataset.text; openWhatsAppWithText(txt); }));
    }, 40);
  }

  /* ---------- Simple helpers ---------- */
  function el(tag){ return document.createElement(tag); }
  function escapeHTML(s=''){ return String(s).replace(/[&<>"'`]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;',"`":'&#96;'}[ch])); }
  function openWhatsAppWithText(text){ window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank'); }

  /* ---------- Init ---------- */
  document.addEventListener('DOMContentLoaded', ()=>{
    // init values
    if(!Array.isArray(db.users)) db.users = DB_INIT.users;
    // show user
    currentUser = loadUser();
    $('user-display').textContent = currentUser ? currentUser.n : 'Iniciar';
    // default view
    renderInventory();
  });

  // expose small debug API
  window._arume = {
    db: () => clone(db),
    user: () => clone(currentUser)
  };

})();
</script>
</body>
</html>
