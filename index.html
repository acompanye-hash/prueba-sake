<script>
/* ================= 1. CORE UTILS & NUMERICS (AUDIT FIX) ================= */
// Manejo robusto de decimales y sanitización
const Num = {
    // Convierte string "1.200,50" -> float 1200.50
    parse: (str) => {
        if (str === undefined || str === null || str === '') return 0;
        if (typeof str === 'number') return str;
        try {
            // Eliminar espacios, puntos de miles y cambiar coma por punto
            const cleanStr = String(str).trim().replace(/\s+/g, '').replace(/\./g, '').replace(',', '.');
            const val = parseFloat(cleanStr);
            return isNaN(val) ? 0 : val;
        } catch (e) { return 0; }
    },
    // Formatea float -> "1.200,50"
    fmt: (n) => {
        const num = (n === undefined || n === null) ? 0 : Number(n);
        return num.toLocaleString('es-ES', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    },
    // Formato CSV (Excel español usa coma decimal)
    csv: (n) => {
        const formatted = Num.fmt(n);
        // formatted uses '.' as thousands and ',' as decimal already in es-ES, keep as-is
        return formatted.replace(/\./g, '').replace(',', '.'); // return without thousands separators, dot decimal (safer for some tools)
    }
};

function clean(str) { 
    if (str === undefined || str === null) return ''; 
    // Sanitización básica para evitar inyección HTML
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

const generateID = () => {
    // Use crypto if available for better randomness
    try {
        const arr = new Uint8Array(8);
        crypto.getRandomValues(arr);
        return Array.from(arr, b => b.toString(36).padStart(2,'0')).join('').substr(0,9);
    } catch (e) {
        return Math.random().toString(36).substr(2, 9);
    }
};
const getISO = () => new Date().toLocaleDateString('en-CA');
const getTS = () => new Date().toLocaleString('es-ES');

/* ================= 2. CONFIGURACIÓN & DB ================= */
const CONFIG = { 
    GOOGLE_URL: "https://script.google.com/macros/s/AKfycbxL0hWPiYmQ_590bkFjd1B9xwsfrYQXQtEuUpP2Nraq973bDr2rpEgVnaJCpI3-DH8z/exec", 
    COST_HOUR: 15,
    STORAGE_KEY: 'arume_v141'
};

const ALLERGENS = [
    {k:'glu',i:'🌾'},{k:'cru',i:'🦐'},{k:'hue',i:'🥚'},{k:'pes',i:'🐟'},
    {k:'cac',i:'🥜'},{k:'soj',i:'🫘'},{k:'lac',i:'🥛'},{k:'fru',i:'🌰'},
    {k:'api',i:'🥬'},{k:'mos',i:'🌭'},{k:'ses',i:'🌱'},{k:'sul',i:'🍷'},
    {k:'alt',i:'🫘'},{k:'mol',i:'🐙'}
];

const DB_INIT = { 
    users: [{id:'u1', n:'Gerencia', pin:'0150', role:'admin'}, {id:'u2', n:'Equipo', pin:'1111', role:'staff'}], 
    ingredientes: [], recetas: [], proveedores: [{n:'Makro'}], albaranes: [], facturas: [], diario: [], mermas: [], 
    kardex: [], sales_history: [], lastSync: 0 
};

// "Encriptación" ligera para almacenamiento local (No es seguridad militar, evita lectura accidental)
const secure = { 
    enc: (d) => {
        try { return btoa(encodeURIComponent(JSON.stringify(d))); } catch(e){ return ''; }
    }, 
    dec: (d) => {
        try {
            if(!d) return null;
            // Accept raw objects too
            if (typeof d !== 'string') return d;
            return JSON.parse(decodeURIComponent(atob(d)));
        } catch (e) { return null; }
    } 
};

let db = JSON.parse(JSON.stringify(DB_INIT));
let currentUser = null, currentPin = "", tempItems = [], activeAdminTab = 'dash', searchFilter = "";
let currentDiarioDate = new Date().toLocaleDateString('en-CA');
let inventoryMode = false;
let fiscalYear = new Date().getFullYear();
let fiscalQuarter = Math.floor(new Date().getMonth() / 3) + 1;

/* ================= 3. SYSTEM FUNCTIONS ================= */
function loading(show) { document.getElementById('loading-overlay').classList.toggle('hidden', !show); }

function toast(msg, type='info', duration=3000) { 
    const b=document.getElementById('toast-container'); 
    const el=document.createElement('div'); 
    el.className=`${type==='error'?'bg-red-500':'bg-slate-800'} text-white px-6 py-3 rounded-full shadow-xl font-bold text-sm mb-3 transition-all`;
    el.style.pointerEvents = 'auto';
    el.innerText=msg; 
    b.appendChild(el); 
    setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, duration); 
}

function isInPeriod(dateStr) { 
    if(fiscalQuarter===0) return true; 
    const d=new Date(dateStr);
    if (isNaN(d)) return false;
    return d.getFullYear()===fiscalYear && (Math.floor(d.getMonth()/3)+1)===fiscalQuarter; 
}

function safeLoadStorage() {
    // Migrate older keys if present
    const keysToCheck = [CONFIG.STORAGE_KEY, 'arume_v125', 'arume_v130'];
    for (const k of keysToCheck) {
        try {
            const stored = localStorage.getItem(k);
            if (stored) {
                const dec = secure.dec(stored);
                if (dec && dec.users) {
                    db = dec;
                    localStorage.setItem(CONFIG.STORAGE_KEY, secure.enc(db));
                    return;
                }
            }
        } catch(e) { continue; }
    }
}

function init() {
    try { 
        safeLoadStorage();
    } catch(e){ console.warn("DB Integrity Reset"); }
    
    // Migraciones de estructura seguras
    if(!db.users || !db.users.length) db.users=DB_INIT.users;
    if(!db.kardex) db.kardex=[]; 
    if(!db.sales_history) db.sales_history=[];
    if(!db.lastSync) db.lastSync = 0;

    const u=localStorage.getItem('arume_user');
    if(u){
        try { currentUser = JSON.parse(u); } catch(e){ currentUser = null; }
    }

    if(currentUser){ document.getElementById('pin-screen').classList.add('hidden'); loadApp(); }
    else document.getElementById('pin-screen').classList.remove('hidden');
    
    // fire-and-forget sync (non-blocking)
    if(CONFIG.GOOGLE_URL) setTimeout(sync, 1000);

    // render empty nav (safe)
    renderNav();
}

async function save(msg){
    loading(true); 
    try { 
        db.lastSync=Date.now(); 
        localStorage.setItem(CONFIG.STORAGE_KEY, secure.enc(db)); 
        // Best-effort send to remote; don't block user if remote fails.
        if(CONFIG.GOOGLE_URL) { 
            try {
                const controller = new AbortController();
                const timeout = setTimeout(()=>controller.abort(), 4000);
                // Try CORS first; some GAS deployments require no-cors, so try both.
                await fetch(CONFIG.GOOGLE_URL, {method:'POST', mode:'cors', headers:{'Content-Type':'application/json'}, body:JSON.stringify(db), signal:controller.signal});
                clearTimeout(timeout);
            } catch (e) {
                try {
                    // Fallback to no-cors (fire-and-forget)
                    const c = new AbortController();
                    setTimeout(()=>c.abort(), 3000);
                    await fetch(CONFIG.GOOGLE_URL, {method:'POST', mode:'no-cors', body:JSON.stringify(db), signal:c.signal}).catch(()=>{});
                } catch(e){}
            }
        }
        if(msg) toast(msg,'info',2000); 
    } catch(e){ toast("Error guardando datos locales","error"); } 
    finally{ loading(false); }
}

async function sync(){ 
    if(!CONFIG.GOOGLE_URL) return; 
    try{ 
        const r = await fetch(CONFIG.GOOGLE_URL, {mode:'cors'});
        if(!r.ok) return;
        const c = await r.json();
        if(c && c.lastSync && c.lastSync > (db.lastSync || 0)){ 
            db = c; localStorage.setItem(CONFIG.STORAGE_KEY, secure.enc(db)); 
            loadApp(); toast("Datos sincronizados", 'info', 2000);
        } 
    }catch(e){
        // silent fail - remote sync is best-effort
        console.debug('sync failed', e);
    } 
}

function pin(n){ 
    if(n==='C') currentPin=""; 
    else if(n==='OK'){ 
        const u=db.users.find(x=>x.pin===currentPin); 
        if(u){ 
            currentUser=u; 
            localStorage.setItem('arume_user',JSON.stringify(u)); 
            document.getElementById('pin-screen').classList.add('hidden'); 
            loadApp(); 
        } else { toast("PIN Incorrecto","error"); currentPin=""; }
    } else if(String(currentPin).length<6) currentPin+=String(n); // allow up to 6 digits
    document.getElementById('pin-display').innerText=currentPin ? '*'.repeat(currentPin.length) : '****'; 
}

function logout(){ if(confirm("¿Cerrar sesión?")){ localStorage.removeItem('arume_user'); location.reload(); }}

/* ================= 4. LOGIC ENGINE ================= */
const UnitConverter = {
    normalize: (u) => { 
        if(!u) return 'ud'; u=u.toLowerCase().trim(); 
        if(['kg','kilo','kilos','kilogramo','kilogramos'].includes(u)) return 'kg'; 
        if(['g','gr','gramos','gramo'].includes(u)) return 'g'; 
        if(['l','litro','litros','litres'].includes(u)) return 'l'; 
        if(['ml','mililitro','mililitros'].includes(u)) return 'ml'; 
        return 'ud'; 
    },
    convert: (val,from,to) => { 
        from=UnitConverter.normalize(from); to=UnitConverter.normalize(to); 
        if(from===to) return val; 
        if(from==='kg'&&to==='g') return val*1000; 
        if(from==='g'&&to==='kg') return val/1000; 
        if(from==='l'&&to==='ml') return val*1000; 
        if(from==='ml'&&to==='l') return val/1000; 
        return val; 
    }
};

function logStock(ingId, qty, type, reason, price=0) { 
    const ing=db.ingredientes.find(x=>x.id===ingId); 
    db.kardex.push({
        id:generateID(), ts:Date.now(), date:getTS(), 
        ingId, n: ing ? ing.n : 'Desconocido', type, qty, unit: ing ? ing.unit : 'ud', price, reason, user: currentUser ? currentUser.n : 'Sistema'
    }); 
}

/* ================= 5. UI RENDER & SECURITY ================= */
function loadApp() { 
    document.getElementById('user-name').innerText = currentUser ? currentUser.n : 'Login'; 
    renderNav(); 
    // Redirigir a vista segura si es staff
    render(currentUser && currentUser.role==='admin' ? 'Admin' : 'Cocina'); 
}

function renderNav() {
    const isAdmin = currentUser?.role==='admin';
    const views = [
        {id:'Diario', l:'Caja', i:'<path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>', restricted:false},
        {id:'Admin', l:'Gestión', i:'<path d="M12 2L3 5v6c0 5 3.8 9.7 9 11 5.2-1.3 9-6 9-11V5l-9-3z"/>', restricted:!isAdmin},
        {id:'Cocina', l:'Cocina', i:'<path d="M12 2C8.1 6 7 8 7 11c0 3.9 3.1 7 7 7s7-3.1 7-7c0-3-1.1-5-5-9z"/>', restricted:false},
        {id:'Stock', l:'Stock', i:'<path d="M20 6h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-2 .89-2 2v11c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2z"/>', restricted:false}
    ];
    const nav = document.getElementById('navbar');
    nav.innerHTML = '';
    views.forEach(v => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.id = `btn-${v.id}`;
        btn.className = v.restricted ? 'locked' : '';
        btn.setAttribute('aria-label', v.l);
        btn.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${v.i}</svg><span>${clean(v.l)}</span>`;
        btn.addEventListener('click', () => render(v.id));
        nav.appendChild(btn);
    });
}

function render(view) {
    if((view==='Diario' || view==='Admin') && currentUser && currentUser.role!=='admin' && view==='Admin') {
        return toast("⛔ Acceso Restringido", "error");
    }
    Array.from(document.querySelectorAll('nav button')).forEach(b => b.classList.remove('active'));
    document.getElementById(`btn-${view}`)?.classList.add('active');
    const app = document.getElementById('app');
    if(view==='Diario') renderDiario(app);
    else if(view==='Admin') renderAdmin(app);
    else if(view==='Cocina') renderCocina(app);
    else if(view==='Stock') renderStock(app);
}

/* ================= 6. GESTIÓN (ADMIN) ================= */
function renderAdmin(app) {
    const totalVentas = (db.diario || []).filter(d => isInPeriod(d.date)).reduce((acc, d) => acc + (d.total||0), 0);
    const periodAlbs = (db.albaranes || []).filter(a => isInPeriod(a.date));
    const periodCosts = periodAlbs.reduce((acc, a) => acc + (a.total||0), 0);
    const profit = totalVentas - periodCosts;

    const quarterBtns = [1,2,3,4].map(q => `<button class="period-btn ${fiscalQuarter===q ? 'active' : ''}" onclick="fiscalQuarter=${q}; renderAdmin(document.getElementById('app'))">${q}T</button>`).join(' ');

    app.innerHTML = `
        <div class="text-center font-bold text-slate-400 mb-2">${fiscalYear}</div>

function renderOmnes(c) {
    if (!db.recetas || db.recetas.length === 0) {
        c.innerHTML = `<div class="glass-card text-center"><h3 class="font-bold text-slate-800">No hay recetas</h3><p class="text-xs text-slate-400 mb-4">Crea platos en Cocina primero.</p><button class="btn-premium" onclick="render('Cocina')">Ir a Cocina</button></div>`;
        return;
    }
    let totalSold=0, totalRev=0, totalCost=0;
    const periodSalesMap = {}; 
    (db.sales_history || []).filter(log => isInPeriod(log.date)).forEach(log => { (log.items || []).forEach(it => { const rid = it.rid || db.recetas.find(r=>r.n===it.n)?.id; if(rid) periodSalesMap[rid] = (periodSalesMap[rid]||0) + (it.q||0); }); });
    const recipesData = (db.recetas||[]).map(r => { 
        const costData = calcRecipe(r); 
        const sales = (periodSalesMap[r.id] || r.sales || 0); 
        totalSold += sales; 
        totalRev += (sales * (r.pvp || 0)); 
        totalCost += (sales * (costData.cost || 0));
        return { id: r.id, n: r.n, sales, margin: (r.pvp || 0) - (costData.cost||0), cost: costData.cost || 0 };
    });
    const avgMargin = totalSold > 0 ? ((totalRev - totalCost) / totalSold) : 0;
    recipesData.sort((a,b) => b.sales - a.sales);
    let html = recipesData.map(d => `<div class="bg-white p-3 rounded-xl border mb-2"><div class="flex justify-between items-center"><div><div class="font-bold">${clean(d.n)}</div><div class="text-xs text-slate-400">Vendidos: ${d.sales}</div></div><div class="text-right"><div class="text-sm font-black">${Num.fmt(d.margin)}</div><div class="text-xs text-slate-400">Cost: ${Num.fmt(d.cost)}</div></div></div></div>`).join('');
    c.innerHTML = `<div class="glass-card"><h3 class="font-bold text-slate-800 mb-3">Análisis ${fiscalQuarter===0?'ANUAL':fiscalQuarter+'T'}</h3>${html}</div>`;
}

function editSales() {
    if (!db.recetas || db.recetas.length === 0) return toast("No hay recetas creadas", "error");
    const html = db.recetas.map(r => `<div class="flex justify-between items-center py-2 border-b border-slate-50"><span class="text-sm font-medium text-slate-700 w-1/2">${clean(r.n)}</span><div class="w-1/2"><input id="sale-add-${r.id}" type="number" min="0" value="0" class="input-premium"></div></div>`).join('');
    showModal('Cierre de Ventas', `<div class="bg-blue-50 p-3 rounded-lg text-blue-800 text-xs mb-4">Introduce <b>ventas del día</b>.</div><div class="max-h-[50vh] overflow-y-auto pr-2 mb-4">${html}</div><div class="text-right"><button class="btn-premium" onclick="commitSalesSession()">Procesar</button></div>`);
}

function commitSalesSession() {
    let log = { id: generateID(), date: getTS(), items: [] };
    let hasData = false;
    (db.recetas || []).forEach(r => {
        const el = document.getElementById(`sale-add-${r.id}`);
        const qty = el ? Num.parse(el.value) : 0;
        if(qty > 0) {
            hasData = true;
            (r.items || []).forEach(it => { 
                if(it.type === 'ing') { 
                    const ing = db.ingredientes.find(x => x.id === it.id); 
                    if(ing) { 
                        let needed = (it.q || 0) * qty; 
                        if(it.merma) needed = needed / (1 - (it.merma/100));
                        ing.stock = (ing.stock || 0) - needed;
                        logStock(ing.id, -needed, 'OUT', `Venta: ${r.n}`, ing.cost || 0);
                    }
                }
            });
            r.sales = (r.sales || 0) + qty; 
            log.items.push({ rid: r.id, n: r.n, q: qty });
        }
    });
    if(hasData) { db.sales_history.push(log); save("Ventas procesadas"); closeModal(); renderAdmin(document.getElementById('app')); } else toast("No has introducido cantidades", "error");
}

function parseAlb() { 
    const txt = document.getElementById('alb-input').value.trim(); tempItems = []; 
    if (!txt) return toast("Texto vacío", "error"); 
    txt.split(/\r?\n/).forEach(l => { 
        const line = l.trim();
        if(!line) return;
        // Try patterns: "10 Patata; 5; 0,50" or "Patata;5;0,50"
        const parts = line.split(';').map(p=>p.trim()).filter(Boolean);
        if(parts.length >= 3) {
            const name = parts[0].replace(/^\d+\s*/, '').trim();
            const q = Num.parse(parts[1]);
            const p = Num.parse(parts[2]);
            tempItems.push({ n: name, q, p, tax: 0, unit: 'kg' });
        } else {
            // fallback: try "10kg Patata 5 0,50"
            const m = line.match(/([\d.,]+)\s*([a-zA-Z%]*)\s*(.+?)\s+([\d.,]+)\s*$/);
            if(m) {
                const q = Num.parse(m[1]);
                const unit = m[2] || 'kg';
                const name = m[3].trim();
                const p = Num.parse(m[4]);
                tempItems.push({ n: name, q, p, tax: 0, unit });
            }
        }
    });
    renderAlbGrid();
}
function renderAlbGrid() { 
    const el = document.getElementById('alb-grid'); if(!el) return; 
    el.innerHTML = tempItems.length ? tempItems.map((it,i) => `<div class="bg-white p-2 rounded-xl border border-slate-100 flex justify-between items-center mb-2"><div><div class="font-bold">${clean(it.n)}</div><div class="text-xs text-slate-400">${it.q} ${clean(it.unit)} · ${Num.fmt(it.p)}</div></div><div><button class="btn-ghost" onclick="tempItems.splice(${i},1); renderAlbGrid()">Eliminar</button></div></div>`).join('') : '<div class="text-sm text-slate-400">No hay items parseados</div>';
}
function commitAlb() {
    if(!tempItems.length) return toast("Vacío", "error");
    const prov=document.getElementById('alb-prov').value || 'Proveedor';
    const date=document.getElementById('alb-date').value || getISO();
    if(!db.proveedores.find(p=>p.n===prov)) db.proveedores.push({n:prov});
    tempItems.forEach(it => {
        const cleanName = it.n.trim();
        let ing = db.ingredientes.find(x => x.n.trim().toLowerCase() === cleanName.toLowerCase() && x.unit === it.unit);
        if(!ing) { ing = {id:generateID(), n:cleanName, stock:0, cost:0, unit:it.unit, aller:[]}; db.ingredientes.push(ing); }
        const totalQty = Math.max(0, ing.stock) + it.q;
        ing.cost = totalQty > 0 ? ((Math.max(0, ing.stock)*ing.cost) + (it.q*it.p)) / totalQty : it.p;
        ing.stock += it.q;
        logStock(ing.id, it.q, 'IN', `Alb: ${prov}`, it.p);
    });
    const base = tempItems.reduce((a,b)=>a+(b.q*b.p),0);
    const tax = tempItems.reduce((a,b)=>a+(b.q*b.p*(b.tax||0)/100),0);
    db.albaranes.push({id:generateID(), num:document.getElementById('alb-num').value||'', prov, productor:'', date, items:JSON.parse(JSON.stringify(tempItems)), total: base, taxes: tax, invoiced:false});
    save("Entrada OK"); tempItems=[]; renderAdmin(document.getElementById('app'));
}
function editAlb(id) { const alb = db.albaranes.find(a => a.id === id); if(!alb) return; if(confirm("¿Editar? Se revertirá el stock.")) { alb.items.forEach(it => { const ing = db.ingredientes.find(x=>x.n.trim().toLowerCase()===it.n.trim().toLowerCase() && x.unit===it.unit); if(ing) { ing.stock -= it.q; logStock(ing.id, -it.q, 'REVERT', `Revert Alb ${alb.num}`); } }); showModal('Editar Albaran', `<pre>${clean(JSON.stringify(alb, null, 2))}</pre>`); } }
function deleteAlb(id) { const alb = db.albaranes.find(a => a.id === id); if(!alb) return; if(confirm("¿Borrar?")) { alb.items.forEach(it => { const ing = db.ingredientes.find(x=>x.n.trim().toLowerCase()===it.n.trim().toLowerCase() && x.unit===it.unit); if(ing) { ing.stock -= it.q; logStock(ing.id, -it.q, 'DEL', `Alb deleted`); } }); db.albaranes = db.albaranes.filter(a=>a.id!==id); save("Albarán borrado"); renderAdmin(document.getElementById('app')); } }
function viewAlbDetails(id){ const a=db.albaranes.find(x=>x.id===id); if(a) showModal(`Detalle ${clean(a.num||a.id)}`, `<table class="w-full text-sm"><thead><tr><th>Prod</th><th>Q</th><th>€</th></tr></thead><tbody>${a.items.map(it=>`<tr><td>${clean(it.n)}</td><td>${Num.fmt(it.q)} ${clean(it.unit)}</td><td>${Num.fmt(it.p)}</td></tr>`).join('')}</tbody></table>`); }
function exportAlbCSV(){ if(!tempItems.length) return toast("Vacío", "error"); const rows = tempItems.map(it => `${clean(it.n)};${it.q};${Num.fmt(it.p)}`); const csv = ['Prod;Cant;Precio', ...rows].join('\n'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})); a.download = `albaran_${getISO()}.csv`; a.click(); }

function calcRecipe(r) { let t=0; let all=new Set(); (r.items||[]).forEach(it => { if(it.type==='ing') { const i = db.ingredientes.find(x=>x.id===it.id); if(i) { const yieldFactor = (it.merma && it.merma>0) ? (1 - (it.merma/100)) : 1; const qtyNeeded = (it.q || 0) / yieldFactor; t += (i.cost || 0) * qtyNeeded; all.add(i.id); } } }); return { cost: t, uniqueIngredients: all.size }; }
function editRec(id) { const r = id ? db.recetas.find(x=>x.id===id) : {id:generateID(), n:'', pvp:0, time:10, items:[], sales:0, unit:'ud'}; tempItems = JSON.parse(JSON.stringify(r.items || [])); showModal('Editar Receta', `<label>Nombre</label><input id="er-n" class="input-premium mb-2" value="${clean(r.n)}"/><label>PVP</label><input id="er-pvp" type="number" class="input-premium mb-2" value="${r.pvp||0}"/><label>Tiempo (min)</label><input id="er-time" type="number" class="input-premium mb-2" value="${r.time||10}"/><div class="mb-2"><label>Ingredientes</label><div id="er-list" class="space-y-2"></div><div class="flex gap-2 mt-2"><select id="er-sel" class="input-premium">${(db.ingredientes||[]).map(i=>`<option value="${i.id}">${clean(i.n)}</option>`).join('')}</select><input id="er-q" type="number" class="input-premium" placeholder="q"/><input id="er-m" type="number" class="input-premium" placeholder="merma%"/><button class="btn-action btn-premium" onclick="addItemToRec()">Añadir</button></div></div><div class="text-right"><button class="btn-premium" onclick="saveRec('${r.id}')">Guardar</button></div>`); renderRecItems(); }
function deleteRec(id) { if(confirm("¿Eliminar?")) { db.recetas=db.recetas.filter(x=>x.id!==id); save("Eliminada"); closeModal(); render('Cocina'); }}
function addItemToRec() { const id = document.getElementById('er-sel').value; const q = Num.parse(document.getElementById('er-q').value); const m = Num.parse(document.getElementById('er-m').value) || 0; if(!id || q<=0) return toast("Selecciona ingrediente y cantidad", "error"); tempItems.push({ id, q, merma: m, type: 'ing' }); renderRecItems(); }
function renderRecItems() { const list = document.getElementById('er-list'); if(!list) return; list.innerHTML = tempItems.map((it, i) => { const ing = db.ingredientes.find(x=>x.id===it.id); return `<div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg"><div><b>${clean(ing ? ing.n : 'Desconocido')}</b><div class="text-xs text-slate-400">${Num.fmt(it.q)} ${ing ? clean(ing.unit) : ''} · merma ${it.merma||0}%</div></div><div><button class="btn-ghost" onclick="tempItems.splice(${i},1); renderRecItems()">Quitar</button></div></div>` }).join('') }
function saveRec(id) { const rIndex = db.recetas.findIndex(x=>x.id===id); const r = { id, n: document.getElementById('er-n').value || 'Sin nombre', pvp: Num.parse(document.getElementById('er-pvp').value), time: Num.parse(document.getElementById('er-time').value), items: tempItems, sales: (db.recetas.find(x=>x.id===id)?.sales||0) }; if(rIndex===-1) db.recetas.push(r); else db.recetas[rIndex] = r; save("Receta guardada"); closeModal(); render('Cocina'); }
function viewRec(id) { const r = db.recetas.find(x=>x.id===id); if(!r) return; const c = calcRecipe(r); showModal(clean(r.n), `<div class="flex justify-around mb-6 bg-slate-50 p-4 rounded-xl"><div class="text-center"><div class="text-xs text-slate-500">Coste:</div><div class="text-xl font-black">${Num.fmt(c.cost)}</div></div><div class="text-center"><div class="text-xs text-slate-500">PVP</div><div class="text-xl font-black">${Num.fmt(r.pvp||0)}</div></div></div><div>${(r.items||[]).map(it=>{ const ing=db.ingredientes.find(x=>x.id===it.id); return `<div class="py-1 border-b"><b>${clean(ing ? ing.n : 'Desconocido')}</b> · ${Num.fmt(it.q)} ${ing ? clean(ing.unit) : ''}</div>`}).join('')}</div>`); }

                <button class="btn-ghost" onclick="toggleInventoryMode()">${inventoryMode ? 'Salir Inventario' : 'Inventario'}</button>
            </div></div>
            <input placeholder="🔍 Buscar..." onkeyup="searchFilter=this.value; render('Stock')" value="${clean(searchFilter)}" class="input-premium mb-4" aria-label="Buscar en stock">

function sendWhatsApp() {
    const list = (db.ingredientes || []).filter(i => (i.stock || 0) < (i.min || 0)).map(i => `- ${i.n}: ${(((i.min||0) - (i.stock||0)) + ((i.min||0)*0.2)).toFixed(2)} ${i.unit}`).join('%0A');
    if(!list) return toast("No hay productos por pedir", "info");
    const msg = encodeURIComponent(`Pedido automático:%0A${list}`);
    window.open(`https://wa.me/?text=${msg}`, '_blank');
}
function toggleInventoryMode() { inventoryMode = !inventoryMode; render('Stock'); }
function applyInventory() {
    (db.ingredientes || []).forEach(i => {
        const el = document.getElementById(`real-stock-${i.id}`);
        if(el) {
            const realQty = Num.parse(el.value);
            const diff = realQty - (i.stock || 0);
            if(diff !== 0) {
                i.stock = realQty;
                logStock(i.id, diff, 'ADJ', 'Ajuste inventario', i.cost || 0);
            }
        }
    });
    save("Inventario aplicado");
    inventoryMode = false;
    render('Stock');
}
function showKardex(id) { if(currentUser.role!=='admin') return; const i = db.ingredientes.find(x => x.id === id); const logs = (db.kardex || []).filter(k => k.ingId === id).reverse().slice(0, 50); showModal(`Kardex ${clean(i.n)}`, `<div class="max-h-[50vh] overflow-y-auto"><table class="w-full text-sm"><thead><tr><th>Fecha</th><th>Tipo</th><th>Cant</th><th>Motivo</th></tr></thead><tbody>${logs.map(l=>`<tr><td>${clean(l.date)}</td><td>${clean(l.type)}</td><td>${Num.fmt(l.qty)} ${clean(l.unit||'')}</td><td>${clean(l.reason)}</td></tr>`).join('')}</tbody></table></div>`); }
function regMerma(id) { const i = db.ingredientes.find(x=>x.id===id); showModal('Merma', `<p class="text-sm text-slate-500 mb-4">Producto: <b>${clean(i.n)}</b></p><label>Cantidad Perdida (${i.unit})</label><input id="m-q" type="number" class="input-premium" /><label>Motivo</label><input id="m-r" class="input-premium" /><div class="text-right mt-3"><button class="btn-premium" onclick="saveMerma('${id}')">Registrar</button></div>`); }
function saveMerma(id) { const i = db.ingredientes.find(x=>x.id===id); const q = Num.parse(document.getElementById('m-q').value); const r = document.getElementById('m-r').value || 'Merma'; if(q>0) { i.stock = (i.stock||0) - q; db.mermas = db.mermas || []; db.mermas.push({id:generateID(), date:getTS(), ing:id, q, reason:r}); logStock(i.id, -q, 'MERMA', r, i.cost || 0); save("Merma registrada"); closeModal(); render('Stock'); } else toast("Cantidad inválida", "error"); }
function editIng(id) { const i = db.ingredientes.find(x=>x.id===id) || {id, n:'', cost:0, stock:0, min:0, unit:'kg', aller:[]}; showModal('Ficha Almacén', `<label>Nombre</label><input id="ei-n" class="input-premium mb-2" value="${clean(i.n)}"/><label>Coste</label><input id="ei-cost" type="number" class="input-premium mb-2" value="${Num.fmt(i.cost || 0)}"/><label>Stock</label><input id="ei-stock" type="number" class="input-premium mb-2" value="${Num.fmt(i.stock || 0)}"/><label>Mínimo</label><input id="ei-min" type="number" class="input-premium mb-2" value="${Num.fmt(i.min || 0)}"/><label>Unidad</label><input id="ei-unit" class="input-premium mb-2" value="${clean(i.unit||'kg')}"/><label>Alergenos</label><div id="ei-aller" class="flex gap-2 flex-wrap mb-3">${ALLERGENS.map((a,idx)=>`<div class="p-1 rounded cursor-pointer ${i.aller && i.aller.includes(a.k) ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-500'}" data-idx="${idx}" onclick="toggleAller(this)">${a.i}</div>`).join('')}</div><div class="text-right"><button class="btn-premium" onclick="saveIng('${i.id}')">Guardar</button></div>`); }
function toggleAller(el) { el.classList.toggle('bg-slate-800'); el.classList.toggle('text-white'); el.classList.toggle('bg-slate-100'); el.classList.toggle('text-slate-500'); }
function saveIng(id) { const i = db.ingredientes.find(x=>x.id===id) || {id}; const allerEls = document.querySelectorAll('#ei-aller div'); const aller = []; allerEls.forEach((d, idx) => { if(d.classList.contains('bg-slate-800')) aller.push(ALLERGENS[idx].k); }); i.n = document.getElementById('ei-n').value || 'Sin nombre'; i.cost = Num.parse(document.getElementById('ei-cost').value); i.stock = Num.parse(document.getElementById('ei-stock').value); i.min = Num.parse(document.getElementById('ei-min').value); i.unit = document.getElementById('ei-unit').value || 'kg'; i.aller = aller; if(!db.ingredientes.find(x=>x.id===id)) db.ingredientes.push(i); save("Producto guardado"); closeModal(); render('Stock'); }
function deleteIng(id){ if(confirm("¿Eliminar?")){ db.ingredientes=db.ingredientes.filter(i=>i.id!==id); save("Borrado"); closeModal(); render('Stock'); }}

/* ================= 9. DIARIO & CAJA V141 ================= */
function renderDiario(app){
    const r = db.diario.find(d => d.date === currentDiarioDate) || { cash:0, visa:0, tpv:0, amex:0, glovo:0, uber:0, apper:0, expenses:0 };
    const totalVenta = (r.cash||0) + (r.visa||0) + (r.tpv||0) + (r.amex||0) + (r.glovo||0) + (r.uber||0) + (r.apper||0);
    const realCash = (r.cash||0) - (r.expenses||0);
    const historyRows = (db.diario || []).filter(d => isInPeriod(d.date)).sort((a,b) => b.date.localeCompare(a.date)).map(d => `<div class="flex justify-between items-center py-2 border-b text-sm"><div>${clean(d.date)}</div><div>${Num.fmt(d.total||0)}</div></div>`).join('');

    app.innerHTML = `
    <div class="glass-card">
        <div class="section-header flex justify-between items-center mb-6">
            <h3 class="font-bold text-slate-800">CIERRE CAJA</h3>
            <input type="date" value="${currentDiarioDate}" class="input-premium" onchange="currentDiarioDate=this.value; renderDiario(document.getElementById('app'))" />
        </div>
        <div class="space-y-4">
            <div class="bg-emerald-50/50 p-4 rounded-xl border border-emerald-100">
                <div class="text-xs font-bold text-emerald-800 mb-2 uppercase tracking-wider">Efectivo</div>
                <div class="grid grid-cols-2 gap-2">
                    <input id="z-cash" class="input-premium" value="${Num.fmt(r.cash||0)}" oninput="calcTotal()" />
                    <input id="z-expenses" class="input-premium" value="${Num.fmt(r.expenses||0)}" oninput="calcTotal()" />
                </div>
            </div>
            <div class="bg-blue-50/50 p-4 rounded-xl border border-blue-100">
                <div class="text-xs font-bold text-blue-800 mb-2 uppercase tracking-wider">Tarjetas</div>
                <div class="grid grid-cols-3 gap-2">
                    <input id="z-visa" class="input-premium" value="${Num.fmt(r.visa||0)}" oninput="calcTotal()" />
                    <input id="z-tpv" class="input-premium" value="${Num.fmt(r.tpv||0)}" oninput="calcTotal()" />
                    <input id="z-amex" class="input-premium" value="${Num.fmt(r.amex||0)}" oninput="calcTotal()" />
                </div>
            </div>
            <div class="bg-orange-50/50 p-4 rounded-xl border border-orange-100">
                <div class="text-xs font-bold text-orange-800 mb-2 uppercase tracking-wider">Delivery</div>
                <div class="grid grid-cols-3 gap-2">
                    <input id="z-glovo" class="input-premium" value="${Num.fmt(r.glovo||0)}" oninput="calcTotal()" />
                    <input id="z-uber" class="input-premium" value="${Num.fmt(r.uber||0)}" oninput="calcTotal()" />
                    <input id="z-apper" class="input-premium" value="${Num.fmt(r.apper||0)}" oninput="calcTotal()" />
                </div>
            </div>
            <div class="flex justify-between items-center pt-4 border-t border-slate-200">
                <span class="font-bold text-slate-400">VENTA TOTAL</span>
                <span id="z-total-display" class="text-4xl font-black text-slate-800">${Num.fmt(totalVenta)}</span>
            </div>
        </div>
        <button class="btn-premium mt-6" onclick="saveZ()">GUARDAR CIERRE</button>
    </div>
    <div class="glass-card">
        <h3 class="font-bold text-xs text-slate-400 mb-4 uppercase">Histórico (${fiscalQuarter===0?'AÑO':fiscalQuarter+'T'})</h3>
        <div class="max-h-60 overflow-y-auto mb-4">${historyRows || '<div class="text-sm text-slate-400">Sin cierres</div>'}</div>
    </div>
    `;
}
function calcTotal() { const v = (id) => Num.parse(document.getElementById(id).value); const cash = v('z-cash'), exp = v('z-expenses'); const total = cash + v('z-visa') + v('z-tpv') + v('z-amex') + v('z-glovo') + v('z-uber') + v('z-apper'); document.getElementById('z-total-display').innerText = Num.fmt(total); return total; }
function saveZ(){ const v = (id) => Num.parse(document.getElementById(id).value); const data = { date: currentDiarioDate, cash: v('z-cash'), expenses: v('z-expenses'), visa: v('z-visa'), tpv: v('z-tpv'), amex: v('z-amex'), glovo: v('z-glovo'), uber: v('z-uber'), apper: v('z-apper') }; data.total = calcTotal(); const idx = db.diario.findIndex(d=>d.date===currentDiarioDate); if(idx===-1) db.diario.push(data); else db.diario[idx]=data; save("Cierre guardado"); renderDiario(document.getElementById('app')); }
function exportDiarioCSV() { if(!db.diario.length) return toast("Vacío", "error"); const header = ['Fecha;Efectivo;Gastos;Visa;TPV;Amex;Glovo;Uber;Apper;Total']; const rows = db.diario.map(d=>`${d.date};${Num.fmt(d.cash)};${Num.fmt(d.expenses)};${Num.fmt(d.visa)};${Num.fmt(d.tpv)};${Num.fmt(d.amex)};${Num.fmt(d.glovo)};${Num.fmt(d.uber)};${Num.fmt(d.apper)};${Num.fmt(d.total)}`); const csv = header.concat(rows).join('\n'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})); a.download = `diario_${getISO()}.csv`; a.click(); }

/* ================= 10. UTILS & BACKUP ================= */
function showModal(t,c){ document.getElementById('m-title').innerText=t; document.getElementById('m-body').innerHTML=c; document.getElementById('modal-overlay').classList.remove('hidden'); document.getElementById('modal-overlay').setAttribute('aria-hidden','false'); }
function closeModal(){ document.getElementById('modal-overlay').classList.add('hidden'); document.getElementById('modal-overlay').setAttribute('aria-hidden','true'); }
function downloadBackup(){ if(currentUser.role!=='admin') return toast("⛔ Solo Gerencia", "error"); const data = secure.enc(db); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data],{type:'text/plain'})); a.download = `arume_backup_${getISO()}.safe`; a.click(); }
function restoreBackup(input){ 
    const r = new FileReader(); 
    r.onload = e => { 
        try { 
            const d = secure.dec(e.target.result); 
            if(d && d.users) { 
                db=d; 
                save("Restaurado correctamente"); 
                loadApp();
            } else throw new Error(); 
        } catch(err) { toast("Archivo corrupto", "error"); } 
    }; 
    if(input.files && input.files[0]) r.readAsText(input.files[0]); else toast("No file", "error");
}

/* ================= INIT ================= */
init();

/* Accessible global helpers for debug (optional) */
window.__ARUME = { db, save, sync, render };

</script>
