<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>ARUME V147 · Diamond Audit</title>
    <meta name="description" content="Sistema Integral de Gestión Hostelería">
    <meta name="theme-color" content="#0f172a">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* === BASE === */
        :root { --primary: #4f46e5; --dark: #0f172a; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #f1f5f9; 
            padding-bottom: 120px; /* Espacio para el menú inferior */
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            overscroll-behavior-y: none; /* Evita rebote en móvil */
        }

        /* === ESTÉTICA DIAMOND (CRISTAL) === */
        .glass-card { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255,255,255,0.5); 
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.08); 
            border-radius: 24px; 
            padding: 24px; 
            margin-bottom: 20px; 
            position: relative;
            overflow: hidden;
        }

        /* === BOTONES PRO === */
        .btn-premium { 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
            color: white; padding: 16px; border-radius: 16px; 
            font-weight: 700; font-size: 0.9rem;
            box-shadow: 0 8px 20px -5px rgba(15, 23, 42, 0.3); 
            width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s; border: none;
            letter-spacing: 0.5px;
        }
        .btn-premium:active { transform: scale(0.98); box-shadow: 0 4px 10px rgba(15, 23, 42, 0.2); }

        .btn-action { background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%); box-shadow: 0 8px 20px -5px rgba(79, 70, 229, 0.4); } 
        .btn-whatsapp { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); color: white; box-shadow: 0 8px 20px -5px rgba(34, 197, 94, 0.4); }
        
        .btn-ghost { background: #f8fafc; color: #64748b; font-weight: 700; padding: 12px; border-radius: 12px; width: 100%; cursor: pointer; border: 1px solid #e2e8f0; transition: 0.2s; }
        .btn-ghost:active { background: #e2e8f0; }
        
        .btn-icon { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 1.1rem; cursor: pointer; border: none; transition: 0.2s; }
        .btn-icon:active { transform: scale(0.9); }
        .btn-edit { background: #eff6ff; color: #3b82f6; } 
        .btn-delete { background: #fef2f2; color: #ef4444; } 
        .btn-merma { background: #fff7ed; color: #f97316; } 
        .btn-log { background: #f0fdf4; color: #16a34a; }

        /* === INPUTS MEJORADOS === */
        .input-premium { 
            width: 100%; padding: 14px; background: #f8fafc; 
            border: 2px solid #e2e8f0; border-radius: 14px; 
            outline: none; font-size: 14px; font-weight: 600; color: #334155;
            transition: 0.2s;
        }
        .input-premium:focus { border-color: #4f46e5; background: white; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        label { display: block; font-size: 0.7rem; font-weight: 800; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* === BARRA DE NAVEGACIÓN === */
        nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: rgba(255,255,255,0.9); backdrop-filter: blur(20px);
            padding: 12px 0; display: flex; justify-content: space-around; 
            box-shadow: 0 -10px 40px rgba(0,0,0,0.05); 
            z-index: 50; border-top: 1px solid rgba(255,255,255,0.5);
            padding-bottom: max(12px, env(safe-area-inset-bottom));
        }
        nav button { flex: 1; background: none; border: none; color: #cbd5e1; display: flex; flex-direction: column; align-items: center; font-size: 0.65rem; font-weight: 700; transition: 0.3s; cursor: pointer; }
        nav button.active { color: #0f172a; transform: translateY(-4px); }
        nav button.active svg { fill: #0f172a; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); }
        nav button svg { width: 26px; height: 26px; fill: #cbd5e1; margin-bottom: 6px; transition: 0.3s; }
        nav button.locked { opacity: 0.3; pointer-events: none; filter: grayscale(1); }

        /* === UI ELEMENTS === */
        .modal { background: white; width: 95%; max-width: 600px; max-height: 90vh; overflow-y: auto; border-radius: 32px; padding: 24px; box-shadow: 0 40px 60px -20px rgba(0,0,0,0.3); animation: slideUp 220ms ease; }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 160ms; }
        .overlay:not(.hidden) { opacity: 1; pointer-events: auto; }
        .hidden { display: none !important; }

        .tag { font-size: 0.65rem; font-weight: 800; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; }
        .tag-green { background: #dcfce7; color: #166534; }
        .tag-red { background: #fee2e2; color: #991b1b; }

        /* === MODO IMPRESIÓN (PAPEL) === */
        @media print {
            body { padding: 0; background: white; }
            nav, header, .btn-premium, .btn-ghost, .btn-icon, .input-premium, button, input, select, .overlay { display: none !important; }
            .overlay:not(.hidden) { position: static; background: none; display: block !important; opacity: 1; }
            .modal { box-shadow: none; border: none; width: 100%; max-width: 100%; padding: 0; overflow: visible; height: auto; }
            .overlay:not(.hidden) ~ main { display: none; }
            body, h1, h2, h3, div, span, p { color: black !important; -webkit-print-color-adjust: exact; }
            .glass-card, .modal { border: 1px solid #000; box-shadow: none; border-radius: 0; }
            p, li { page-break-inside: avoid; }
        }
    </style>
</head>
<body>

    <div id="loading-overlay" class="hidden fixed inset-0 bg-white/90 z-[300] flex justify-center items-center flex-col backdrop-blur-sm">
        <div class="w-12 h-12 border-4 border-slate-200 border-t-indigo-600 rounded-full animate-spin mb-4"></div>

    <div id="toast-container" class="fixed top-6 left-1/2 -translate-x-1/2 z-[400] w-max pointer-events-none space-y-2"></div>
    
    <input type="file" id="backup-input" class="hidden" onchange="restoreBackup(this)">

    <header class="sticky top-0 z-40 px-6 py-4 flex justify-between items-center bg-white/80 backdrop-blur-xl border-b border-white/50 shadow-sm">

            <h1 class="text-2xl font-black text-slate-900 tracking-tighter">ARUME <span class="text-indigo-600">V147</span></h1>

        <div id="user-panel" class="bg-slate-100 px-3 py-1.5 rounded-full text-xs font-bold text-slate-600 flex items-center gap-2 cursor-pointer hover:bg-slate-200 transition border border-slate-200" onclick="logout()">

    <nav id="navbar"></nav>

        <div class="modal">
            <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                <h3 id="m-title" class="text-lg font-black text-slate-800 uppercase tracking-tight"></h3>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center bg-slate-50 rounded-full text-slate-400 hover:bg-slate-200 hover:text-slate-800 text-lg font-bold transition">✕</button>

            <h2 class="text-6xl font-black tracking-tighter mb-2">ARUME</h2>
            <p class="text-indigo-500 text-xs tracking-[0.5em] uppercase font-bold">Gestión Integral</p>
        </div>

        <div class="grid grid-cols-3 gap-4 w-72">
            <button class="w-20 h-20 rounded-full border border-white/10 text-2xl font-bold hover:bg-white/10 active:scale-95 transition" onclick="pin(1)">1</button>
            <button class="w-20 h-20 rounded-full border border-white/10 text-2xl font-bold hover:bg-white/10 active:scale-95 transition" onclick="pin(2)">2</button>
            <button class="w-20 h-20 rounded-full border border-white/10 text-2xl font-bold hover:bg-white/10 active:scale-95 transition" onclick="pin(3)">3</button>
            <button class="w-20 h-20 rounded-full border border-white/10 text-2xl font-bold hover:bg-white/10 active:scale-95 transition" onclick="pin(4)">4</button>
            <button class="w-20 h-20 rounded-full border border-white/10 text-2xl font-bold hover:bg-white/10 active:scale-95 transition" onclick="pin(5)">5</button>
            <button class="w-20 h-20 rounded-full border border-white/10 text-2xl font-bold hover:bg-white/10 active:scale-95 transition" onclick="pin(6)">6</button>
            <button class="w-20 h-20 rounded-full border border-white/10 text-2xl font-bold hover:bg-white/10 active:scale-95 transition" onclick="pin(7)">7</button>
            <button class="w-20 h-20 rounded-full border border-white/10 text-2xl font-bold hover:bg-white/10 active:scale-95 transition" onclick="pin(8)">8</button>
            <button class="w-20 h-20 rounded-full border border-white/10 text-2xl font-bold hover:bg-white/10 active:scale-95 transition" onclick="pin(9)">9</button>
            <button class="w-20 h-20 rounded-full bg-red-500/20 border border-red-500/50 text-red-400 font-bold active:scale-95 transition" onclick="pin('C')">C</button>
            <button class="w-20 h-20 rounded-full border border-white/10 text-2xl font-bold hover:bg-white/10 active:scale-95 transition" onclick="pin(0)">0</button>
            <button class="w-20 h-20 rounded-full bg-indigo-500 text-white font-bold shadow-lg shadow-indigo-500/50 active:scale-95 transition" onclick="pin('OK')">OK</button>
        </div>
        <p class="mt-10 text-slate-600 text-xs font-mono">PIN 0150 (Admin) | 1111 (Equipo)</p>
    </div>

<script>
/* ================= NÚCLEO LIGERO LIMPIO ================= */

/* Utilidades numéricas y sanitizado */
const Num = {
    parse: (str) => {
        if (str === undefined || str === null || str === '') return 0;
        if (typeof str === 'number') return str;
        let clean = String(str).replace(/[^0-9.,-]/g, '').replace(/\./g, '').replace(',', '.');
        let val = parseFloat(clean);
        return isNaN(val) ? 0 : val;
    },
    fmt: (n) => (n || 0).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
    csv: (n) => String(n || 0).replace('.', ',')
};

function clean(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

const generateID = () => Math.random().toString(36).substr(2, 9);
const getISO = () => new Date().toLocaleDateString('en-CA');
const getTS = () => new Date().toLocaleString('es-ES');

const UnitConverter = {
    normalize: (u) => {
        if (!u) return 'ud';
        u = String(u).toLowerCase().trim().replace('.', '');
        if (['kg','kilo','kilos','k'].includes(u)) return 'kg';
        if (['g','gr','gramos','grs'].includes(u)) return 'g';
        if (['l','litro','litros','lt'].includes(u)) return 'l';
        if (['ml','mili','cl'].includes(u)) return 'ml';
        return 'ud';
    },
    convert: (q, from, to) => {
        from = UnitConverter.normalize(from);
        to = UnitConverter.normalize(to);
        if (from === to) return q;
        if (from === 'kg' && to === 'g') return q * 1000;
        if (from === 'g' && to === 'kg') return q / 1000;
        if (from === 'l' && to === 'ml') return q * 1000;
        if (from === 'ml' && to === 'l') return q / 1000;
        return q;
    }
};

/* Configuración y datos iniciales */
const CONFIG = { GOOGLE_URL: "https://script.google.com/macros/s/AKfycbxL0hWPiYmQ_590bkFjd1B9xwsfrYQXQtEuUpP2Nraq973bDr2rpEgVnaJCpI3-DH8z/exec", COST_HOUR: 15 };
const ALLERGENS = [
    {k:'glu',i:'🌾'},{k:'cru',i:'🦐'},{k:'hue',i:'🥚'},{k:'pes',i:'🐟'},{k:'cac',i:'🥜'},
    {k:'soj',i:'🫘'},{k:'lac',i:'🥛'},{k:'fru',i:'🌰'},{k:'api',i:'🥬'},{k:'mos',i:'🍯'}
];
const FAMILIES = ['General', 'Carne', 'Pescado', 'Verdura', 'Secos', 'Lácteos', 'Congelado', 'Bebida', 'Alcohol', 'Limpieza', 'Packaging'];

const DB_INIT = { 
    users: [{id:'u1', n:'Gerencia', pin:'0150', role:'admin'}, {id:'u2', n:'Equipo', pin:'1111', role:'staff'}], 
    ingredientes: [], recetas: [], proveedores: [{ id: 'p1', n: 'Makro', tel: '', fam: 'General' }], 
    albaranes: [], facturas: [], diario: [], mermas: [], kardex: [], sales_history: [], lastSync: 0 
};

const secure = { enc: (d) => btoa(encodeURIComponent(JSON.stringify(d))), dec: (d) => JSON.parse(decodeURIComponent(atob(d))) };

let db = JSON.parse(JSON.stringify(DB_INIT));
let currentUser = null;
let currentPin = "";
let tempItems = [];
let activeAdminTab = 'dash';
let searchFilter = "";
let currentDiarioDate = new Date().toLocaleDateString('en-CA');
let inventoryMode = false;
let activeFamily = 'Todos';
let fiscalYear = new Date().getFullYear();
let fiscalQuarter = Math.floor(new Date().getMonth() / 3) + 1;

/* UI helpers */
function loading(show) { document.getElementById('loading-overlay').classList.toggle('hidden', !show); }
function toast(msg, type='info') {
    const c = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = `px-4 py-2 rounded-xl text-white pointer-events-auto ${type === 'error' ? 'bg-red-500' : 'bg-slate-800'}`;
    el.style.minWidth = '180px';
    el.innerText = msg;
    c.appendChild(el);
    setTimeout(() => { el.style.transition = 'opacity 200ms'; el.style.opacity = 0; setTimeout(()=>el.remove(), 220); }, 3000);
}

/* Modal única definición (eliminadas duplicaciones) */
function showModal(title, html) {
    document.getElementById('m-title').innerText = title || '';
    document.getElementById('m-body').innerHTML = html || '';
    document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal() {
    document.getElementById('modal-overlay').classList.add('hidden');
}

/* Inicialización, guardado y sincronización básica */
function init() {
    try { 
        const stored = localStorage.getItem('arume_v147');
        if (stored) db = secure.dec(stored);
        else {
            const old = localStorage.getItem('arume_v125');
            if (old) db = secure.dec(old);
        }
    } catch (e) { console.warn("DB Reset"); db = JSON.parse(JSON.stringify(DB_INIT)); }

    if (!db.users || !db.users.length) db.users = DB_INIT.users;
    if (!db.proveedores) db.proveedores = DB_INIT.proveedores;
    db.proveedores = (db.proveedores || []).map((p, i) => (!p || !p.id) ? { id: 'prov'+i, n: (p && p.n) ? p.n : (p || 'Proveedor'), tel: '', fam: 'General' } : p);

    const u = localStorage.getItem('arume_user');
    if (u) { currentUser = JSON.parse(u); document.getElementById('pin-screen').classList.add('hidden'); loadApp(); }
    else document.getElementById('pin-screen').classList.remove('hidden');

    if (CONFIG.GOOGLE_URL) sync();
}

async function save(msg) {
    loading(true);
    try {
        db.lastSync = Date.now();
        localStorage.setItem('arume_v147', secure.enc(db));
        loading(false);
        if (msg) toast(msg, 'info');
    } catch (e) {
        loading(false);
        console.error(e);
        toast("Error guardando", "error");
    }
}

async function sync() {
    if (!CONFIG.GOOGLE_URL) return;
    try {
        const r = await fetch(CONFIG.GOOGLE_URL);
        const c = await r.json();
        if (c && c.lastSync > (db.lastSync || 0)) {
            db = c;
            localStorage.setItem('arume_v147', secure.enc(db));
            toast("Sincronizado con servidor", "info");
        }
    } catch (e) {
        console.warn("Sync fallida");
    }
}

/* Login PIN */
function pin(n) {
    if (n === 'C') {
        currentPin = "";
        document.getElementById('pin-display').innerText = '****';
        return;
    }
    if (n === 'OK') {
        const u = (db.users || []).find(x => x.pin === currentPin);
        if (u) {
            currentUser = u;
            localStorage.setItem('arume_user', JSON.stringify(u));
            document.getElementById('pin-screen').classList.add('hidden');
            loadApp();
            toast(`Bienvenido ${u.n}`, 'info');
        } else {
            toast("PIN incorrecto", "error");
            currentPin = "";
            document.getElementById('pin-display').innerText = '****';
        }
        return;
    }
    currentPin += String(n);
    document.getElementById('pin-display').innerText = '*'.repeat(Math.min(currentPin.length, 4));
}

/* Logout y backups */
function logout() {
    if (confirm("¿Cerrar sesión?")) {
        localStorage.removeItem('arume_user');
        location.reload();
    }
}
function triggerRestore() { document.getElementById('backup-input').click(); }
function restoreBackup(input) {
    const r = new FileReader();
    r.onload = e => {
        try {
            const d = secure.dec(e.target.result);
            if (d && d.users) {
                db = d;
                save("Restaurado");
                loadApp();
            } else throw new Error("Formato inválido");
        } catch (err) {
            toast("Backup no válido", "error");
        }
    };
    if (input.files && input.files[0]) r.readAsText(input.files[0]);
}
function downloadBackup() {
    if (currentUser?.role !== 'admin') return toast("⛔ Solo Gerencia", "error");
    const data = secure.enc(db);
    const a = document.createElement('a');
    const blob = new Blob([data], { type: 'application/octet-stream' });
    a.href = URL.createObjectURL(blob);
    a.download = `arume_backup_${getISO()}.bak`;
    a.click();
}

/* Registro kardex simple */
function logStock(ingId, qty, type, reason, price = 0) {
    const ing = db.ingredientes.find(x => x.id === ingId);
    db.kardex.push({ id: generateID(), ts: Date.now(), date: getTS(), ingId, n: ing ? ing.n : 'N/D', type, qty, reason, price, unit: ing ? ing.unit : 'ud' });
    save();
}

/* Render principal y navegación */
function loadApp() {
    document.getElementById('user-name').innerText = currentUser ? currentUser.n : 'Login';
    renderNav();
    // Default view for role
    render(currentUser?.role === 'admin' ? 'Admin' : 'Cocina');
}

function renderNav() {
    const isAdmin = currentUser?.role === 'admin';
    const items = [
        { id: 'Diario', label: 'Caja', locked: !isAdmin },
        { id: 'Stock', label: 'Almacén' },
        { id: 'Cocina', label: 'Cocina' },
        { id: 'Admin', label: 'Admin', locked: !isAdmin }
    ];
    const nav = document.getElementById('navbar');
    nav.innerHTML = items.map(it => `<button class="${it.locked ? 'locked' : ''}" onclick="render('${it.id}')">${it.label}</button>`).join('');
}

function render(view) {
    if ((view === 'Diario' || view === 'Admin') && currentUser?.role !== 'admin') {
        toast("⛔ Solo Gerencia", "error");
        return;
    }
    const app = document.getElementById('app');
    if (view === 'Admin') renderAdmin(app);
    else if (view === 'Stock') renderStock(app);
    else if (view === 'Cocina') renderCocina(app);
    else if (view === 'Diario') renderDiario(app);
    else app.innerHTML = `<div class="glass-card"><h3>Vista ${clean(view)}</h3></div>`;
}

/* ================= ADMIN (resumen) ================= */
function isInPeriod(dateStr) {
    if (!dateStr) return false;
    const parts = String(dateStr).split('-');
    const year = parseInt(parts[0]);
    const month = parseInt(parts[1]);
    if (isNaN(year) || isNaN(month)) return false;
    if (year !== fiscalYear) return false;
    if (fiscalQuarter === 0) return true;
    return Math.ceil(month / 3) === fiscalQuarter;
}

function renderAdmin(app) {
    // filtros y métricas básicas
    const totalVentas = (db.diario || []).filter(d => isInPeriod(d.date)).reduce((acc, d) => acc + (d.total || 0), 0);
    const periodAlbs = (db.albaranes || []).filter(a => isInPeriod(a.date));
    const periodCosts = periodAlbs.reduce((acc, a) => acc + (a.total || 0), 0);
    const periodTax = periodAlbs.reduce((acc, a) => acc + (a.taxes || 0), 0);
    const profit = totalVentas - periodCosts;

    // selector de año/trimestre simple
    const qCtrl = `
    <div class="flex items-center justify-between bg-white p-2 rounded-2xl shadow-sm mb-4 border border-slate-100">
        <div class="flex items-center gap-2 bg-slate-100 rounded-lg px-2 py-1">
            <button class="w-8 h-8 flex items-center justify-center hover:bg-white rounded-full transition font-bold" onclick="fiscalYear--;renderAdmin(document.getElementById('app'))">‹</button>
            <span class="font-black text-slate-700 text-sm tracking-widest">${fiscalYear}</span>
            <button class="w-8 h-8 flex items-center justify-center hover:bg-white rounded-full transition font-bold" onclick="fiscalYear++;renderAdmin(document.getElementById('app'))">›</button>
        </div>
        <div class="flex gap-1 overflow-x-auto no-scrollbar">
            <button class="period-btn ${fiscalQuarter===1?'active':''}" onclick="fiscalQuarter=1;renderAdmin(document.getElementById('app'))">1T</button>
            <button class="period-btn ${fiscalQuarter===2?'active':''}" onclick="fiscalQuarter=2;renderAdmin(document.getElementById('app'))">2T</button>

    `;

function renderRecGrid(list) {
    if (!list || !list.length) return '<div class="text-center p-8 text-slate-400 italic">No hay recetas definidas.</div>';
    return list.map(r => {
        const c = calcRecipe(r);
        const marginPct = r.pvp > 0 ? ((r.pvp - c.t) / r.pvp) * 100 : 0;
        return `<div class="bg-white p-4 rounded-xl border shadow-sm cursor-pointer" onclick="viewRec('${r.id}')">
            <div class="flex justify-between items-center"><div class="font-bold">${clean(r.n)}</div><div class="text-sm font-bold">${Num.fmt(c.t)}€</div></div>
            <div class="text-xs text-slate-500 mt-2">PVP ${Num.fmt(r.pvp || 0)}€ · Margen ${marginPct.toFixed(0)}%</div>
        </div>`;
    }).join('');
}

function filterRec(txt) {
    const term = (txt || '').toLowerCase();
    document.getElementById('rec-grid').innerHTML = renderRecGrid((db.recetas || []).filter(r => r.n.toLowerCase().includes(term)));
}

function calcRecipe(r, visited = new Set()) {
    if (!r || visited.has(r.id)) return { t: 0, all: [] };
    visited.add(r.id);
    let t = 0;
    let all = new Set();
    (r.items || []).forEach(it => {
        const yieldFactor = (it.merma && it.merma > 0) ? (1 - (it.merma / 100)) : 1;
        if (it.type === 'ing') {
            const i = db.ingredientes.find(x => x.id === it.id);
            if (i) {
                const costUnit = UnitConverter.convert(1, r.unit || 'kg', i.unit);
                t += (it.q * costUnit * (i.cost || 0)) / yieldFactor;
                all.add(i.id);
            }
        } else if (it.type === 'rec') {
            const subR = db.recetas.find(x => x.id === it.id);
            if (subR) {
                const subC = calcRecipe(subR, visited);
                t += (subC.t * it.q);
                subC.all.forEach(k => all.add(k));
            }
        }
    });
    t += (r.time || 0) / 60 * CONFIG.COST_HOUR;
    return { t, all: Array.from(all) };
}

function adjustStock(id) {
    const input = document.getElementById(`real-stock-${id}`);
    const realQty = Num.parse(input.value);
    const i = db.ingredientes.find(x => x.id === id);
    if (!i) return toast("Producto no encontrado", "error");
    if (!isNaN(realQty)) {
        const diff = realQty - (i.stock || 0);
        if (diff !== 0) {
            logStock(i.id, Math.abs(diff), 'ADJ', 'Auditoría', i.cost || 0);
            i.stock = realQty;
            save(`Stock actualizado: ${realQty} ${i.unit}`);
            render('Stock');
        } else {
            toast("✅ El stock coincide", "info");
        }
    } else toast("Introduce un número válido", "error");
}

    let listItems = (db.ingredientes || []).filter(i => (i.stock || 0) < (i.min || 0));
    if (activeFamily !== 'Todos') listItems = listItems.filter(i => (i.fam || 'General') === activeFamily);

    const list = listItems.map(i => `- ${i.n}: Pedir ${(((i.min||0) - (i.stock||0)) + ((i.min||0) * 0.2)).toFixed(2)} ${i.unit}`).join('%0A');
    const title = activeFamily !== 'Todos' ? `PEDIDO ${activeFamily.toUpperCase()}` : 'PEDIDO GENERAL';
    window.open(`https://wa.me/?text=${encodeURIComponent(`🛒 *${title} ARUME*\n\n` + decodeURIComponent(list))}`, '_blank');

/* ================= DIARIO & CAJA ================= */
function renderDiario(app) {
    const r = db.diario.find(d => d.date === currentDiarioDate) || { cash:0, visa:0, tpv:0, amex:0, glovo:0, uber:0, apper:0, expenses:0, total:0 };
    const totalVenta = (r.cash||0) + (r.visa||0) + (r.tpv||0) + (r.amex||0) + (r.glovo||0) + (r.uber||0) + (r.apper||0);
    const realCash = (r.cash||0) - (r.expenses||0);
    const historyRows = (db.diario || []).filter(d => isInPeriod(d.date)).sort((a,b) => b.date.localeCompare(a.date)).map(d => `<div class="flex justify-between py-3 border-b"><div class="font-bold cursor-pointer" onclick="currentDiarioDate='${d.date}';render('Diario')">📅 ${d.date}</div><div class="font-mono font-bold text-indigo-600">${Num.fmt(d.total)}€</div></div>`).join('');

    app.innerHTML = `
    <div class="glass-card">
        <div class="flex justify-between items-center mb-6">
            <h3 class="font-bold text-slate-800">CIERRE DE CAJA</h3>
            <input type="date" value="${currentDiarioDate}" class="bg-slate-100 rounded-lg p-2 font-bold text-indigo-600" onchange="currentDiarioDate=this.value;render('Diario')">
        </div>
        <div class="space-y-4">
            <div class="bg-emerald-50 p-4 rounded-xl">
                <div class="text-[10px] font-bold text-emerald-600 mb-2 uppercase">💵 Efectivo</div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label>Venta Efectivo</label><input type="number" id="z-cash" value="${r.cash||0}" class="input-premium text-center" oninput="calcTotal()"></div>
                    <div><label>Gastos / Pagos</label><input type="number" id="z-expenses" value="${r.expenses||0}" class="input-premium text-center" oninput="calcTotal()"></div>
                </div>
                <div class="text-right mt-3 text-xs font-bold text-emerald-700">En Cajón: <span id="z-real-cash" class="text-lg ml-1">${Num.fmt(realCash)}</span>€</div>
            </div>

            <div class="bg-blue-50 p-4 rounded-xl">
                <div class="text-[10px] font-bold text-blue-600 mb-2 uppercase">💳 Tarjetas</div>
                <div class="grid grid-cols-3 gap-2">
                    <div><label>Visa</label><input type="number" id="z-visa" value="${r.visa||0}" class="input-premium text-center" oninput="calcTotal()"></div>
                    <div><label>TPV</label><input type="number" id="z-tpv" value="${r.tpv||0}" class="input-premium text-center" oninput="calcTotal()"></div>
                    <div><label>Amex</label><input type="number" id="z-amex" value="${r.amex||0}" class="input-premium text-center" oninput="calcTotal()"></div>
                </div>
            </div>

            <div class="bg-orange-50 p-4 rounded-xl">
                <div class="text-[10px] font-bold text-orange-600 mb-2 uppercase">🛵 Delivery</div>
                <div class="grid grid-cols-3 gap-2">
                    <div><label>Glovo</label><input type="number" id="z-glovo" value="${r.glovo||0}" class="input-premium text-center" oninput="calcTotal()"></div>
                    <div><label>Uber</label><input type="number" id="z-uber" value="${r.uber||0}" class="input-premium text-center" oninput="calcTotal()"></div>
                    <div><label>Apper</label><input type="number" id="z-apper" value="${r.apper||0}" class="input-premium text-center" oninput="calcTotal()"></div>
                </div>
            </div>

            <div class="flex justify-between items-center pt-4 border-t">
                <span class="font-bold text-slate-400 text-xs uppercase">Venta Total Día</span>
                <span id="z-total-display" class="text-4xl font-black text-slate-800">${Num.fmt(totalVenta)}€</span>
            </div>
        </div>
        <button class="btn-premium mt-6" onclick="saveZ()">💾 GUARDAR CIERRE</button>
    </div>

    <div class="glass-card mt-4">
        <h3 class="font-bold text-xs text-slate-400 mb-4 uppercase">Historial Trimestre ${fiscalQuarter}</h3>
        <div class="max-h-60 overflow-y-auto mb-4">${historyRows}</div>
        <button class="btn-ghost w-full" onclick="exportDiarioCSV()">📊 DESCARGAR EXCEL CAJAS</button>
    </div>`;
}

function calcTotal() {
    const v = id => Num.parse(document.getElementById(id).value);
    const cash = v('z-cash'), exp = v('z-expenses');
    const total = cash + v('z-visa') + v('z-tpv') + v('z-amex') + v('z-glovo') + v('z-uber') + v('z-apper');
    document.getElementById('z-total-display').innerText = Num.fmt(total) + '€';
    document.getElementById('z-real-cash').innerText = Num.fmt(cash - exp);
}

function saveZ() {
    const v = id => Num.parse(document.getElementById(id).value);
    const data = {
        date: currentDiarioDate,
        cash: v('z-cash'), expenses: v('z-expenses'),
        visa: v('z-visa'), tpv: v('z-tpv'), amex: v('z-amex'),
        glovo: v('z-glovo'), uber: v('z-uber'), apper: v('z-apper'),
        total: v('z-cash') + v('z-visa') + v('z-tpv') + v('z-amex') + v('z-glovo') + v('z-uber') + v('z-apper')
    };
    const idx = (db.diario || []).findIndex(d => d.date === currentDiarioDate);
    if (idx >= 0) db.diario[idx] = data; else (db.diario || (db.diario = [])).push(data);
    save("Cierre Guardado Correctamente");
    render('Diario');
}

function exportDiarioCSV() {
    if (!db.diario || !db.diario.length) return toast("No hay datos para exportar", "error");
    const header = ['Fecha', 'Efectivo', 'Gastos', 'Visa', 'TPV', 'Amex', 'Glovo', 'Uber', 'Apper', 'Total'];
    const rows = (db.diario || []).filter(d => isInPeriod(d.date)).sort((a,b) => b.date.localeCompare(a.date)).map(d => [d.date, Num.csv(d.cash), Num.csv(d.expenses), Num.csv(d.visa), Num.csv(d.tpv), Num.csv(d.amex), Num.csv(d.glovo), Num.csv(d.uber), Num.csv(d.apper), Num.csv(d.total)]);
    const csv = [header.join(';'), ...rows.map(r => r.join(';'))].join('\n');
    const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Cajas_${fiscalYear}_Q${fiscalQuarter}.csv`;
    a.click();
}

/* ================= INICIO ================= */
window.addEventListener('DOMContentLoaded', () => init());
</script>

</body>
</html>
