<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>ARUME V131 · IVA Fixed</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* ESTÉTICA V131 */
        body { font-family: 'Poppins', sans-serif; background: #f8fafc; padding-bottom: 100px; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        .glass-card { 
            background: white; 
            border: 1px solid #e2e8f0; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); 
            border-radius: 20px; 
            padding: 20px; 
            margin-bottom: 20px; 
        }
        
        .btn-premium { 
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); 
            color: white; padding: 14px; border-radius: 12px; 
            font-weight: 700; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3); 
            width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; cursor: pointer;
        }
        .btn-premium:active { transform: scale(0.98); }

        .btn-ghost { background: #f1f5f9; color: #475569; font-weight: 600; padding: 10px; border-radius: 12px; width: 100%; cursor: pointer; transition: 0.2s; }
        
        /* BOTONES ICONOS */
        .btn-icon { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: 0.2s; border: none; }
        .btn-edit { background: #eff6ff; color: #3b82f6; }
        .btn-delete { background: #fef2f2; color: #ef4444; }
        .btn-merma { background: #fff7ed; color: #f97316; }

        .btn-danger { background: #ef4444; color: white; padding: 10px; border-radius: 12px; font-weight:700; width:100%; border:none; cursor:pointer; }

        .input-premium { 
            width: 100%; padding: 12px; background: #f8fafc; 
            border: 2px solid #e2e8f0; border-radius: 12px; 
            outline: none; transition: 0.3s; font-size: 15px;
        }
        .input-premium:focus { border-color: #4f46e5; background: white; }

        /* TABLA DE ALBARÁN */
        .alb-row { display: flex; gap: 4px; align-items: center; background: white; padding: 6px; border: 1px solid #f1f5f9; border-radius: 10px; margin-bottom: 6px; }
        .alb-inp { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 4px; text-align: center; font-size: 12px; outline: none; }
        .alb-inp:focus { border-color: #6366f1; background: white; }

        /* LOADING & MODAL */
        #loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.95); z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top: 4px solid #4f46e5; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; }
        .modal { background: white; width: 95%; max-width: 800px; max-height: 90vh; overflow-y: auto; border-radius: 24px; padding: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        
        /* NAV */
        nav { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 12px 0; display: flex; justify-content: space-around; box-shadow: 0 -4px 20px rgba(0,0,0,0.05); z-index: 50; border-top: 1px solid #e2e8f0; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
        nav button { flex: 1; background: none; border: none; color: #94a3b8; display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; font-weight: 600; transition: 0.2s; cursor: pointer; }
        nav button.active { color: #4f46e5; transform: translateY(-2px); }
        nav button svg { width: 24px; height: 24px; fill: currentColor; margin-bottom: 4px; }

        /* PIN SCREEN */
        #pin-screen { background: #1e1b4b; position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .pin-btn { width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .pin-btn:active { background: rgba(255,255,255,0.3); transform: scale(0.95); }

        .hidden { display: none !important; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
        .aller-tag { display: inline-block; width: 24px; height: 24px; text-align: center; line-height: 24px; background: #e0e7ff; border-radius: 50%; font-size: 0.8rem; margin-right: 2px; }
    </style>
</head>
<body>

    <div id="loading-overlay" class="hidden">
        <div class="spinner mb-4"></div>
        <div class="font-bold text-gray-500 tracking-widest text-xs animate-pulse">CARGANDO...</div>
    </div>

    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[300] pointer-events-none"></div>
    <input type="file" id="backup-input" class="hidden" onchange="restoreBackup(this)">

    <header class="sticky top-0 z-40 px-6 py-4 flex justify-between items-center bg-white/90 backdrop-blur border-b border-gray-100">
        <div>
            <h1 class="text-2xl font-black text-gray-800 tracking-tight">ARUME <span class="text-indigo-600">V131</span></h1>
            <p class="text-[10px] text-gray-400 font-bold tracking-widest uppercase">IVA & Stock Fixed</p>
        </div>
        <div class="bg-gray-100 px-3 py-1 rounded-full text-xs font-bold text-gray-600 flex items-center gap-2 cursor-pointer hover:bg-gray-200 transition" onclick="logout()">
            <div id="sync-dot" class="w-2 h-2 rounded-full bg-gray-400"></div> <span id="user-name">Login</span>
        </div>
    </header>

    <main id="app" class="px-4 py-6 max-w-4xl mx-auto"></main>
    <nav id="navbar"></nav>

    <div id="modal-overlay" class="overlay hidden">
        <div class="modal" id="modal-root">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h3 id="m-title" class="text-lg font-black text-gray-800 uppercase tracking-wide"></h3>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full text-gray-500 hover:bg-gray-200 text-lg font-bold">✕</button>
            </div>
            <div id="m-body"></div>
        </div>
    </div>

    <div id="pin-screen" class="hidden">
        <div class="mb-10 text-center">
            <h2 class="text-5xl font-black tracking-tighter mb-2">ARUME</h2>
            <p class="text-indigo-200 text-xs tracking-widest uppercase">Acceso Seguro</p>
        </div>
        <div id="pin-display" class="text-4xl font-mono mb-10 tracking-[1em] h-10 text-center">****</div>
        <div class="grid grid-cols-3 gap-6 w-64">
            <button class="pin-btn" onclick="pin(1)">1</button><button class="pin-btn" onclick="pin(2)">2</button><button class="pin-btn" onclick="pin(3)">3</button>
            <button class="pin-btn" onclick="pin(4)">4</button><button class="pin-btn" onclick="pin(5)">5</button><button class="pin-btn" onclick="pin(6)">6</button>
            <button class="pin-btn" onclick="pin(7)">7</button><button class="pin-btn" onclick="pin(8)">8</button><button class="pin-btn" onclick="pin(9)">9</button>
            <button class="pin-btn bg-red-500/20 text-red-200 text-sm font-bold" onclick="pin('C')">C</button>
            <button class="pin-btn" onclick="pin(0)">0</button>
            <button class="pin-btn bg-green-500/20 text-green-200 text-sm font-bold" onclick="pin('OK')">OK</button>
        </div>
    </div>

<script>
/* ================= 1. CONFIGURACIÓN ================= */
const CONFIG = { 
    GOOGLE_URL: "https://script.google.com/macros/s/AKfycbxL0hWPiYmQ_590bkFjd1B9xwsfrYQXQtEuUpP2Nraq973bDr2rpEgVnaJCpI3-DH8z/exec", 
    COST_HOUR: 15,
    DEFAULT_IVA: 10 // IVA por defecto
};

const ALLERGENS = [
    {k:'glu', i:'🌾', n:'Gluten'}, {k:'cru', i:'🦐', n:'Crustáceos'}, {k:'hue', i:'🥚', n:'Huevos'},
    {k:'pes', i:'🐟', n:'Pescado'}, {k:'cac', i:'🥜', n:'Cacahuetes'}, {k:'soj', i:'🫘', n:'Soja'},
    {k:'lac', i:'🥛', n:'Lácteos'}, {k:'fru', i:'🌰', n:'Frutos Secos'}, {k:'api', i:'🥬', n:'Apio'},
    {k:'mos', i:'🌭', n:'Mostaza'}, {k:'ses', i:'🌱', n:'Sésamo'}, {k:'sul', i:'🍷', n:'Sulfitos'},
    {k:'alt', i:'🫘', n:'Altramuces'}, {k:'mol', i:'🐙', n:'Moluscos'}
];

const DB_INIT = {
    users: [{id:'u1', n:'Gerencia', pin:'0150', role:'admin'}],
    ingredientes: [], recetas: [], proveedores: [{n:'Makro'}],
    albaranes: [], facturas: [], diario: [], mermas: [], lastSync: 0
};

const secure = {
    // encode -> JSON -> URI encode -> base64
    enc: (d) => {
        try { return btoa(encodeURIComponent(JSON.stringify(d))); } catch(e) { console.error('secure.enc error', e); return null; }
    },
    // decode -> accept either plain JSON string or base64-encoded JSON
    dec: (d) => {
        try {
            if(!d) return null;
            if(typeof d !== 'string') return d;
            const s = d.trim();
            // If it looks like raw JSON, parse directly
            if(s[0] === '{' || s[0] === '[') return JSON.parse(s);
            // else assume base64-encoded
            const decoded = decodeURIComponent(atob(s));
            return JSON.parse(decoded);
        } catch(e) {
            console.error('secure.dec error', e);
            return null;
        }
    }
};

let db = DB_INIT;
let currentUser = null, currentPin = "", tempItems = [], activeAdminTab = 'albaranes', searchFilter = "";

/* ================= 2. CORE SYSTEM ================= */
const generateID = () => Math.random().toString(36).substr(2, 9);
const getISO = () => new Date().toLocaleDateString('en-CA');
function clean(str) { if(!str) return ''; return String(str).replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function loading(show) { const el = document.getElementById('loading-overlay'); if(!el) return; el.classList.toggle('hidden', !show); }

function toast(msg, type='info') {
    const box = document.getElementById('toast-container');
    if(!box) return;
    const bg = type==='error' ? 'bg-red-500' : 'bg-slate-800';
    const el = document.createElement('div');
    el.className = `${bg} text-white px-6 py-3 rounded-full shadow-xl font-bold text-sm mb-3 animate-bounce text-center backdrop-blur`;
    el.innerText = msg; box.appendChild(el); setTimeout(() => el.remove(), 3000);
}

function init() {
    try {
        const stored = localStorage.getItem('arume_v131') || localStorage.getItem('arume_v125') || localStorage.getItem('arume_v115');
        if(stored) {
            const dec = secure.dec(stored);
            if(dec) db = dec;
            else {
                // try JSON.parse fallback (in case previous versions used raw JSON)
                try { db = JSON.parse(stored); } catch(e) { console.warn("DB read failed, using default", e); db = DB_INIT; }
            }
        }
    } catch(e) { console.warn("DB reset", e); db = DB_INIT; }
    
    if(!db.users || !db.users.length) db.users = DB_INIT.users;

    const u = localStorage.getItem('arume_user');
    if(u) { try { currentUser=JSON.parse(u); document.getElementById('pin-screen').classList.add('hidden'); loadApp(); } catch(e){ console.warn('user parse', e);} }
    else { document.getElementById('pin-screen').classList.remove('hidden'); }
    if(CONFIG.GOOGLE_URL) sync();
}

async function save(msg){
    loading(true);
    try {
        db.lastSync = Date.now();
        const enc = secure.enc(db);
        if(enc) localStorage.setItem('arume_v131', enc);
        else localStorage.setItem('arume_v131', JSON.stringify(db));
        if(CONFIG.GOOGLE_URL) await fetch(CONFIG.GOOGLE_URL, {method:'POST', mode:'no-cors', body:JSON.stringify(db)}).catch(()=>{});
        if(msg) toast(msg);
    } catch(e) { console.error('save error', e); toast('Error guardando', 'error'); }
    loading(false);
}

async function sync(){
    if(!CONFIG.GOOGLE_URL) return;
    const dot = document.getElementById('sync-dot');
    if(dot) dot.className="w-2 h-2 rounded-full bg-yellow-400 animate-pulse";
    try {
        const r = await fetch(CONFIG.GOOGLE_URL);
        const c = await r.json();
        if(c && c.lastSync > (db.lastSync||0)) { db=c; const enc = secure.enc(db); if(enc) localStorage.setItem('arume_v131', enc); else localStorage.setItem('arume_v131', JSON.stringify(db)); location.reload(); }
        if(dot) dot.className="w-2 h-2 rounded-full bg-green-500 shadow-lg shadow-green-500/50";
    } catch(e){ if(dot) dot.className="w-2 h-2 rounded-full bg-red-500"; console.warn('sync failed', e); }
}

function pin(n){
    if(n==='C') currentPin=""; else if(n==='OK') {
        const u = db.users.find(x=>x.pin===currentPin);
        if(u){ currentUser=u; localStorage.setItem('arume_user', JSON.stringify(u)); document.getElementById('pin-screen').classList.add('hidden'); loadApp(); }
        else { toast("PIN Incorrecto", "error"); currentPin=""; document.getElementById('pin-display').innerText='****'; }
    } else if(currentPin.length<4) currentPin+=n;
    document.getElementById('pin-display').innerText = currentPin ? '*'.repeat(currentPin.length) : '****';
}
function logout(){ if(confirm("¿Cerrar sesión?")){ localStorage.removeItem('arume_user'); location.reload(); }}

/* ================= 4. UI RENDER ================= */
function loadApp() { document.getElementById('user-name').innerText = currentUser.n; renderNav(); render('Admin'); }

function renderNav() {
    const views = [
        {id:'Diario', l:'Caja', i:'<path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>'},
        {id:'Admin', l:'Gestión', i:'<path d="M12 2L3 5v6c0 5 3.8 9.7 9 11 5.2-1.3 9-6 9-11V5l-9-3z"/>'},
        {id:'Cocina', l:'Cocina', i:'<path d="M12 2C8.1 6 7 8 7 11c0 3.9 3.1 7 7 7s7-3.1 7-7c0-3-1.1-5-5-9z"/>'},
        {id:'Stock', l:'Stock', i:'<path d="M20 6h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 1-1-.45-1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 1-1-.45-1-1z"/>'}
    ];
    document.getElementById('navbar').innerHTML = views.map(v => `<button id="btn-${v.id}" onclick="render('${v.id}')"><svg viewBox="0 0 24 24">${v.i}</svg><span>${v.l}</span></button>`).join('');
}

function render(view) {
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    document.getElementById(`btn-${view}`)?.classList.add('active');
    const app = document.getElementById('app');
    if(view==='Diario') renderDiario(app);
    if(view==='Admin') renderAdmin(app);
    if(view==='Cocina') renderCocina(app);
    if(view==='Stock') renderStock(app);
}

/* ================= 5. GESTIÓN (PANEL) ================= */
function renderAdmin(app) {
    app.innerHTML = `
        <div class="flex gap-2 mb-6 bg-white p-1 rounded-2xl shadow-sm border border-gray-100">
            <button class="flex-1 py-2.5 rounded-xl font-bold text-xs transition ${activeAdminTab==='albaranes'?'bg-indigo-100 text-indigo-700 shadow-sm':''}" onclick="activeAdminTab='albaranes';renderAdmin(document.getElementById('app'))">ENTRADAS</button>
            <button class="flex-1 py-2.5 rounded-xl font-bold text-xs transition ${activeAdminTab==='facturas'?'bg-indigo-100 text-indigo-700 shadow-sm':''}" onclick="activeAdminTab='facturas';renderAdmin(document.getElementById('app'))">FACTURAS</button>
            <button class="flex-1 py-2.5 rounded-xl font-bold text-xs transition ${activeAdminTab==='omnes'?'bg-indigo-100 text-indigo-700 shadow-sm':''}" onclick="activeAdminTab='omnes';renderAdmin(document.getElementById('app'))">OMNES 4P</button>
        </div>
        <div id="adm-c"></div>
    `;
    const c = document.getElementById('adm-c');
    if(activeAdminTab==='omnes') renderOmnes(c);
    if(activeAdminTab==='albaranes') renderAlbaranes(c);
    if(activeAdminTab==='facturas') renderFacturas(c);
}

/* --- ALBARANES (IVA INTEGRADO V131) --- */
function renderAlbaranes(c) {
    c.innerHTML = `
        <div class="glass-card">
            <h3 class="font-bold text-gray-700 mb-4 text-sm uppercase flex justify-between items-center">
                <span>Nuevo Albarán</span>
                <span id="edit-mode-indicator" class="hidden text-[10px] bg-yellow-100 text-yellow-700 px-2 py-1 rounded">✏️ EDITANDO</span>
            </h3>
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div><label>Proveedor</label><input list="prov-list" id="alb-prov" class="input-premium" placeholder="..."><datalist id="prov-list">${db.proveedores.map(p=>`<option value="${clean(p.n)}">`).join('')}</datalist></div>
                <div><label>Fecha</label><input type="date" id="alb-date" value="${getISO()}" class="input-premium"></div>
            </div>
            <textarea id="alb-input" rows="4" class="input-premium font-mono text-xs" placeholder="Pegar: Producto, Cantidad, Precio, Dto%, IVA%"></textarea>
            <button class="btn-ghost mb-4" onclick="parseAlb()">🪄 Leer Texto (con IVA)</button>
            
            <div class="flex text-[10px] font-bold text-gray-400 px-2 mb-1">
                <span class="flex-1">PRODUCTO</span><span class="w-12 text-center">CANT</span><span class="w-12 text-center">PRE</span><span class="w-12 text-center">DTO</span><span class="w-12 text-center">IVA</span>
            </div>
            <div id="alb-grid" class="space-y-2 mb-4"></div>
            
            <div class="text-right font-black text-2xl mb-4 text-indigo-600" id="alb-total">0.00€</div>
            <button class="btn-premium" onclick="commitAlb()">CONFIRMAR ENTRADA</button>
        </div>
        
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
            <h4 class="font-bold text-xs text-gray-400 mb-4 uppercase tracking-wider">Historial</h4>
            ${db.albaranes.slice().reverse().map(a => `
                <div class="flex justify-between items-center py-3 border-b border-gray-50 last:border-0">
                    <div><div class="font-bold text-gray-800 text-sm">${clean(a.prov)}</div><div class="text-[10px] text-gray-400 font-bold">${a.date}</div></div>
                    <div class="flex items-center gap-2">
                        <span class="font-mono font-bold text-gray-700 mr-2">${(typeof a.total === 'number' ? a.total : parseFloat(a.total||0)).toFixed(2)}€</span>
                        <button class="btn-icon btn-edit" onclick="editAlb('${a.id}')">✏️</button>
                        <button class="btn-icon btn-delete" onclick="deleteAlb('${a.id}')">🗑️</button>
                        ${a.invoiced?'<span class="text-[10px] font-bold text-green-500">F</span>':''}
                    </div>
                </div>
            `).join('')}
        </div>`;
    renderAlbGrid();
}

function parseAlb() {
    const txt = document.getElementById('alb-input').value; tempItems = [];
    txt.split(/\r?\n/).forEach(l => { 
        if(!l.trim()) return;
        // Detectar comas o tabulaciones
        let parts = l.split(/,|\t/);
        if(parts.length < 2) parts = l.split(/\s{2,}/); // fallback espacios

        let n = parts[0]; 
        let q = 1, p = 0, d = 0, iva = CONFIG.DEFAULT_IVA;

        if(parts.length >= 2) q = parseFloat(parts[1]) || 1;
        if(parts.length >= 3) p = parseFloat(parts[2]) || 0;
        if(parts.length >= 4) d = parseFloat(parts[3].replace('%','')) || 0;
        if(parts.length >= 5) iva = parseFloat(parts[4].replace('%','')) || CONFIG.DEFAULT_IVA;

        if(p > 0) tempItems.push({n:n.trim(), q, p, d, iva}); 
    });
    renderAlbGrid();
}

function renderAlbGrid() {
    const div = document.getElementById('alb-grid');
    if(!div) return;
    let total = 0;
    
    div.innerHTML = tempItems.map((it,i) => {
        // Cálculo con IVA: (P * Q - Dto) + IVA
        const base = (it.p * it.q);
        const dto = base * (it.d/100);
        const net = base - dto;
        const tax = net * (it.iva/100);
        const lineTotal = net + tax;
        total += lineTotal;

        return `<div class="alb-row">
            <input value="${clean(it.n)}" class="alb-inp flex-1 text-left font-bold" onchange="tempItems[${i}].n=this.value">
            <input type="number" value="${it.q}" class="alb-inp w-12" onchange="tempItems[${i}].q=parseFloat(this.value)||0;renderAlbGrid()">
            <input type="number" value="${it.p}" class="alb-inp w-12" onchange="tempItems[${i}].p=parseFloat(this.value)||0;renderAlbGrid()">
            <input type="number" value="${it.d}" class="alb-inp w-12 text-blue-500" onchange="tempItems[${i}].d=parseFloat(this.value)||0;renderAlbGrid()">
            <input type="number" value="${it.iva}" class="alb-inp w-12 text-orange-500 font-bold" onchange="tempItems[${i}].iva=parseFloat(this.value)||0;renderAlbGrid()">
            <button class="text-red-400 px-1 font-bold" onclick="tempItems.splice(${i},1);renderAlbGrid()">✕</button>
        </div>`;
    }).join('');
    
    document.getElementById('alb-total').innerText = total.toFixed(2)+'€';
}

function commitAlb() {
    if(!tempItems.length) return toast("Lista vacía", "error");
    const prov = document.getElementById('alb-prov').value;
    const date = document.getElementById('alb-date').value;
    if(!prov) return toast("Falta Proveedor", "error");
    if(!db.proveedores.find(p=>p.n===prov)) db.proveedores.push({n:prov});

    // Calcular total numérico desde tempItems (más robusto que leer del DOM)
    let totalNumber = 0;
    tempItems.forEach(it => {
        const base = (it.p * it.q);
        const dto = base * (it.d/100);
        const net = base - dto;
        const tax = net * (it.iva/100);
        const lineTotal = net + tax;
        totalNumber += lineTotal;
    });

    // Actualizar Stock (Costo medio SIN IVA, para escandallos limpios)
    tempItems.forEach(it => {
        let i = db.ingredientes.find(x => x.n.toLowerCase() === it.n.toLowerCase());
        const costNeto = it.p * (1 - it.d/100); // Coste real unitario sin IVA
        if(i) { 
            const prevStock = i.stock || 0;
            i.cost = ((prevStock * (i.cost || 0)) + (it.q * costNeto)) / (prevStock + it.q || 1);
            i.stock = prevStock + it.q;
        }
        else { db.ingredientes.push({id:generateID(), n:it.n, stock:it.q, cost:costNeto, min:0, unit:'ud', aller:[]}); }
    });

    db.albaranes.push({
        id:generateID(), date, prov, 
        items: JSON.parse(JSON.stringify(tempItems)), 
        total: parseFloat(totalNumber), 
        invoiced:false
    });
    save("Entrada guardada"); tempItems=[]; renderAdmin(document.getElementById('app'));
}

function deleteAlb(id) {
    const alb = db.albaranes.find(a => a.id === id);
    if(!alb) return;
    if(confirm("¿Borrar y RESTAR stock?")) {
        alb.items.forEach(it => {
            const i = db.ingredientes.find(x => x.n.toLowerCase() === it.n.toLowerCase());
            if(i) i.stock = Math.max(0, (i.stock || 0) - it.q);

function calcRecipe(r) {
    let t=0, all=new Set();
    (r.items||[]).forEach(it => { 
        if(it.type==='ing') { 
            const i = db.ingredientes.find(x=>x.id===it.id);
            if(i) { 
                const yieldFactor = (it.merma && it.merma > 0 && it.merma < 100) ? (1 - (it.merma/100)) : 1;
                t += (it.q * (i.cost || 0)) / (yieldFactor || 1);
                (i.aller||[]).forEach(k=>all.add(k)); 
            } 
        } 
    });
    t += (r.time/60)*CONFIG.COST_HOUR; return {t, all:Array.from(all)};
}

/* ================= 9. MODAL & UTILS ================= */
function showModal(t,c){ document.getElementById('m-title').innerText=t; document.getElementById('m-body').innerHTML=c; document.getElementById('modal-overlay').classList.remove('hidden'); }
function closeModal(){ document.getElementById('modal-overlay').classList.add('hidden'); }
function downloadBackup(){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], {type:'application/json'})); a.download = `Arume_${getISO()}.json`; a.click(); }
function restoreBackup(input){
    if(!input.files || !input.files[0]) return;
    const r = new FileReader();
    r.onload = e => {
        const text = e.target.result;
        // intentar parsear JSON plano primero
        try {
            const parsed = JSON.parse(text);
            if(parsed) { db = parsed; save("Restaurado"); location.reload(); return; }
        } catch(err){ /* no es JSON plano */ }
        // intentar decodificar con secure.dec (base64)
        const dec = secure.dec(text);
        if(dec) { db = dec; save("Restaurado"); location.reload(); return; }
        toast('Formato de backup no reconocido', 'error');
    };
    r.readAsText(input.files[0]);
}

/* cerrar modal al clicar fuera */
document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if(e.target === document.getElementById('modal-overlay')) closeModal();
});

init();
</script>
</body>
