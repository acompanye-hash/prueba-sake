<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>ARUME V125 · Platinum — Reescrito</title>

    <!-- Dependencias CDN -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* ESTÉTICA V125 (limpia y consistente) */
        :root { --indigo-600:#4f46e5; --muted:#94a3b8; --card:#f8fafc; }
        body { font-family: 'Poppins', sans-serif; background: #f8fafc; padding-bottom: 120px; -webkit-tap-highlight-color: transparent; user-select: none; color:#0f172a; }
        .glass-card { background: white; border: 1px solid #e6eef8; box-shadow: 0 6px 18px rgba(15,23,42,0.04); border-radius: 16px; padding: 18px; margin-bottom: 18px; }
        .btn-premium { background: linear-gradient(135deg, var(--indigo-600) 0%, #7c3aed 100%); color: white; padding: 12px 14px; border-radius: 12px; font-weight:700; display:inline-flex; gap:8px; align-items:center; justify-content:center; cursor:pointer; border:none; }
        .btn-ghost { background:#f1f5f9; color:#475569; padding:8px 10px; border-radius:10px; font-weight:600; cursor:pointer; border:none; }
        .input-premium { width:100%; padding:10px 12px; border-radius:10px; border:1px solid #e6eef8; background:#fff; outline:none; font-size:14px; }
        .small { font-size:12px; color:#6b7280; }
        .muted { color:#9ca3af; font-size:12px; }
        nav { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 10px 0; display:flex; justify-content:space-around; box-shadow: 0 -6px 24px rgba(2,6,23,0.06); z-index:60; border-top:1px solid #eef2f7; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
        nav button { flex:1; background:none; border:none; color:var(--muted); display:flex; flex-direction:column; align-items:center; font-size:0.72rem; font-weight:700; gap:4px; padding:4px 6px; cursor:pointer; }
        nav button.active { color: var(--indigo-600); transform: translateY(-2px); }
        .overlay { position: fixed; inset:0; background: rgba(15,23,42,0.75); backdrop-filter: blur(4px); z-index:200; display:flex; align-items:center; justify-content:center; }
        .modal { background:white; width:95%; max-width:880px; max-height:90vh; overflow:auto; border-radius:18px; padding:18px; box-shadow: 0 30px 60px rgba(2,6,23,0.35); }
        #loading-overlay { position: fixed; inset:0; background: rgba(255,255,255,0.94); z-index:9999; display:flex; align-items:center; justify-content:center; flex-direction:column; }
        .spinner { width:44px; height:44px; border:5px solid #eef2ff; border-top:5px solid var(--indigo-600); border-radius:50%; animation:spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #pin-screen { background: linear-gradient(180deg,#1e1b4b,#121026); position:fixed; inset:0; z-index:300; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; }
        .pin-btn { width:72px; height:72px; border-radius:50%; background: rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center; font-size:1.25rem; font-weight:700; cursor:pointer; border:none; color:white; }
        .hidden { display:none !important; }
        .list-item { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #f1f5f9; }
        .aler-tag { display:inline-block; width:24px; height:24px; text-align:center; line-height:24px; background:#e0e7ff; border-radius:50%; font-size:0.8rem; margin-right:4px; }
        .alb-table { width:100%; border-collapse:collapse; font-size:13px; }
        .alb-table th, .alb-table td { padding:8px 6px; border-bottom:1px solid #f1f5f9; }
        .muted-box { background:#f8fafc; padding:10px; border-radius:10px; border:1px dashed #e6eef8; }
        /* responsive tweaks */
        @media(min-width:900px){ main#app{ max-width:960px; } }
    </style>
</head>
<body>

    <!-- Loading overlay -->
    <div id="loading-overlay" class="hidden">
        <div class="spinner mb-4"></div>
        <div class="font-bold text-gray-500 tracking-widest text-xs animate-pulse">CARGANDO...</div>
    </div>

    <!-- Toasts -->
    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[300] pointer-events-none"></div>
    <input type="file" id="backup-input" class="hidden" onchange="restoreBackup(this)">

    <!-- Header -->
    <header class="sticky top-0 z-40 px-6 py-4 flex justify-between items-center bg-white/90 backdrop-blur border-b border-gray-100">
        <div>
            <h1 class="text-2xl font-black text-gray-800 tracking-tight">ARUME <span style="color:var(--indigo-600)">V125</span></h1>
            <p class="text-[10px] text-gray-400 font-bold tracking-widest uppercase">Platinum Edition — Reescritura optimizada</p>
        </div>
        <div class="bg-gray-100 px-3 py-1 rounded-full text-xs font-bold text-gray-600 flex items-center gap-2 cursor-pointer hover:bg-gray-200 transition" onclick="logout()">
            <div id="sync-dot" class="w-2 h-2 rounded-full bg-gray-400"></div> <span id="user-name">Login</span>
        </div>
    </header>

    <main id="app" class="px-4 py-6 max-w-4xl mx-auto"></main>
    <nav id="navbar" aria-label="Navegación principal"></nav>

    <!-- Modal -->
    <div id="modal-overlay" class="overlay hidden">
        <div class="modal" role="dialog" aria-modal="true">
            <div class="flex justify-between items-center mb-4">
                <h3 id="m-title" class="text-lg font-black text-gray-800 uppercase tracking-wide"></h3>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full text-gray-500 hover:bg-gray-200 text-lg font-bold">✕</button>
            </div>
            <div id="m-body"></div>
        </div>
    </div>

    <!-- PIN SCREEN -->
    <div id="pin-screen" class="hidden">
        <div class="mb-8 text-center">
            <h2 class="text-5xl font-black tracking-tighter mb-2">ARUME</h2>
            <p class="text-indigo-200 text-xs tracking-widest uppercase">Acceso Seguro</p>
        </div>
        <div id="pin-display" class="text-4xl font-mono mb-8 tracking-[1em] h-10 text-center">****</div>
        <div class="grid grid-cols-3 gap-6 w-64">
            <button class="pin-btn" onclick="pin(1)">1</button><button class="pin-btn" onclick="pin(2)">2</button><button class="pin-btn" onclick="pin(3)">3</button>
            <button class="pin-btn" onclick="pin(4)">4</button><button class="pin-btn" onclick="pin(5)">5</button><button class="pin-btn" onclick="pin(6)">6</button>
            <button class="pin-btn" onclick="pin(7)">7</button><button class="pin-btn" onclick="pin(8)">8</button><button class="pin-btn" onclick="pin(9)">9</button>
            <button class="pin-btn bg-red-500/20 text-red-200 text-sm font-bold" onclick="pin('C')">C</button>
            <button class="pin-btn" onclick="pin(0)">0</button>
            <button class="pin-btn bg-green-500/20 text-green-200 text-sm font-bold" onclick="pin('OK')">OK</button>
        </div>
    </div>

<script>
/* =========================
   ARUME — Reescritura optimizada
   - Código más modular
   - TPV mínimo integrado (tickets)
   - Mejor manejo de db y sincronización
   - UI consistente y funciones centralizadas
   ========================= */

/* ================= 1. CONFIG & CONSTANTES ================= */
const CONFIG = {
    GOOGLE_URL: "https://script.google.com/macros/s/AKfycbxL0hWPiYmQ_590bkFjd1B9xwsfrYQXQtEuUpP2Nraq973bDr2rpEgVnaJCpI3-DH8z/exec",
    COST_HOUR: 15, // coste hora para recetas
    SAVE_DEBOUNCE_MS: 300
};

const ALLERGENS = [
    {k:'glu', i:'🌾'}, {k:'cru', i:'🦐'}, {k:'hue', i:'🥚'}, {k:'pes', i:'🐟'},
    {k:'cac', i:'🥜'}, {k:'soj', i:'🫘'}, {k:'lac', i:'🥛'}, {k:'fru', i:'🌰'},
    {k:'api', i:'🥬'}, {k:'mos', i:'🌭'}, {k:'ses', i:'🌱'}, {k:'sul', i:'🍷'},
    {k:'alt', i:'🫘'}, {k:'mol', i:'🐙'}
];

const DB_INIT = {
    users: [{id:'u1', n:'Gerencia', pin:'0150', role:'admin'}],
    ingredientes: [], recetas: [], proveedores: [{n:'Makro'}],
    albaranes: [], facturas: [], diario: [], mermas: [], tickets: [], lastSync: 0
};

/* ================= 2. UTILIDADES ================= */
const secure = {
    enc: (d) => {
        try { return btoa(encodeURIComponent(JSON.stringify(d))); }
        catch(e){ console.warn('secure.enc failed', e); return ''; }
    },
    dec: (s) => {
        try {
            if(!s) return null;
            // handle when passing object already
            if(typeof s === 'object') return s;
            return JSON.parse(decodeURIComponent(atob(s)));
        } catch(e) {
            // try plain JSON
            try { return JSON.parse(s); } catch(e2) { console.warn('secure.dec failed', e2); return null; }
        }
    }
};

let db = JSON.parse(JSON.stringify(DB_INIT)); // runtime DB copy
let currentUser = null;
let currentPin = "";
let tempItems = [];
let activeAdminTab = 'albaranes';
let searchFilter = "";

let saveTimeout = null;

/* Generadores / Formatos */
const generateID = (pref='id') => `${pref}_${Math.random().toString(36).slice(2,10)}`;
const getISO = () => new Date().toLocaleDateString('en-CA');
const nowISO = () => new Date().toISOString();
const clean = (s) => { if(!s && s!==0) return ''; return String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
const fmt = (n) => `${Number(n||0).toFixed(2)}€`;

/* ================= 3. STORAGE, SYNC, SAVE ================= */
function loading(show){ document.getElementById('loading-overlay').classList.toggle('hidden', !show); }

function toast(msg, type='info') {
    const container = document.getElementById('toast-container');
    const el = document.createElement('div');
    const bg = type==='error' ? 'bg-red-500' : 'bg-slate-800';
    el.className = `${bg} text-white px-5 py-2 rounded-full shadow-xl font-bold text-sm mb-3 animate-fade pointer-events-auto`;
    el.innerText = msg;
    container.appendChild(el);
    setTimeout(()=> el.remove(), 3500);
}

/* Guardado con debounce para evitar llamadas repetidas */
async function save(msg) {
    loading(true);
    db.lastSync = Date.now();
    try {
        localStorage.setItem('arume_v125', secure.enc(db));
    } catch(e){ console.warn('localStorage fail', e); }
    // attempt push to google (fire and forget)
    if(CONFIG.GOOGLE_URL) {
        try {
            await fetch(CONFIG.GOOGLE_URL, { method:'POST', mode:'no-cors', body: JSON.stringify(db) });
        } catch(e){ /* ignore network errors silently */ }
    }
    loading(false);
    if(msg) toast(msg, 'info');
}

/* Sincronización básica: descarga y comprueba lastSync */
async function sync(){
    if(!CONFIG.GOOGLE_URL) return;
    const dot = document.getElementById('sync-dot');
    if(dot) dot.className = "w-2 h-2 rounded-full bg-yellow-400 animate-pulse";
    try{
        const r = await fetch(CONFIG.GOOGLE_URL);
        const c = await r.json();
        if(c && c.lastSync > (db.lastSync || 0)) {
            db = c;
            localStorage.setItem('arume_v125', secure.enc(db));
            location.reload();
        }
        if(dot) dot.className = "w-2 h-2 rounded-full bg-green-500 shadow-lg";
    }catch(e){
        if(dot) dot.className = "w-2 h-2 rounded-full bg-red-500";
    }
}

/* ================= 4. INICIALIZACIÓN Y LOGIN ================= */
function init() {
    try {
        const stored = localStorage.getItem('arume_v125') || localStorage.getItem('arume_v121') || localStorage.getItem('arume_v115');
        if(stored) {
            const parsed = secure.dec(stored);
            if(parsed && typeof parsed === 'object') db = Object.assign(JSON.parse(JSON.stringify(DB_INIT)), parsed);
        }
    } catch(e) {
        console.warn("DB reset", e);
        db = JSON.parse(JSON.stringify(DB_INIT));
    }

    // ensure arrays exist
    db.users = db.users && db.users.length ? db.users : DB_INIT.users.slice();
    ['ingredientes','recetas','proveedores','albaranes','facturas','diario','mermas','tickets'].forEach(k=>{
        if(!Array.isArray(db[k])) db[k] = JSON.parse(JSON.stringify(DB_INIT[k]));
    });

    // current user check
    const u = localStorage.getItem('arume_user');
    if(u) { try { currentUser = JSON.parse(u); document.getElementById('pin-screen').classList.add('hidden'); loadApp(); } catch(e){ document.getElementById('pin-screen').classList.remove('hidden'); } }
    else { document.getElementById('pin-screen').classList.remove('hidden'); }

    if(CONFIG.GOOGLE_URL) setTimeout(sync, 1200);
}

/* ================= 5. AUTH & PIN ================= */
function pin(n) {
    if(n === 'C') { currentPin = ""; updatePinDisplay(); return; }
    if(n === 'OK') {
        const u = db.users.find(x => x.pin === currentPin);
        if(u) {
            currentUser = u;
            localStorage.setItem('arume_user', JSON.stringify(u));
            document.getElementById('pin-screen').classList.add('hidden');
            loadApp();
        } else {
            toast("PIN incorrecto", "error");
            currentPin = "";
            updatePinDisplay();
        }
        return;
    }
    if(String(currentPin).length < 6) currentPin += String(n);
    updatePinDisplay();
}
function updatePinDisplay() {
    const disp = document.getElementById('pin-display');
    disp.innerText = currentPin ? '*'.repeat(currentPin.length) : '****';
}
function logout(){
    if(confirm("¿Cerrar sesión?")) {
        localStorage.removeItem('arume_user');
        location.reload();
    }
}

/* ================= 6. NAV + RENDER SWITCH ================= */
function loadApp(){
    document.getElementById('user-name').innerText = currentUser?.n || 'Usuario';
    renderNav();
    render('Admin');
}

function renderNav(){
    const views = [
        {id:'Diario', label:'Caja', icon:'<path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>'},
        {id:'Admin', label:'Gestión', icon:'<path d="M12 2L3 5v6c0 5 3.8 9.7 9 11 5.2-1.3 9-6 9-11V5l-9-3z"/>'},
        {id:'Cocina', label:'Cocina', icon:'<path d="M12 2C8.1 6 7 8 7 11c0 3.9 3.1 7 7 7s7-3.1 7-7c0-3-1.1-5-5-9z"/>'},
        {id:'Stock', label:'Stock', icon:'<path d="M12 2L2 7l10 5 10-5-10-5zm0 13.5l-10-5v6c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-6l-10 5z"/>'}
    ];
    const nav = document.getElementById('navbar');
    nav.innerHTML = views.map(v => `<button id="btn-${v.id}" onclick="render('${v.id}')" aria-label="${v.label}"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">${v.icon}</svg><span>${v.label}</span></button>`).join('');
}

function render(view){
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    document.getElementById(`btn-${view}`)?.classList.add('active');
    const app = document.getElementById('app');
    try {
        if(view === 'Diario') renderDiario(app);
        else if(view === 'Admin') renderAdmin(app);
        else if(view === 'Cocina') renderCocina(app);
        else if(view === 'Stock') renderStock(app);
    } catch(e) {
        console.error('render error', e);
        app.innerHTML = `<div class="glass-card">Error renderizando vista: ${clean(e.message)}</div>`;
    }
}

/* ================= 7. ADMIN (Albaranes / Facturas / Omnes) ================= */
function renderAdmin(app){
    app.innerHTML = `
        <div class="glass-card">
            <div class="flex gap-2 mb-4">
                <button class="flex-1 py-2 rounded-xl font-bold text-xs ${activeAdminTab==='albaranes' ? 'bg-indigo-100 text-indigo-700':''}" onclick="activeAdminTab='albaranes'; renderAdmin(document.getElementById('app'))">Albaranes</button>
                <button class="flex-1 py-2 rounded-xl font-bold text-xs ${activeAdminTab==='facturas' ? 'bg-indigo-100 text-indigo-700':''}" onclick="activeAdminTab='facturas'; renderAdmin(document.getElementById('app'))">Facturas</button>
                <button class="flex-1 py-2 rounded-xl font-bold text-xs ${activeAdminTab==='omnes' ? 'bg-indigo-100 text-indigo-700':''}" onclick="activeAdminTab='omnes'; renderAdmin(document.getElementById('app'))">Omnes</button>
            </div>
            <div id="adm-c"></div>
        </div>
    `;
    const c = document.getElementById('adm-c');
    if(activeAdminTab === 'albaranes') renderAlbaranes(c);
    if(activeAdminTab === 'facturas') renderFacturas(c);
    if(activeAdminTab === 'omnes') renderOmnes(c);
}

/* ---------- ALBARANES (mejorado) ---------- */
function renderAlbaranes(c){
    const provOptions = db.proveedores.map(p=>`<option value="${clean(p.n)}">`).join('');
    const nextNum = `A-${new Date().getFullYear().toString().slice(-2)}-${(db.albaranes.length+1).toString().padStart(4,'0')}`;

    c.innerHTML = `
        <div class="glass-card">
            <h3 class="font-bold text-gray-700 mb-3 text-sm uppercase">Nuevo Albarán</h3>
            <div class="grid grid-cols-3 gap-3 mb-3">
                <div><label class="small">Proveedor</label><input list="prov-list" id="alb-prov" class="input-premium" placeholder="..."><datalist id="prov-list">${provOptions}</datalist></div>
                <div><label class="small">Productor</label><input id="alb-producer" class="input-premium" placeholder="Productor..."></div>
                <div><label class="small">Nº Albarán</label><input id="alb-num" class="input-premium" value="${nextNum}"></div>
            </div>
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div><label class="small">Fecha</label><input type="date" id="alb-date" class="input-premium" value="${getISO()}"></div>
                <div><label class="small">Nota</label><input id="alb-note" class="input-premium" placeholder="Opcional..."></div>
            </div>
            <textarea id="alb-input" rows="4" class="input-premium font-mono text-xs" placeholder="Pegar: Producto, Cantidad[unidad], Precio [, Descuento]. Ej: Harina, 10 kg, 0.50, 0%"></textarea>
            <div class="flex gap-2 mt-2 mb-3">
                <button class="btn-ghost" onclick="parseAlb()">🪄 Leer Texto</button>
                <button class="btn-ghost" onclick="tempItems=[]; renderAlbGrid()">Limpiar</button>
                <button class="btn-ghost" onclick="showAlbImportHelp()">?</button>
            </div>
            <div id="alb-grid" class="space-y-2 mb-3"></div>
            <div class="flex justify-between items-center mb-3">
                <div class="muted">Subtotal: <span id="alb-subtotal">0.00€</span></div>
                <div class="font-black text-2xl text-indigo-600" id="alb-total">0.00€</div>
            </div>
            <div class="grid grid-cols-3 gap-3">
                <button class="btn-premium" onclick="commitAlb()">CONFIRMAR ENTRADA</button>
                <button class="btn-ghost" onclick="save('Borrador guardado')">GUARDAR Borrador</button>
                <button class="btn-ghost" onclick="exportAlbCSV()">EXPORTAR CSV</button>
            </div>
        </div>

        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 mt-4">
            <h4 class="font-bold text-xs text-gray-400 mb-3 uppercase tracking-wider">Historial</h4>
            ${db.albaranes.slice().reverse().map(a => `
                <div class="flex justify-between items-center py-3 border-b border-gray-50 last:border-0">
                    <div>
                        <div class="font-bold text-gray-800 text-sm">${clean(a.prov || a.productor)}</div>
                        <div class="text-[10px] text-gray-400 font-bold">#${clean(a.num||'')} · ${clean(a.date)}</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button class="small muted" onclick="viewAlbDetails('${a.id}')">VER</button>
                        <span class="font-mono font-bold text-gray-700 mr-2">${a.total ? a.total.toFixed(2) + '€' : '0.00€'}</span>
                        ${!a.invoiced ? `<button class="btn-ghost small" onclick="editAlb('${a.id}')">Editar</button><button class="btn-ghost small" onclick="deleteAlb('${a.id}')">Borrar</button>` : `<span class="text-[10px] bg-green-100 text-green-700 px-2 py-1 rounded font-bold">F</span>`}
                    </div>
                </div>`).join('')}
        </div>
    `;
    renderAlbGrid();
}

function showAlbImportHelp(){
    showModal('Ayuda: Formato de importación', `<div class="text-sm space-y-2">
        <p>Formato recomendado por línea (se aceptan comas o tabulaciones):</p>
        <ul class="list-disc pl-5">
            <li><b>Producto, Cantidad unidad, Precio, Descuento(optional)</b></li>
            <li>Ejemplos: <code>Harina, 10 kg, 0.50, 0%</code> o <code>Huevos 30 ud 0.10</code></li>
            <li>Descuento puede ser absoluto (ej. 1.50) o porcentual (ej. 5%)</li>
        </ul>
        <div class="mt-4"><button class="btn-ghost" onclick="closeModal()">Cerrar</button></div>
    </div>`);
}

/* Parsing flexible pero robusto */
function parseAlb(){
    const txt = document.getElementById('alb-input').value.trim();
    tempItems = [];
    if(!txt) return toast("No hay texto para leer", "error");
    const lines = txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    for(const l of lines){
        let parts = l.split(',').map(p=>p.trim()).filter(Boolean);
        if(parts.length === 1) parts = l.split(/\t/).map(p=>p.trim()).filter(Boolean);

        let name = '', qty = 1, price = 0, unit = 'ud', discount = 0, dType='abs';

        if(parts.length >= 2){
            name = parts[0];
            // qty + unit parsing
            const q = parts[1].match(/([\d\.,\/]+)\s*(kg|gr|g|l|lt|ml|ud|u|pcs|unidad|un)?/i);
            if(q){
                qty = parseFloat(String(q[1]).replace(',','.')) || 1;
                if(q[2]) unit = normalizeUnit(q[2]);
            } else {
                const maybeNum = parseFloat(parts[1].replace(',','.'));
                if(!isNaN(maybeNum)) qty = maybeNum;
            }
            // price
            if(parts.length >= 3) price = parseFloat(String(parts[2]).replace(',','.')) || 0;
            else {
                const f = parts.slice(1).join(' ').match(/([\d\.,]+)\s*€?/);
                if(f) price = parseFloat(f[1].replace(',','.')) || 0;
            }
            // discount
            if(parts.length >= 4){
                const d = parts[3];
                if(String(d).includes('%')) { dType='pct'; discount = parseFloat(String(d).replace('%','').replace(',','.'))||0; }
                else discount = parseFloat(String(d).replace(',','.'))||0;
            }
        } else {
            // fallback: extract numbers
            const nums = l.match(/[\d\.,]+/g) || [];
            name = l.replace(/[\d\.,]+/g,'').replace(/\b(kg|gr|g|l|lt|ml|ud|u|pcs|unidad|un)\b/gi,'').trim();
            if(nums.length === 1) price = parseFloat(nums[0].replace(',','.')) || 0;
            if(nums.length >= 2) { qty = parseFloat(nums[0].replace(',','.'))||1; price = parseFloat(nums[1].replace(',','.'))||0; }
            const um = l.match(/\b(kg|g|gr|l|lt|ml|ud|u|pcs|unidad|un)\b/i);
            if(um) unit = normalizeUnit(um[1]);
        }

        if(price > 0 && name) {
            tempItems.push({ n: name.trim(), q: qty, p: price, unit, d: discount, dType });
        }
    }
    renderAlbGrid();
}

function normalizeUnit(u){
    if(!u) return 'ud';
    u = String(u).toLowerCase();
    if(u.startsWith('kg')) return 'kg';
    if(u==='g' || u==='gr' || u==='grs') return 'g';
    if(u.startsWith('l') || u==='lt') return 'l';
    if(u==='ml') return 'ml';
    if(['ud','u','unidad','un','pcs'].includes(u)) return 'ud';
    return u;
}

function calcLineSubtotal(it){
    const q = parseFloat(it.q)||0;
    const p = parseFloat(it.p)||0;
    let line = q * p;
    if(it.d){
        if(it.dType === 'pct') line -= line * (parseFloat(it.d)||0) / 100;
        else line -= parseFloat(it.d)||0;
    }
    return line;
}

function parseDiscount(index, value){
    const v = String(value).trim();
    if(v.includes('%')) { tempItems[index].dType='pct'; tempItems[index].d=parseFloat(v.replace('%','').replace(',','.'))||0; }
    else { tempItems[index].dType='abs'; tempItems[index].d=parseFloat(v.replace(',','.'))||0; }
    renderAlbGrid();
}

function commitAlb(){
    if(!tempItems.length) return toast("Lista vacía", "error");
    const prov = document.getElementById('alb-prov').value.trim();
    const producer = document.getElementById('alb-producer').value.trim();
    const num = document.getElementById('alb-num').value.trim() || generateID('alb');
    const date = document.getElementById('alb-date').value || getISO();
    const note = document.getElementById('alb-note').value || '';

    if(!prov && !producer) return toast("Falta Proveedor o Productor", "error");
    if(!date) return toast("Falta Fecha", "error");

    if(prov && !db.proveedores.find(p=>p.n === prov)) db.proveedores.push({n:prov});

    // Update stock: best-effort matching by name + unit
    tempItems.forEach(it => {
        const nameLower = it.n.trim().toLowerCase();
        let existing = db.ingredientes.find(x => x.n.toLowerCase() === nameLower && x.unit === it.unit);
        if(existing) {
            const prevStock = parseFloat(existing.stock)||0;
            const prevCost = parseFloat(existing.cost)||0;
            const addQty = parseFloat(it.q)||0;
            const addCost = parseFloat(it.p)||0;
            existing.cost = (prevStock + addQty) > 0 ? (((prevStock * prevCost) + (addQty * addCost)) / (prevStock + addQty)) : addCost;
            existing.stock = prevStock + addQty;
        } else {
            const other = db.ingredientes.find(x => x.n.toLowerCase() === nameLower);
            if(other && other.unit !== it.unit) {
                const newName = `${it.n} (${it.unit})`;
                db.ingredientes.push({ id: generateID('ing'), n: newName, stock: it.q, cost: it.p, min:0, unit:it.unit, aller:[] });
            } else {
                db.ingredientes.push({ id: generateID('ing'), n: it.n, stock: it.q, cost: it.p, min:0, unit:it.unit, aller:[] });
            }
        }
    });

    const subtotal = tempItems.reduce((a,b)=>a+calcLineSubtotal(b),0);
    db.albaranes.push({
        id: generateID('alb'),
        num,
        prov: prov || '',
        productor: producer || '',
        date,
        note,
        items: JSON.parse(JSON.stringify(tempItems)),
        subtotal,
        total: subtotal,
        invoiced:false
    });

    tempItems = [];
    save("Entrada guardada");
    renderAdmin(document.getElementById('app'));
}

/* Calcula coste total de receta (ingredientes + mano de obra) */
function calcRecipe(r) {
    let t = 0;
    const all = new Set();
    (r.items || []).forEach(it => {
        if(it.type === 'ing') {
            const ing = db.ingredientes.find(x => x.id === it.id);
            // amount required per portion (it.q)
            const qty = parseFloat(it.q) || 0;
            // account for merma (rendimiento)
            const yieldFactor = (it.merma && it.merma > 0) ? (1 - (it.merma/100)) : 1;
            const needed = yieldFactor > 0 ? qty / yieldFactor : qty;
            const costPerUnit = ing ? (parseFloat(ing.cost) || 0) : (parseFloat(it.cost) || 0);
            t += needed * costPerUnit;
            all.add(it.id || it.n);
        } else if(it.type === 'mat') {
            // materials, treat similarly if cost provided
            t += parseFloat(it.cost || 0) * (parseFloat(it.q)||0);
        }
    });
    // mano de obra
    t += (parseFloat(r.time || 0) / 60) * CONFIG.COST_HOUR;
    return { t, all: Array.from(all) };
}

    showModal(`Vender — ${clean(r.n)}`, html);
}

function sellRecipe(recipeId, qty = 1, payment = 'cash'){
    qty = Math.max(1, parseInt(qty) || 1);
    db.tickets = db.tickets || [];

    const r = db.recetas.find(x=>x.id===recipeId);
    if(!r) return toast('Receta no encontrada', 'error');

    // comprobar stock por ingrediente
    const missing = [];
    (r.items || []).forEach(it => {
        if(it.type === 'ing') {
            const ing = db.ingredientes.find(x=>x.id===it.id);
            const yieldFactor = (it.merma && it.merma>0) ? (1 - (it.merma/100)) : 1;
            const needed = yieldFactor > 0 ? (it.q || 0) / yieldFactor * qty : (it.q || 0) * qty;
            if(!ing) missing.push(`${it.n || it.id} (no existe)`);
            else if((ing.stock || 0) < needed) missing.push(`${ing.n} (falta ${(needed - (ing.stock||0)).toFixed(2)} ${ing.unit||''})`);
        }
    });
    if(missing.length) return showModal('Stock insuficiente', `<div class="text-sm"><p class="text-red-500 font-bold mb-2">No hay suficiente stock:</p><ul class="list-disc pl-5">${missing.map(m=>`<li>${m}</li>`).join('')}</ul><div class="mt-4"><button class="btn-ghost" onclick="closeModal()">Cerrar</button></div></div>`);

    // restar stock
    (r.items || []).forEach(it => {
        if(it.type === 'ing') {
            const ing = db.ingredientes.find(x=>x.id===it.id);
            if(!ing) return;
            const yieldFactor = (it.merma && it.merma>0) ? (1 - (it.merma/100)) : 1;
            const needed = yieldFactor > 0 ? (it.q || 0) / yieldFactor * qty : (it.q || 0) * qty;
            ing.stock = Math.max(0, (parseFloat(ing.stock)||0) - needed);
        }
    });

    // actualizar contador ventas en receta
    r.sales = (r.sales || 0) + qty;

    // crear ticket
    const total = (r.pvp || 0) * qty;
    const ticket = { id: generateID('tkt'), date: nowISO(), shortDate: getISO(), recipeId: r.id, name: r.n, qty, total, payment };
    db.tickets.push(ticket);

    // actualizar diario
    const today = getISO();
    let day = db.diario.find(d => d.date === today);
    if(!day){ day = { date: today, cash:0, card:0, other:0, total:0 }; db.diario.push(day); }
    if(payment === 'card') day.card = (day.card || 0) + total;
    else if(payment === 'other') day.other = (day.other || 0) + total;
    else day.cash = (day.cash || 0) + total;
    day.total = (day.cash||0) + (day.card||0) + (day.other||0);

    save('Venta registrada');
    toast(`Venta: ${r.n} x${qty} — ${total.toFixed(2)}€`);
    closeModal();
    render('Cocina');
}

/* Mostrar últimos tickets */
function showTickets(limit = 40){
    db.tickets = db.tickets || [];
    const recent = db.tickets.slice(-limit).reverse();
    const rows = recent.map(t => `<div class="list-item"><div><div class="font-bold">${clean(t.name)} ×${t.qty}</div><div class="small muted">${t.shortDate} · ${t.payment}</div></div><div class="font-mono">${(t.total||0).toFixed(2)}€</div></div>`).join('');
    showModal('Últimos Tickets', `<div class="max-h-[60vh] overflow-auto">${rows || '<div class="muted">Sin tickets</div>'}</div>`);
}

/* ================= 9. STOCK & MERMAS ================= */
function renderStock(app){
    app.innerHTML = `
        <div class="glass-card mb-4">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-gray-800">ALMACÉN</h3>
                <div class="flex gap-2">
                    <input id="stock-search" class="input-premium" placeholder="Buscar..." oninput="searchFilter=this.value; renderStock(document.getElementById('app'))" />
                    <button class="btn-ghost" onclick="editIng()">Nuevo</button>
                </div>
            </div>
            <div id="stock-list"></div>
        </div>
    `;
    const filtered = db.ingredientes.filter(i => i.n.toLowerCase().includes((searchFilter||'').toLowerCase()));
    const list = document.getElementById('stock-list');
    if(!filtered.length) list.innerHTML = `<div class="muted">No hay productos</div>`;
    else list.innerHTML = filtered.map(i => `<div class="list-item"><div><div class="font-bold">${clean(i.n)}</div><div class="small muted">${(i.stock||0)} ${i.unit || ''} · Coste u: ${fmt(i.cost)}</div></div><div class="flex gap-2 items-center"><button class="btn-ghost" onclick="regMerma('${i.id}')">Merma</button><button class="btn-ghost" onclick="editIng('${i.id}')">Editar</button><button class="btn-ghost" onclick="deleteIng('${i.id}')">Borrar</button></div></div>`).join('');
}

function deleteIng(id){ if(confirm("¿Borrar producto?")){ db.ingredientes = db.ingredientes.filter(i=>i.id!==id); save("Borrado"); render('Stock'); }}

function regMerma(id){
    const i = db.ingredientes.find(x=>x.id===id);
    if(!i) return;
    showModal('Registrar Merma', `<p class="text-sm text-gray-500 mb-4">Producto: <b>${clean(i.n)}</b></p><label>Cantidad Perdida</label><input id="m-q" type="number" min="0" class="input-premium mb-3" value="0"><label>Motivo</label><input id="m-r" class="input-premium" placeholder="Motivo..."><div class="flex gap-2 justify-end mt-4"><button class="btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn-premium" onclick="saveMerma('${i.id}')">Registrar</button></div>`);
}

function saveMerma(id){
    const i = db.ingredientes.find(x=>x.id===id);
    const q = parseFloat(document.getElementById('m-q').value) || 0;
    const r = document.getElementById('m-r').value || '';
    if(q <= 0) return toast("Cantidad inválida", "error");
    i.stock = Math.max(0, (parseFloat(i.stock)||0) - q);
    db.mermas.push({ id: generateID('mer'), ingId: id, name: i.n, loss: q, reason: r, date: getISO() });
    save('Merma registrada');
    closeModal();
    render('Stock');
}

function verMermas(){
    const rows = db.mermas.slice().reverse().map(m => `<div class="list-item"><div><div class="font-bold">${clean(m.name)}</div><div class="small muted">${m.date} · ${m.reason||'--'}</div></div><div class="font-mono text-red-500">-${m.loss}</div></div>`).join('');
    showModal('Historial de Mermas', `<div class="max-h-[60vh] overflow-auto">${rows || '<div class="muted">Sin mermas</div>'}</div>`);
}

function editIng(id){
    const i = db.ingredientes.find(x=>x.id===id) || { id: generateID('ing'), n:'', cost:0, stock:0, unit:'kg', aller:[] };
    showModal('Editar Stock', `<div><label>Nombre</label><input id="ei-n" value="${clean(i.n)}" class="input-premium"><label>Coste/u</label><input id="ei-cost" type="number" step="0.01" value="${i.cost||0}" class="input-premium"><label>Stock</label><input id="ei-stock" type="number" step="0.01" value="${i.stock||0}" class="input-premium"><label>Unidad</label><input id="ei-unit" value="${i.unit||'kg'}" class="input-premium"><div class="mt-4 flex gap-2 justify-end"><button class="btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn-premium" onclick="saveIng('${i.id}')">Guardar</button></div></div>`);
}

function saveIng(id){
    const name = document.getElementById('ei-n').value.trim();
    const cost = parseFloat(document.getElementById('ei-cost').value) || 0;
    const stock = parseFloat(document.getElementById('ei-stock').value) || 0;
    const unit = document.getElementById('ei-unit').value || 'kg';
    if(!name) return toast('Nombre inválido', 'error');
    const idx = db.ingredientes.findIndex(x=>x.id===id);
    const obj = { id, n:name, cost, stock, unit, min:0, aller:[] };
    if(idx >= 0) db.ingredientes[idx] = obj; else db.ingredientes.push(obj);
    save('Ingrediente guardado');
    closeModal();
    render('Stock');
}

/* ================= 10. DIARIO (cierre de caja & beneficios) ================= */
function renderDiario(app){
    const today = getISO();
    const day = db.diario.find(d => d.date === today) || { cash:0, card:0, other:0, total:0 };
    const total = (day.cash||0) + (day.card||0) + (day.other||0);
    // compute profit using tickets
    const ticketsToday = db.tickets.filter(t => t.shortDate === today);
    const totalTicketSales = ticketsToday.reduce((s,t)=>s + (t.total||0), 0);
    const totalCost = ticketsToday.reduce((s,t) => {
        const r = db.recetas.find(x=>x.id === t.recipeId);
        if(!r) return s;
        const cost = calcRecipe(r).t || 0;
        return s + (cost * (t.qty||1));
    }, 0);
    const profit = totalTicketSales - totalCost;

    app.innerHTML = `
    <div class="glass-card mb-4">
        <div class="flex justify-between items-center mb-3"><div><div class="small muted">CIERRE CAJA</div><div class="text-indigo-600 font-bold">${today}</div></div><div><button class="btn-ghost" onclick="showTickets()">Ver Tickets</button></div></div>
        <div class="grid grid-cols-2 gap-3 mb-3">
            <div><label>Efectivo</label><input type="number" id="z-cash" value="${day.cash||0}" class="input-premium text-2xl font-bold text-center" oninput="calcTotal()"></div>
            <div><label>Tarjeta</label><input type="number" id="z-card" value="${day.card||0}" class="input-premium text-2xl font-bold text-center" oninput="calcTotal()"></div>
        </div>
        <div class="mb-3"><label>Otros / Invitaciones</label><input type="number" id="z-other" value="${day.other||0}" class="input-premium" oninput="calcTotal()"></div>
        <div class="flex justify-between items-center pt-4 border-t border-gray-100"><span class="font-bold text-gray-400">TOTAL DÍA</span><span id="z-total-display" class="text-4xl font-black text-indigo-600">${total.toFixed(2)}€</span></div>
        <div class="mt-4 grid grid-cols-3 gap-3">
            <button class="btn-premium" onclick="saveZ()">GUARDAR CIERRE</button>
            <button class="btn-ghost" onclick="showProfitDetails()">DETALLES BENEFICIO</button>
            <button class="btn-ghost" onclick="downloadBackup()">EXPORTAR DB</button>
        </div>
    </div>

    <div class="glass-card">
        <div class="flex justify-between items-center"><div><div class="small muted">Resumen Tickets (hoy)</div><div class="font-black">${fmt(totalTicketSales)}</div></div><div><div class="small muted">Coste estimado</div><div class="font-black">${fmt(totalCost)}</div></div><div><div class="small muted">Beneficio</div><div class="font-black">${fmt(profit)}</div></div></div>
        <div class="mt-4"><canvas id="chartZ"></canvas></div>
    </div>
    `;
    // Chart: últimos 7 días
    try {
        const ctx = document.getElementById('chartZ');
        const last7 = db.diario.slice(-7);
        new Chart(ctx, { type:'bar', data:{ labels:last7.map(d=>d.date.slice(5)), datasets:[{ label:'Ventas', data:last7.map(d=>d.total||0), backgroundColor:'#7c3aed' }]}, options:{ responsive:true }});
    } catch(e){ /* ignore chart errors */ }
}

function calcTotal(){
    const c = parseFloat(document.getElementById('z-cash').value) || 0;
    const t = parseFloat(document.getElementById('z-card').value) || 0;
    const o = parseFloat(document.getElementById('z-other').value) || 0;
    document.getElementById('z-total-display').innerText = (c + t + o).toFixed(2) + '€';
}

function saveZ(){
    const c = parseFloat(document.getElementById('z-cash').value) || 0;
    const t = parseFloat(document.getElementById('z-card').value) || 0;
    const o = parseFloat(document.getElementById('z-other').value) || 0;
    const total = c + t + o;
    const today = getISO();
    let day = db.diario.find(d => d.date === today);
    if(!day){ day = { date: today, cash:c, card:t, other:o, total }; db.diario.push(day); }
    else { day.cash = c; day.card = t; day.other = o; day.total = total; }
    save('Cierre guardado');
    toast('Cierre guardado');
}

/* Mostrar detalle de beneficio desde tickets */
function showProfitDetails(){
    const today = getISO();
    const ticketsToday = db.tickets.filter(t => t.shortDate === today);
    const rows = ticketsToday.map(t => {
        const r = db.recetas.find(x=>x.id===t.recipeId);
        const cost = r ? calcRecipe(r).t : 0;
        const profit = (t.total||0) - (cost * (t.qty||1));
        return `<div class="list-item"><div><div class="font-bold">${clean(t.name)} x${t.qty}</div><div class="small muted">${t.payment}</div></div><div class="text-right"><div class="font-black">${(t.total||0).toFixed(2)}€</div><div class="small ${profit>=0?'text-green-600':'text-red-500'}">${profit.toFixed(2)}€</div></div></div>`;
    }).join('');
    showModal('Detalle de Beneficio (hoy)', `<div class="max-h-[60vh] overflow-auto">${rows || '<div class="muted">Sin tickets hoy</div>'}</div>`);
}

/* ================= 11. MODAL & BACKUP UTILS ================= */
function showModal(title, content){
    document.getElementById('m-title').innerText = title;
    document.getElementById('m-body').innerHTML = content;
    document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal(){ document.getElementById('modal-overlay').classList.add('hidden'); }

function downloadBackup(){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' }));
    a.download = `Arume_backup_${getISO()}.json`;
    a.click();
}
function restoreBackup(input){
    const r = new FileReader();
    r.onload = e => {
        try {
            const parsed = JSON.parse(e.target.result);
            db = parsed;
            save("Restaurado");
            location.reload();
        } catch(err){ toast("Archivo inválido", "error"); }
    };
    r.readAsText(input.files[0]);
}

/* ================= INIT ================= */
init();

</script>
