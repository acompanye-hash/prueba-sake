<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>ARUME V125 · Platinum</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* ESTÉTICA V125 */
    body { font-family: 'Poppins', sans-serif; background: #f8fafc; padding-bottom: 100px; -webkit-tap-highlight-color: transparent; user-select: none; margin:0; }
    .glass-card { background: white; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
    .btn-premium { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); color: white; padding: 12px; border-radius: 12px; font-weight: 700; cursor:pointer; }
    .btn-ghost { background: #f1f5f9; color: #475569; font-weight: 600; padding: 10px; border-radius: 12px; cursor:pointer; }
    .input-premium { width:100%; padding:10px; border-radius:10px; border:1px solid #e6eef8; background:#fbfdff; }
    .alb-table { width:100%; border-collapse: collapse; font-size:13px; }
    .alb-table th, .alb-table td { padding:8px 6px; border-bottom:1px solid #f1f5f9; text-align:left; }
    .alb-header { background:#f3f4f6; text-transform:uppercase; font-size:12px; }
    .overlay { position: fixed; inset:0; background: rgba(15,23,42,0.8); display:flex; align-items:center; justify-content:center; z-index:100; }
    .modal { width:95%; max-width:900px; max-height:90vh; overflow:auto; background:white; border-radius:16px; padding:20px; }
    .hidden { display:none!important; }
    #loading-overlay { position: fixed; inset:0; background: rgba(255,255,255,0.9); z-index:9999; display:flex; align-items:center; justify-content:center; flex-direction:column; }
    .spinner { width:40px; height:40px; border:4px solid #e2e8f0; border-top:4px solid #4f46e5; border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    nav { position:fixed; bottom:0; left:0; right:0; background:white; display:flex; gap:6px; padding:10px; justify-content:space-around; border-top:1px solid #e6eef8; z-index:50; }
    nav button { background:none; border:none; color:#94a3b8; font-weight:700; display:flex; flex-direction:column; align-items:center; font-size:12px; cursor:pointer; }
    nav button.active { color:#4f46e5; transform:translateY(-3px); }
    .muted { color:#9ca3af; font-size:13px; }
  </style>
</head>
<body>

  <div id="loading-overlay" class="hidden">
    <div class="spinner"></div>
    <div style="margin-top:8px;color:#6b7280;font-weight:700;">CARGANDO...</div>
  </div>

  <div id="toast-container" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;"></div>
  <input type="file" id="backup-input" class="hidden" onchange="restoreBackup(this)"/>

  <header style="position:sticky;top:0;background:white;padding:14px;border-bottom:1px solid #eef2ff;z-index:80;display:flex;justify-content:space-between;align-items:center;">
    <div>
      <h1 style="margin:0;font-size:20px;font-weight:800;">ARUME <span style="color:#4f46e5">V125</span></h1>
      <div style="font-size:11px;color:#94a3b8;font-weight:700;">Platinum Edition</div>
    </div>
    <div id="user-name" style="background:#f3f4f6;padding:8px;border-radius:999px;font-weight:700;color:#475569;cursor:pointer;">Login</div>
  </header>

  <!-- PIN SCREEN (optional) -->
  <div id="pin-screen" class="hidden" style="position:fixed;inset:0;background:#1e1b4b;z-index:200;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;">
    <div style="text-align:center;margin-bottom:16px;">
      <h2 style="font-size:48px;margin:0;font-weight:900;">ARUME</h2>
      <div style="opacity:0.6;margin-top:6px;font-size:12px;">Acceso Seguro</div>
    </div>
    <div id="pin-display" style="font-family:monospace;font-size:32px;letter-spacing:8px;margin-bottom:18px;">****</div>
    <div style="display:grid;grid-template-columns:repeat(3,72px);gap:10px;">
      <button class="pin-btn" onclick="pin(1)" style="width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,0.06);color:white;font-weight:700;">1</button>
      <button class="pin-btn" onclick="pin(2)" style="width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,0.06);color:white;font-weight:700;">2</button>
      <button class="pin-btn" onclick="pin(3)" style="width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,0.06);color:white;font-weight:700;">3</button>
      <button class="pin-btn" onclick="pin(4)" style="width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,0.06);color:white;font-weight:700;">4</button>
      <button class="pin-btn" onclick="pin(5)" style="width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,0.06);color:white;font-weight:700;">5</button>
      <button class="pin-btn" onclick="pin(6)" style="width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,0.06);color:white;font-weight:700;">6</button>
      <button class="pin-btn" onclick="pin(7)" style="width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,0.06);color:white;font-weight:700;">7</button>
      <button class="pin-btn" onclick="pin(8)" style="width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,0.06);color:white;font-weight:700;">8</button>
      <button class="pin-btn" onclick="pin(9)" style="width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,0.06);color:white;font-weight:700;">9</button>
      <button class="pin-btn" onclick="pin('C')" style="width:72px;height:72px;border-radius:50%;background:#ff6b6b;color:white;font-weight:700;">C</button>
      <button class="pin-btn" onclick="pin(0)" style="width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,0.06);color:white;font-weight:700;">0</button>
      <button class="pin-btn" onclick="pin('OK')" style="width:72px;height:72px;border-radius:50%;background:#38b000;color:white;font-weight:700;">OK</button>
    </div>
  </div>

  <main id="app" style="padding:18px;max-width:1100px;margin:0 auto;"></main>

  <nav id="navbar"></nav>

  <div id="modal-overlay" class="hidden" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:200;">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 id="m-title" style="margin:0;font-weight:900;"></h3>
        <button onclick="closeModal()" style="background:#f1f5f9;border-radius:8px;padding:6px 8px;border:none;cursor:pointer;">✕</button>
      </div>
      <div id="m-body"></div>
    </div>
  </div>

<script>
/* ================== CONFIG & DB ================== */
const CONFIG = { GOOGLE_URL: "", COST_HOUR: 15 };

const ALLERGENS = [
  {k:'glu', i:'🌾'}, {k:'cru', i:'🦐'}, {k:'hue', i:'🥚'}, {k:'pes', i:'🐟'},
  {k:'cac', i:'🥜'}, {k:'soj', i:'🫘'}, {k:'lac', i:'🥛'}, {k:'fru', i:'🌰'},
  {k:'api', i:'🥬'}, {k:'mos', i:'🌭'}, {k:'ses', i:'🌱'}, {k:'sul', i:'🍷'},
  {k:'alt', i:'🫘'}, {k:'mol', i:'🐙'}
];

const DB_INIT = {
  users: [{id:'u1', n:'Gerencia', pin:'0150', role:'admin'}],
  ingredientes: [], recetas: [], proveedores: [{n:'Makro'}],
  albaranes: [], facturas: [], diario: [], mermas: [], lastSync: 0
};

const secure = {
  enc: (d) => btoa(encodeURIComponent(JSON.stringify(d))),
  dec: (d) => JSON.parse(decodeURIComponent(atob(d)))
};

let db = DB_INIT;
let currentUser = null, currentPin = "", tempItems = [], activeAdminTab = 'albaranes', searchFilter = "";

/* ============== UTILITIES ============== */
const generateID = () => Math.random().toString(36).slice(2,11);
const getISO = () => new Date().toLocaleDateString('en-CA');
function clean(s){ if(!s) return ''; return String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function loading(show){ document.getElementById('loading-overlay').classList.toggle('hidden', !show); }
function toast(msg, type='info'){
  const box = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.style.background = type==='error' ? '#ef4444' : '#0f172a';
  el.style.color='white';
  el.style.padding='10px 16px';
  el.style.borderRadius='999px';
  el.style.fontWeight='700';
  el.style.marginTop='6px';
  el.innerText = msg;
  box.appendChild(el);
  setTimeout(()=>el.remove(), 3000);
}

/* ============== INIT / SAVE / SYNC ============== */
function init(){
  try {
    const stored = localStorage.getItem('arume_v125') || localStorage.getItem('arume_v121') || localStorage.getItem('arume_v115');
    if(stored) db = secure.dec(stored);
  } catch(e){ console.warn('DB load failed'); }
  if(!db.users || !db.users.length) db.users = DB_INIT.users;
  const u = localStorage.getItem('arume_user');
  if(u){ currentUser = JSON.parse(u); document.getElementById('pin-screen').classList.add('hidden'); loadApp(); }
  else { document.getElementById('pin-screen').classList.remove('hidden'); }
  if(CONFIG.GOOGLE_URL) sync();
}

async function save(msg){
  loading(true);
  db.lastSync = Date.now();
  try{ localStorage.setItem('arume_v125', secure.enc(db)); }catch(e){}
  if(CONFIG.GOOGLE_URL){
    try{ await fetch(CONFIG.GOOGLE_URL, {method:'POST', mode:'no-cors', body:JSON.stringify(db)}).catch(()=>{}); }catch(e){}
  }
  loading(false);
  if(msg) toast(msg);
}

async function sync(){
  if(!CONFIG.GOOGLE_URL) return;
  const dot = document.getElementById('user-name');
  try {
    const r = await fetch(CONFIG.GOOGLE_URL);
    const c = await r.json();
    if(c && c.lastSync > (db.lastSync||0)){ db = c; localStorage.setItem('arume_v125', secure.enc(db)); location.reload(); }
  } catch(e){}
}

/* ============== AUTH PIN ============== */
function pin(n){
  if(n === 'C'){ currentPin = ''; document.getElementById('pin-display').innerText = '****'; return; }
  if(n === 'OK'){
    const u = db.users.find(x => x.pin === currentPin);
    if(u){ currentUser = u; localStorage.setItem('arume_user', JSON.stringify(u)); document.getElementById('pin-screen').classList.add('hidden'); loadApp(); }
    else { toast('PIN Incorrecto','error'); currentPin = ''; document.getElementById('pin-display').innerText = '****'; }
    return;
  }
  if(String(currentPin).length < 4) currentPin += String(n);
  document.getElementById('pin-display').innerText = currentPin ? '*'.repeat(currentPin.length) : '****';
}
function logout(){ if(confirm('¿Cerrar sesión?')){ localStorage.removeItem('arume_user'); location.reload(); } }

/* ============== NAV & RENDER ============== */
function loadApp(){ document.getElementById('user-name').innerText = currentUser?.n || 'Login'; renderNav(); render('Admin'); }

function renderNav(){
  const views = [
    {id:'Diario', l:'Caja'},
    {id:'Admin', l:'Gestión'},
    {id:'Cocina', l:'Cocina'},
    {id:'Stock', l:'Stock'}
  ];
  const html = views.map(v => `<button id="btn-${v.id}" onclick="render('${v.id}')">${v.l}</button>`).join('');
  document.getElementById('navbar').innerHTML = html;
}

function render(view){
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById(`btn-${view}`)?.classList.add('active');
  const app = document.getElementById('app');
  if(view === 'Diario') renderDiario(app);
  else if(view === 'Admin') renderAdmin(app);
  else if(view === 'Cocina') renderCocina(app);
  else if(view === 'Stock') renderStock(app);
}

/* ================= ADMIN PANEL ================= */
function renderAdmin(app){
  app.innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <button class="${activeAdminTab==='albaranes'?'btn-premium':''} btn-ghost" onclick="activeAdminTab='albaranes';renderAdmin(document.getElementById('app'))">ENTRADAS</button>
      <button class="${activeAdminTab==='facturas'?'btn-premium':''} btn-ghost" onclick="activeAdminTab='facturas';renderAdmin(document.getElementById('app'))">FACTURAS</button>
      <button class="${activeAdminTab==='omnes'?'btn-premium':''} btn-ghost" onclick="activeAdminTab='omnes';renderAdmin(document.getElementById('app'))">OMNES</button>
    </div>
    <div id="adm-c"></div>
  `;
  const c = document.getElementById('adm-c');
  if(activeAdminTab === 'albaranes') renderAlbaranes(c);
  if(activeAdminTab === 'facturas') renderFacturas(c);
  if(activeAdminTab === 'omnes') renderOmnes(c);
}

/* ================= ALBARANES (mejorado) ================= */
function renderAlbaranes(c){
  const provOptions = (db.proveedores||[]).map(p => `<option value="${clean(p.n)}">`).join('');
  const nextNum = `A-${new Date().getFullYear().toString().slice(-2)}-${(db.albaranes.length+1).toString().padStart(4,'0')}`;

  c.innerHTML = `
    <div class="glass-card">
      <h3 style="margin:0 0 12px 0;font-weight:900;">Nuevo Albarán</h3>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;">
        <div><label>Proveedor</label><input list="prov-list" id="alb-prov" class="input-premium" placeholder="..."><datalist id="prov-list">${provOptions}</datalist></div>
        <div><label>Productor</label><input id="alb-producer" class="input-premium" placeholder="Opcional..."></div>
        <div><label>Nº Albarán</label><input id="alb-num" class="input-premium" value="${nextNum}"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
        <div><label>Fecha</label><input type="date" id="alb-date" class="input-premium" value="${getISO()}"></div>
        <div><label>Nota</label><input id="alb-note" class="input-premium"></div>
      </div>
      <textarea id="alb-input" rows="4" class="input-premium" placeholder="Formato: Producto, Cantidad unidad, Precio[, Descuento][, IVA%]. Ej: Harina, 10 kg, 0.50, 0%, 21%"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;margin-bottom:8px;">
        <button class="btn-ghost" onclick="parseAlb()">🪄 Leer Texto</button>
        <button class="btn-ghost" onclick="tempItems=[];renderAlbGrid()">Limpiar</button>
        <button class="btn-ghost" onclick="showAlbImportHelp()">?</button>
      </div>
      <div id="alb-grid" style="margin-bottom:12px;"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div class="muted">Subtotal: <span id="alb-subtotal">0.00€</span></div>
        <div style="font-weight:900;font-size:20px;color:#4f46e5;" id="alb-total">0.00€</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
        <button class="btn-premium" onclick="commitAlb()">CONFIRMAR ENTRADA</button>
        <button class="btn-ghost" onclick="save('Borrador guardado')">GUARDAR</button>
        <button class="btn-ghost" onclick="exportAlbCSV()">EXPORTAR CSV</button>
      </div>
    </div>

    <div class="glass-card" style="margin-top:12px;">
      <h4 style="margin:0 0 12px 0;font-weight:900;">Historial</h4>
      <div id="alb-history">${(db.albaranes||[]).slice().reverse().map(a => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9;">
          <div>
            <div style="font-weight:800;">${clean(a.prov || a.productor || '')}</div>
            <div style="font-size:12px;color:#94a3b8;">#${clean(a.num||'')} · ${a.date}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <button class="btn-ghost" onclick="viewAlbDetails('${a.id}')">VER</button>
            <div style="font-family:monospace;font-weight:800;">${(a.total||0).toFixed(2)}€</div>
            ${!a.invoiced ? `<button class="btn-ghost" onclick="editAlb('${a.id}')">✏️</button><button class="btn-ghost" onclick="deleteAlb('${a.id}')">🗑️</button>` : `<span style="background:#e6fffa;color:#065f46;padding:4px 8px;border-radius:8px;font-weight:800;">FACTURADO</span>`}
          </div>
        </div>
      `).join('')}</div>
    </div>
  `;

  renderAlbGrid();
}

function showAlbImportHelp(){
  showModal('Ayuda: Importar albaranes', `<div style="font-size:14px;">
    <p>Por línea: <b>Producto, Cantidad unidad, Precio[, Descuento][, IVA%]</b></p>
    <p>Ejemplos: <code>Harina, 10 kg, 0.50, 0%, 21%</code> o <code>Huevos, 30 ud, 0.10, 10%</code></p>
    <p>Descuento puede ser absoluto o porcentual (ej. 1.50 o 5%). IVA opcional, por defecto 21%.</p>
    <div style="margin-top:8px;"><button class="btn-ghost" onclick="closeModal()">Cerrar</button></div>
  </div>`);
}

function parseAlb(){
  const txt = document.getElementById('alb-input').value.trim();
  tempItems = [];
  if(!txt) return toast('No hay texto para leer','error');
  const lines = txt.split(/\r?\n/).map(l=>l.trim()).filter(l=>l);
  lines.forEach(l => {
    let parts = l.split(',').map(p=>p.trim()).filter(p=>p);
    if(parts.length === 1) parts = l.split(/\t/).map(p=>p.trim()).filter(p=>p);

    let name = '', qty = 1, price = 0, unit = 'ud', discount = 0, discountType = 'abs', vat = 21;
    if(parts.length >= 2){
      name = parts[0];
      const second = parts[1];
      const qmatch = second.match(/^([\d\.,\/]+)\s*(kg|g|gr|l|lt|ml|ud|u|pcs|unidad|un)?$/i);
      if(qmatch){ qty = parseFloat(String(qmatch[1]).replace(',','.')) || 1; unit = normalizeUnit(qmatch[2]); }
      else { const maybeNum = parseFloat(second.replace(',','.')); if(!isNaN(maybeNum)) qty = maybeNum; }
      if(parts.length >= 3) price = parseFloat(String(parts[2]).replace(',','.')) || 0;
      if(parts.length >= 4){
        const d = parts[3];
        if(String(d).includes('%')) { discountType='pct'; discount = parseFloat(String(d).replace('%','').replace(',','.')) || 0; }
        else discount = parseFloat(String(d).replace(',','.')) || 0;
      }
      if(parts.length >= 5){
        const v = parts[4];
        vat = parseFloat(String(v).replace('%','').replace(',','.')) || 21;
      }
    } else {
      // fallback simpler parsing
      const nums = l.match(/[\d\.,]+/g) || [];
      name = l.replace(/[\d\.,]+/g,'').replace(/\b(kg|g|gr|l|lt|ml|ud|u|pcs|unidad|un)\b/gi,'').trim();
      if(nums.length === 1) price = parseFloat(nums[0].replace(',','.')) || 0;
      if(nums.length >= 2) { qty = parseFloat(nums[0].replace(',','.'))||1; price = parseFloat(nums[1].replace(',','.'))||0; }
      const um = l.match(/\b(kg|g|gr|l|lt|ml|ud|u|pcs|unidad|un)\b/i);
      if(um) unit = normalizeUnit(um[1]);
      const vm = l.match(/\b(\d{1,2})\s*%/);
      if(vm) vat = parseFloat(vm[1]) || 21;
    }

    if(price > 0 && name) tempItems.push({ n: name.trim(), q: qty, p: price, unit, d: discount, dType: discountType, vat });
  });

  renderAlbGrid();
}

function normalizeUnit(u){
  if(!u) return 'ud';
  u = String(u).toLowerCase();
  if(u.startsWith('kg')) return 'kg';
  if(u === 'g' || u === 'gr') return 'g';
  if(u.startsWith('l') || u === 'lt') return 'l';
  if(u === 'ml') return 'ml';
  if(['ud','u','unidad','un','pcs'].includes(u)) return 'ud';
  return 'ud';
}

function calcLineSubtotal(it, avoidMutate){
  const q = parseFloat(it.q) || 0;
  const p = parseFloat(it.p) || 0;
  let line = q * p;
  if(it.d){
    if(it.dType === 'pct') line -= (line * (parseFloat(it.d) || 0) / 100);
    else line -= parseFloat(it.d) || 0;
  }
  if(!avoidMutate) it._subtotal = line;
  return line;
}

function renderAlbGrid(){
  const container = document.getElementById('alb-grid');
  if(!container) return;
  const rows = tempItems.map((it,i) => {
    const subtotal = calcLineSubtotal(it,true);
    return `<div style="display:flex;gap:8px;align-items:center;padding:8px;background:white;border-radius:10px;border:1px solid #f1f5f9;margin-bottom:6px;">
      <input value="${clean(it.n)}" onchange="tempItems[${i}].n=this.value" style="flex:1;border:0;background:transparent;font-weight:700;" />
      <input type="number" value="${it.q}" onchange="tempItems[${i}].q=parseFloat(this.value)||0;renderAlbGrid()" style="width:70px;padding:6px;border-radius:6px;border:1px solid #eef2f6;text-align:center;" />
      <select onchange="tempItems[${i}].unit=this.value;renderAlbGrid()" style="width:72px;padding:6px;border-radius:6px;border:1px solid #eef2f6;">
        <option ${it.unit==='ud'?'selected':''} value="ud">ud</option>
        <option ${it.unit==='kg'?'selected':''} value="kg">kg</option>
        <option ${it.unit==='g'?'selected':''} value="g">g</option>
        <option ${it.unit==='l'?'selected':''} value="l">l</option>
        <option ${it.unit==='ml'?'selected':''} value="ml">ml</option>
      </select>
      <input type="number" value="${it.p}" onchange="tempItems[${i}].p=parseFloat(this.value)||0;renderAlbGrid()" style="width:80px;padding:6px;border-radius:6px;border:1px solid #eef2f6;text-align:center;" />
      <input type="text" value="${it.d + (it.dType==='pct'?'%':'')}" onchange="parseDiscount(${i}, this.value)" style="width:70px;padding:6px;border-radius:6px;border:1px solid #eef2f6;text-align:center;" />
      <select onchange="tempItems[${i}].vat=parseFloat(this.value)||0;renderAlbGrid()" style="width:80px;padding:6px;border-radius:6px;border:1px solid #eef2f6;">
        <option ${it.vat===0?'selected':''} value="0">0%</option>
        <option ${it.vat===4?'selected':''} value="4">4%</option>
        <option ${it.vat===10?'selected':''} value="10">10%</option>
        <option ${it.vat===21?'selected':''} value="21">21%</option>
      </select>

    </div>`;
  }).join('');
  container.innerHTML = rows || `<div class="muted">No hay líneas todavía</div>`;

  const subtotal = tempItems.reduce((a,b)=>a+calcLineSubtotal(b,true),0);

  document.getElementById('alb-total').innerText = total.toFixed(2) + '€';
}

function parseDiscount(index, value){
  const v = String(value).trim();
  if(v.includes('%')){ tempItems[index].dType='pct'; tempItems[index].d = parseFloat(v.replace('%','').replace(',','.'))||0; }
  else { tempItems[index].dType='abs'; tempItems[index].d = parseFloat(v.replace(',','.'))||0; }
  renderAlbGrid();
}

function commitAlb(){
  if(!tempItems.length) return toast('Lista vacía','error');
  const prov = document.getElementById('alb-prov').value || '';
  const producer = document.getElementById('alb-producer').value || '';
  const num = document.getElementById('alb-num').value || generateID();
  const date = document.getElementById('alb-date').value || getISO();
  const note = document.getElementById('alb-note').value || '';

  if(!prov && !producer) return toast('Falta proveedor o productor','error');

  if(prov && !db.proveedores.find(p=>p.n===prov)) db.proveedores.push({n:prov});

  // update stock logically (unit-aware)
  tempItems.forEach(it => {
    const nameLower = it.n.trim().toLowerCase();
    let existing = db.ingredientes.find(x => x.n.toLowerCase() === nameLower && x.unit === it.unit);
    if(existing){
      const prevStock = parseFloat(existing.stock)||0;
      const prevCost = parseFloat(existing.cost)||0;
      const addQty = parseFloat(it.q)||0;
      const addCost = parseFloat(it.p)||0;
      existing.cost = prevStock+addQty > 0 ? (((prevStock*prevCost) + (addQty*addCost)) / (prevStock+addQty)) : addCost;
      existing.stock = prevStock + addQty;
    } else {
      const other = db.ingredientes.find(x => x.n.toLowerCase() === nameLower);
      if(other && other.unit !== it.unit){
        const newName = `${it.n} (${it.unit})`;
        db.ingredientes.push({id:generateID(), n:newName, stock:it.q, cost:it.p, min:0, unit:it.unit, aller:[]});
      } else {
        db.ingredientes.push({id:generateID(), n:it.n, stock:it.q, cost:it.p, min:0, unit:it.unit, aller:[]});
      }
    }
  });

  const subtotal = tempItems.reduce((a,b)=>a+calcLineSubtotal(b,true),0);
  db.albaranes.push({
    id: generateID(),
    num,
    prov,
    productor:producer,
    date,
    note,
    items: JSON.parse(JSON.stringify(tempItems)),
    subtotal,
    total: subtotal,
    invoiced: false
  });

  save('Entrada guardada');
  tempItems = [];
  renderAdmin(document.getElementById('app'));
}

/* delete / edit / view */
function deleteAlb(id){
  const alb = db.albaranes.find(a=>a.id===id);
  if(!alb) return;
  const warning = alb.invoiced ? '⚠️ Está facturado. Borrar y restar stock igualmente?' : '¿Borrar y restar stock?';
  if(!confirm(warning)) return;
  alb.items.forEach(it => {
    const i = db.ingredientes.find(x => x.n.toLowerCase() === it.n.toLowerCase() && x.unit === it.unit);
    if(i) i.stock = Math.max(0, (parseFloat(i.stock)||0) - it.q);
  });
  db.albaranes = db.albaranes.filter(a=>a.id!==id);
  save('Albarán borrado');
  renderAdmin(document.getElementById('app'));
}

function editAlb(id){
  const alb = db.albaranes.find(a=>a.id===id);
  if(!alb) return;

  alb.items.forEach(it => {

/* Prepare invoice preview from selected albaranes (aggregates by product+unit+vat) */
function prepareInvoiceFromAlbaranes(provider, idsCSV){
  const ids = idsCSV.split(',');
  const map = {};
  ids.forEach(id => {
    const a = db.albaranes.find(x=>x.id===id);
    if(!a) return;
    a.items.forEach(it=>{
      const key = `${it.n}||${it.unit}||${it.vat}`;
      if(!map[key]) map[key] = { n: it.n, unit: it.unit, p: it.p, d: it.d, dType: it.dType, vat: it.vat, q: 0, albaranes: [] };
      map[key].q += it.q;
      if(!map[key].albaranes.includes(a.id)) map[key].albaranes.push(a.id);
    });
  });

  const rows = Object.values(map).map(it=>{
    const base = (parseFloat(it.q)||0) * (parseFloat(it.p)||0);
    let baseNet = base;
    if(it.d){
      if(it.dType === 'pct') baseNet -= (base * (parseFloat(it.d)||0)/100);
      else baseNet -= parseFloat(it.d)||0;
    }
    const vatAmt = baseNet * ((parseFloat(it.vat)||0)/100);
    const total = baseNet + vatAmt;
    return { it, baseNet, vatAmt, total };
  });

  const subtotal = rows.reduce((a,r)=>a+r.baseNet,0);
  const vatGroups = {};
  rows.forEach(r => { const rate = String(r.it.vat||0); vatGroups[rate] = (vatGroups[rate]||0) + r.vatAmt; });
  const totalVat = Object.values(vatGroups).reduce((a,b)=>a+b,0);
  const grandTotal = subtotal + totalVat;

  const rowsHtml = rows.map(r => `<tr>
    <td>${clean(r.it.n)}</td>
    <td class="small">${r.it.q} ${r.it.unit}</td>
    <td class="small">${(r.it.p||0).toFixed(2)}€</td>
    <td class="small">${r.it.d ? (r.it.dType === 'pct' ? r.it.d+'%' : r.it.d.toFixed(2)+'€') : '-'}</td>
    <td class="small">${r.it.vat}%</td>
    <td style="text-align:right;font-family:monospace;font-weight:800;">${r.baseNet.toFixed(2)}€</td>
    <td style="text-align:right;font-family:monospace;">${r.vatAmt.toFixed(2)}€</td>
    <td style="text-align:right;font-family:monospace;font-weight:800;">${r.total.toFixed(2)}€</td>
  </tr>`).join('');

  const vatHtml = Object.keys(vatGroups).map(rate => `<div style="display:flex;justify-content:space-between;"><div class="small">IVA ${rate}%</div><div style="font-weight:800;">${vatGroups[rate].toFixed(2)}€</div></div>`).join('');

  showModal(`Factura PREVIA · ${clean(provider)}`, `
    <div class="muted">Proveedor: <b>${clean(provider)}</b></div>
    <table class="alb-table" style="margin-top:8px;">
      <thead><tr class="alb-header"><th>Producto</th><th>Un.</th><th>Precio</th><th>Descto</th><th>IVA</th><th style="text-align:right">Base</th><th style="text-align:right">IVA</th><th style="text-align:right">Total</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    <div style="margin-top:8px;">${vatHtml}</div>
    <div style="display:flex;justify-content:flex-end;margin-top:8px;font-weight:900;font-size:18px;">${grandTotal.toFixed(2)}€</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;">
      <input id="inv-num" class="input-premium" placeholder="Nº Factura (editable)">
      <input type="date" id="inv-date" class="input-premium" value="${getISO()}">
      <input id="inv-note" class="input-premium" placeholder="Observaciones">
    </div>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button class="btn-premium" onclick="createInvoiceFromPreview('${clean(provider)}','${ids.join(',')}')">CREAR FACTURA</button>
      <button class="btn-ghost" onclick="closeModal()">CANCELAR</button>
    </div>
  `);
}

function createInvoiceFromPreview(provider, idsCSV){
  const ids = idsCSV.split(',');
  const map = {};
  ids.forEach(id => {
    const a = db.albaranes.find(x=>x.id===id);
    if(!a) return;
    a.items.forEach(it=>{
      const key = `${it.n}||${it.unit}||${it.vat}`;
      if(!map[key]) map[key] = { n: it.n, unit: it.unit, p: it.p, d: it.d, dType: it.dType, vat: it.vat, q: 0, albaranes: [] };
      map[key].q += it.q;
      if(!map[key].albaranes.includes(a.id)) map[key].albaranes.push(a.id);
    });
  });

  const items = Object.values(map).map(it => {
    const base = (parseFloat(it.q)||0) * (parseFloat(it.p)||0);
    let baseNet = base;
    if(it.d){
      if(it.dType === 'pct') baseNet -= (base * (parseFloat(it.d)||0)/100);
      else baseNet -= parseFloat(it.d)||0;
    }
    const vatAmt = baseNet * ((parseFloat(it.vat)||0)/100);
    return { ...it, baseNet, vatAmt, total: baseNet + vatAmt };
  });

  const subtotal = items.reduce((a,i)=>a+i.baseNet,0);
  const vatGroups = {};
  items.forEach(it => vatGroups[it.vat] = (vatGroups[it.vat]||0) + it.vatAmt );
  const totalVat = Object.values(vatGroups).reduce((a,b)=>a+b,0);
  const total = subtotal + totalVat;

  const num = document.getElementById('inv-num').value || `F-${new Date().getFullYear().toString().slice(-2)}-${(db.facturas.length+1).toString().padStart(4,'0')}`;
  const date = document.getElementById('inv-date').value || getISO();
  const note = document.getElementById('inv-note').value || '';

  const factura = {
    id: generateID(),
    num,
    prov: provider,
    date,
    items: JSON.parse(JSON.stringify(items)),
    subtotal,
    vatGroups,
    total,
    albaranes: ids,
    note,
    paid: false
  };

  // mark albaranes as invoiced
  ids.forEach(id => { const a = db.albaranes.find(x=>x.id===id); if(a) a.invoiced = true; });

  if(provider && !db.proveedores.find(p=>p.n===provider)) db.proveedores.push({n: provider});
  db.facturas.push(factura);
  save('Factura creada');
  closeModal();
  renderAdmin(document.getElementById('app'));
}

function miAddLine(){
  const n = document.getElementById('mi-prod').value;
  const q = parseFloat(document.getElementById('mi-qty').value) || 0;
  const unit = document.getElementById('mi-unit').value;
  const p = parseFloat(document.getElementById('mi-price').value) || 0;
  const dRaw = document.getElementById('mi-disc').value || '';
  let d=0, dType='abs';
  if(String(dRaw).includes('%')){ dType='pct'; d = parseFloat(String(dRaw).replace('%','').replace(',','.'))||0; }
  else d = parseFloat(String(dRaw).replace(',','.'))||0;
  const vat = parseFloat(document.getElementById('mi-vat').value) || 0;
  if(!n || q<=0 || p<=0){ return toast('Rellena producto, cantidad y precio','error'); }
  window.miTempLines.push({ n, q, unit, p, d, dType, vat });
  renderMiLines();
  document.getElementById('mi-prod').value=''; document.getElementById('mi-qty').value=''; document.getElementById('mi-price').value=''; document.getElementById('mi-disc').value='';

function renderMiLines(){
  const el = document.getElementById('mi-lines');

  el.innerHTML = (window.miTempLines || []).map((it,i) => {

    let baseNet = base;
    if(it.d){
      if(it.dType === 'pct') baseNet -= (base * (it.d||0)/100);
      else baseNet -= it.d || 0;

    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9;">

function miCreateInvoice(){
  const prov = document.getElementById('mi-prov').value || '';
  if(!prov) return toast('Proveedor obligatorio','error');
  const num = document.getElementById('mi-num').value || `F-${new Date().getFullYear().toString().slice(-2)}-${(db.facturas.length+1).toString().padStart(4,'0')}`;
  const date = document.getElementById('mi-date').value || getISO();
  const note = document.getElementById('mi-note').value || '';
  if(!window.miTempLines || !window.miTempLines.length) return toast('Añade líneas','error');

  const items = JSON.parse(JSON.stringify(window.miTempLines));
  let subtotal = 0; const vatGroups = {};
  items.forEach(it=>{
    const base = (parseFloat(it.q)||0) * (parseFloat(it.p)||0);
    let baseNet = base;
    if(it.d){
      if(it.dType === 'pct') baseNet -= (base * (parseFloat(it.d)||0)/100);
      else baseNet -= parseFloat(it.d)||0;
    }
    const vatAmt = baseNet * ((parseFloat(it.vat)||0)/100);
    subtotal += baseNet;
    vatGroups[it.vat] = (vatGroups[it.vat] || 0) + vatAmt;
    it.baseNet = baseNet; it.vatAmount = vatAmt; it.total = baseNet + vatAmt;
  });

  const total = subtotal + Object.values(vatGroups).reduce((a,b)=>a+b,0);

  if(!db.proveedores.find(p=>p.n===prov)) db.proveedores.push({n:prov});

}

    <div style="margin-top:8px;">${vatHtml}</div>
    <div style="display:flex;justify-content:flex-end;margin-top:8px;font-weight:900;">${(f.total||0).toFixed(2)}€</div>
    <div style="margin-top:12px;display:flex;gap:8px;"><button class="btn-ghost" onclick="exportInvoiceCSV('${f.id}')">EXPORTAR CSV</button><button class="btn-ghost" onclick="closeModal()">Cerrar</button></div>
  `);
}

function exportInvoiceCSV(fid){
  const f = db.facturas.find(x=>x.id===fid); if(!f) return;
  const header = ['Factura','Proveedor','Fecha','Producto','Cantidad','Unidad','Precio','Descuento','Base','IVA%','IVA','Total','AlbaranesOrigen'];
  const rows = [];
  (f.items||[]).forEach(it=>{
    rows.push([f.num,f.prov,f.date,it.n,it.q,it.unit || '',it.p, (it.dType==='pct'?it.d+'%':it.d), it.baseNet?.toFixed(2) || '', it.vat, it.vatAmount?.toFixed(2) || '', it.total?.toFixed(2) || '', (f.albaranes||[]).join(';')]);
  });
  const csv = [header, ...rows].map(r=>r.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = `factura_${f.num || f.id}.csv`; a.click();
}

function togglePaid(id){ const f = db.facturas.find(x=>x.id===id); if(f){ f.paid = !f.paid; save(); renderAdmin(document.getElementById('app')); } }

/* ================= OMNES, COCINA, STOCK (resumidos) ================= */
function renderOmnes(c){ c.innerHTML = `<div class="glass-card"><h3 style="margin:0;font-weight:900;">OMNES</h3><div class="muted">Resumen OMNES</div></div>`; }
function renderCocina(app){ app.innerHTML = `<div class="glass-card"><h3 style="margin:0;font-weight:900;">RECETARIO</h3><div class="muted">Gestiona fichas técnicas</div></div>`; }
function renderStock(app){
  const filtered = db.ingredientes.filter(i => i.n.toLowerCase().includes(searchFilter.toLowerCase()));
  app.innerHTML = `<div class="glass-card"><h3 style="margin:0;font-weight:900;">ALMACÉN</h3><div style="margin-top:8px;"><input placeholder="🔍 Buscar..." value="${searchFilter}" oninput="searchFilter=this.value;render('Stock')" class="input-premium"></div>
    <div style="margin-top:12px;">${filtered.map(i=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9;"><div><div style="font-weight:800;">${clean(i.n)}</div><div class="muted">${(i.stock||0)} ${i.unit} · ${Number(i.cost||0).toFixed(2)}€</div></div><div style="display:flex;gap:8px;"><button class="btn-ghost" onclick="regMerma('${i.id}')">Merma</button><button class="btn-ghost" onclick="deleteIng('${i.id}')">Borrar</button></div></div>`).join('')}</div>
    <div style="margin-top:12px;"><button class="btn-premium" onclick="editIng(generateID())">+ AÑADIR PRODUCTO</button></div></div>`;
}

/* Stock helpers */
function deleteIng(id){ if(confirm('¿Borrar producto?')){ db.ingredientes = db.ingredientes.filter(i=>i.id!==id); save('Borrado'); render('Stock'); } }
function regMerma(id){ const i = db.ingredientes.find(x=>x.id===id); if(!i) return; showModal('Registrar Merma', `<div>Producto: <b>${clean(i.n)}</b></div><div style="margin-top:8px;"><label>Cantidad perdida</label><input id="m-q" class="input-premium" type="number"></div><div style="margin-top:8px;"><label>Motivo</label><select id="m-r" class="input-premium"><option>Caducidad</option><option>Rotura</option><option>Error Cocina</option><option>Otro</option></select></div><div style="margin-top:12px;"><button class="btn-premium" onclick="saveMerma('${id}')">CONFIRMAR</button></div>`); }
function saveMerma(id){ const i = db.ingredientes.find(x=>x.id===id); const q = parseFloat(document.getElementById('m-q').value)||0; const r = document.getElementById('m-r').value || ''; if(q>0){ i.stock = (parseFloat(i.stock)||0) - q; db.mermas.push({ date:getISO(), n:i.n, q, reason:r, loss: q*(i.cost||0) }); save('Merma registrada'); closeModal(); render('Stock'); } }
function editIng(id){ const i = db.ingredientes.find(x=>x.id===id) || { id, n:'', cost:0, stock:0, unit:'kg', aller:[] }; showModal('Editar producto', `<div><label>Nombre</label><input id="ei-n" class="input-premium" value="${clean(i.n)}"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;"><div><label>Coste</label><input id="ei-c" type="number" class="input-premium" value="${i.cost||0}"></div><div><label>Stock</label><input id="ei-s" type="number" class="input-premium" value="${i.stock||0}"></div></div><div style="margin-top:8px;"><label>Unidad</label><select id="ei-unit" class="input-premium"><option ${i.unit==='kg'?'selected':''} value="kg">kg</option><option ${i.unit==='g'?'selected':''} value="g">g</option><option ${i.unit==='l'?'selected':''} value="l">l</option><option ${i.unit==='ml'?'selected':''} value="ml">ml</option><option ${i.unit==='ud'?'selected':''} value="ud">ud</option></select></div><div style="margin-top:8px;"><button class="btn-premium" onclick="saveIng('${i.id}')">GUARDAR</button></div>`); }
function saveIng(id){ const ing = { id, n: document.getElementById('ei-n').value, cost: parseFloat(document.getElementById('ei-c').value)||0, stock: parseFloat(document.getElementById('ei-s').value)||0, unit: document.getElementById('ei-unit').value || 'kg', aller: [] }; const idx = db.ingredientes.findIndex(x=>x.id===id); if(idx>=0) db.ingredientes[idx] = ing; else db.ingredientes.push(ing); save('Ingrediente guardado'); closeModal(); render('Stock'); }

/* ================= DIARIO ================= */
function renderDiario(app){
  const today = getISO();
  const r = db.diario.find(d=>d.date===today) || { cash:0, card:0, other:0 };
  const total = (r.cash||0) + (r.card||0) + (r.other||0);
  app.innerHTML = `<div class="glass-card"><h3 style="margin:0;font-weight:900;">CIERRE CAJA · ${today}</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;">
      <div><label>Efectivo</label><input id="z-cash" type="number" class="input-premium" value="${r.cash||0}" oninput="calcTotal()"></div>
      <div><label>Tarjeta</label><input id="z-card" type="number" class="input-premium" value="${r.card||0}" oninput="calcTotal()"></div>
    </div>
    <div style="margin-top:8px;"><label>Otros</label><input id="z-other" type="number" class="input-premium" value="${r.other||0}" oninput="calcTotal()"></div>
    <div style="display:flex;justify-content:space-between;margin-top:12px;"><div class="muted">TOTAL DÍA</div><div id="z-total-display" style="font-weight:900;font-size:20px;">${total.toFixed(2)}€</div></div>
    <div style="margin-top:12px;"><button class="btn-premium" onclick="saveZ()">GUARDAR CIERRE</button></div></div>
    <div class="glass-card" style="margin-top:12px;"><canvas id="chartZ" style="width:100%;height:120px;"></canvas></div>`;
  try {
    const ctx = document.getElementById('chartZ');
    new Chart(ctx, { type:'bar', data: { labels: (db.diario||[]).slice(-7).map(d=>d.date.slice(5)), datasets:[{ label:'Ventas', data:(db.diario||[]).slice(-7).map(d=>d.total||0), backgroundColor:'#6366f1' }] } });
  } catch(e){}
}
function calcTotal(){ const c = parseFloat(document.getElementById('z-cash').value)||0; const t = parseFloat(document.getElementById('z-card').value)||0; const o = parseFloat(document.getElementById('z-other').value)||0; document.getElementById('z-total-display').innerText = (c+t+o).toFixed(2) + '€'; }
function saveZ(){ const c = parseFloat(document.getElementById('z-cash').value)||0; const t = parseFloat(document.getElementById('z-card').value)||0; const o = parseFloat(document.getElementById('z-other').value)||0; const tot = c+t+o; const idx = db.diario.findIndex(d=>d.date===getISO()); if(idx>=0) db.diario[idx] = { date:getISO(), cash:c, card:t, other:o, total:tot }; else db.diario.push({ date:getISO(), cash:c, card:t, other:o, total:tot }); save('Cierre OK'); render('Diario'); }

/* ================= MODAL & BACKUP ================= */
function showModal(title, body){
  document.getElementById('m-title').innerText = title;
  document.getElementById('m-body').innerHTML = body;
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal(){ document.getElementById('modal-overlay').classList.add('hidden'); }
function downloadBackup(){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'})); a.download = `Arume_backup_${getISO()}.json`; a.click(); }
function restoreBackup(input){ if(!input.files || !input.files[0]) return; const r = new FileReader(); r.onload = e => { try{ db = JSON.parse(e.target.result); save('Restaurado'); location.reload(); }catch(err){ toast('Backup inválido','error'); } }; r.readAsText(input.files[0]); }

/* init */
init();
</script>
</body>
</html>
